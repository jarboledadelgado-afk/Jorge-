<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#667557">
<title>OREV® Centro de Control Universal v0.1</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f0e6;color:#292923;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:760px;margin:auto;min-height:100vh;padding:16px 16px 110px}header{position:sticky;top:0;background:#f6f0e6ee;backdrop-filter:blur(10px);z-index:20;padding:8px 0}.top,.row,.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between}.brand{font-weight:800}.small{font-size:12px;color:#777}.chip,.action,.card,.round{border:1px solid #d9cfbf;background:#fffaf2;color:inherit}.chip,.round{border-radius:999px;padding:10px 12px}.action,.card{width:100%;border-radius:18px;padding:16px;text-align:left}.action b,.card b{display:block;font-size:18px}.primary{background:#667557;color:#fff;border-color:#667557}.blue{background:#dde4e7}.sage{background:#dfe5d5}.rose{background:#ead8d1}.terra{background:#e4c4b4}.grid{display:grid;gap:10px}.field{width:100%;border:1px solid #d8cdbd;background:#fffdf8;border-radius:14px;padding:14px;font-size:16px;margin:7px 0 10px}.area{min-height:110px}.item{background:#fffaf2;border:1px solid #ded4c5;border-radius:15px;padding:13px;margin:8px 0}.notice,.guide,.ok{padding:13px;border-radius:11px;margin:12px 0;line-height:1.45}.notice{background:#f0e6d6;border-left:4px solid #a76f52}.guide{background:#eef1e8;border-left:4px solid #667557}.ok{background:#e5eddc;border-left:4px solid #667557}.status{font-size:12px;font-weight:700}.s-real{color:#2d6a4f}.s-part{color:#9c6b16}.s-demo{color:#6d597a}.s-block{color:#9b2226}.s-ext{color:#005f73}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);display:flex;background:#fffaf2ee;border-top:1px solid #ded4c5;padding:8px 4px}.bottom button{flex:1;border:0;background:none;font-size:11px}.bottom span{display:block;font-size:20px}h1,h2,h3{font-family:Georgia,serif}.muted{color:#777;font-size:13px}.pill{display:inline-block;padding:4px 8px;border:1px solid #d8cdbd;border-radius:999px;margin:2px;font-size:12px}.hidden{display:none}
</style>
</head>
<body><main class="app"><header><div class="top"><div><div class="brand">OREV® · Centro de Control</div><div class="small">Motor universal · v0.1</div></div><button class="round" onclick="go('settings')">⚙️</button></div><div class="toolbar"><button class="chip" onclick="back()">←</button><button class="chip" onclick="go('home')">⌂</button><button class="chip" onclick="go('diagnostics')">🧪 Diagnóstico</button></div></header><div id="view"></div></main><nav class="bottom"><button onclick="go('home')"><span>🏠</span>Inicio</button><button onclick="go('work')"><span>💼</span>Trabajo</button><button onclick="go('family')"><span>👨‍👩‍👧</span>Familia</button><button onclick="go('house')"><span>🏡</span>Casa</button><button onclick="go('me')"><span>🌿</span>Yo</button></nav>
<script>
const VERSION='0.1',KEY='orev-universal-v0-1';
const blank=()=>({profile:{name:'',goal:'',areas:['work','family','house','me'],onboarded:false},items:[],events:[],claritySessions:[],currentSessionId:null,usage:[]});
let state=load(),history=['home'];
function load(){try{return Object.assign(blank(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return blank()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){return false}}
const V=()=>document.getElementById('view'),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function go(r){history.push(r);render(r)}function back(){if(history.length>1)history.pop();render(history[history.length-1]||'home')}function page(t,sub,b){V().innerHTML='<h2>'+t+'</h2><div class="muted">'+sub+'</div>'+b;scrollTo(0,0)}
function home(){if(!state.profile.onboarded)return onboarding();let n=esc(state.profile.name||'');page('Hola'+(n?', '+n:''),'¿Qué necesitas ahora?','<div class="grid"><button class="action primary" onclick="go(\'clarity\')"><b>✨ Quiero ordenar lo que me pasa</b><span>Mini Sesión de Claridad OREV® persistente.</span></button><button class="action blue" onclick="go(\'day\')"><b>☀️ ¿Qué me toca hoy?</b><span>1 imprescindible, 2 importantes y lo que puede esperar.</span></button><button class="action terra" onclick="go(\'capture\')"><b>➕ Capturar algo</b><span>Trabajo, casa, familia o personal.</span></button><button class="action rose" onclick="go(\'focus\')"><b>🎯 No sé por dónde empezar</b><span>Reduce todo a una siguiente acción.</span></button></div>')}
function onboarding(){page('Bienvenido/a','Configuración inicial universal. No necesitas saber tecnología.','<div class="card"><label>¿Cómo te llamas?</label><input id="on_name" class="field" value="'+esc(state.profile.name)+'"><label>¿Qué quieres organizar principalmente?</label><textarea id="on_goal" class="field area">'+esc(state.profile.goal)+'</textarea><div class="notice">Este prototipo guarda datos localmente en este navegador. Las integraciones externas se conectarán solo con autorización.</div><button class="action primary" onclick="finishOnboarding()"><b>Empezar mi Centro</b></button></div>')}
function finishOnboarding(){state.profile.name=document.getElementById('on_name').value.trim();state.profile.goal=document.getElementById('on_goal').value.trim();state.profile.onboarded=true;save();go('home')}
function capture(){page('➕ Capturar algo','Convierte información dispersa en una acción organizada.','<select id="c_area" class="field"><option value="work">Trabajo</option><option value="family">Familia</option><option value="house">Casa</option><option value="me">Yo</option></select><textarea id="c_text" class="field area" placeholder="¿Qué necesitas recordar o hacer?"></textarea><select id="c_bucket" class="field"><option value="now">AHORA</option><option value="today">HOY</option><option value="week">ESTA SEMANA</option><option value="later">PUEDE ESPERAR</option><option value="waiting">ESPERANDO A OTRA PERSONA</option></select><button class="action primary" onclick="saveItem()"><b>Guardar</b></button>')}
function saveItem(){let text=document.getElementById('c_text').value.trim();if(!text)return;state.items.unshift({id:crypto.randomUUID?.()||Date.now()+Math.random(),text,area:document.getElementById('c_area').value,bucket:document.getElementById('c_bucket').value,done:false,created:new Date().toISOString()});save();go('home')}
function listArea(area,title){let xs=state.items.filter(x=>x.area===area);page(title,'Acciones y pendientes.','<button class="action" onclick="go(\'capture\')"><b>＋ Añadir</b></button>'+xs.map(x=>itemHtml(x)).join(''))}
function itemHtml(x){return '<div class="item"><b>'+esc(x.text)+'</b><div class="muted">'+bucketLabel(x.bucket)+' · '+new Date(x.created).toLocaleString('es')+'</div><button class="chip" onclick="toggleItem(\''+x.id+'\')">'+(x.done?'↺ Reabrir':'✓ Terminar')+'</button></div>'}
function toggleItem(id){let x=state.items.find(a=>String(a.id)===String(id));if(x){x.done=!x.done;if(x.done)x.bucket='done';save();render(history[history.length-1])}}
function bucketLabel(b){return ({now:'AHORA',today:'HOY',week:'ESTA SEMANA',later:'PUEDE ESPERAR',waiting:'ESPERANDO',done:'TERMINADO'})[b]||b}
function day(){let open=state.items.filter(x=>!x.done),rank={now:0,today:1,week:2,later:3,waiting:4};open.sort((a,b)=>(rank[a.bucket]??9)-(rank[b.bucket]??9));let top=open.slice(0,3),rest=open.slice(3);page('☀️ ¿Qué me toca hoy?','No mostramos cuarenta cosas a la vez.','<div class="ok"><b>1 imprescindible</b><p>'+(top[0]?esc(top[0].text):'No hay una prioridad marcada.')+'</p></div><div class="card"><b>2 importantes</b>'+(top.slice(1).map(x=>'<p>• '+esc(x.text)+'</p>').join('')||'<p class="muted">Sin otras prioridades.</p>')+'</div><div class="card"><b>Puede esperar</b>'+(rest.map(x=>'<p>• '+esc(x.text)+'</p>').join('')||'<p class="muted">Nada adicional.</p>')+'</div>')}
function focus(){let next=state.items.find(x=>!x.done&&x.bucket==='now')||state.items.find(x=>!x.done&&x.bucket==='today')||state.items.find(x=>!x.done);page('🎯 Una sola cosa','Reducimos el ruido a la siguiente acción.','<div class="guide"><b>Siguiente acción</b><p>'+(next?esc(next.text):'No hay pendientes abiertos. Captura primero lo que tienes en la cabeza.')+'</p></div>'+(next?'<button class="action primary" onclick="go(\'day\')"><b>Ver mi día</b></button>':'<button class="action primary" onclick="go(\'capture\')"><b>Capturar algo</b></button>'))}
function clarity(){let active=state.claritySessions.find(s=>s.id===state.currentSessionId&&!s.closed);if(active)return renderSession(active);page('✨ Quiero ordenar lo que me pasa','La sesión se guarda y puede continuarse después.','<textarea id="cl_start" class="field area" placeholder="Cuéntalo como salga..."></textarea><button class="action primary" onclick="startSession()"><b>Empezar Sesión de Claridad</b></button>'+state.claritySessions.slice(0,5).map(s=>'<div class="item"><b>'+esc(s.initial.slice(0,80))+'</b><div class="muted">'+(s.closed?'Cerrada':'En curso')+' · mapa '+s.mapVersion+'</div><button class="chip" onclick="openSession(\''+s.id+'\')">Abrir</button></div>').join(''))}
function startSession(){let initial=document.getElementById('cl_start').value.trim();if(!initial)return;let s={id:String(Date.now()),initial,answers:[],corrections:[],mapVersion:1,validation:null,closed:false,created:new Date().toISOString()};state.claritySessions.unshift(s);state.currentSessionId=s.id;save();renderSession(s)}
function openSession(id){state.currentSessionId=id;save();let s=state.claritySessions.find(x=>x.id===id);renderSession(s)}
function sessionQuestions(s){let all=(s.initial+' '+s.answers.map(a=>a.a).join(' ')+' '+s.corrections.join(' ')).toLowerCase();let q=['De todo lo que contaste, ¿qué necesitas entender o resolver hoy?'];if(/posterg|aplaz|no hago|descuidad|no sé por dónde/.test(all))q.push('¿Qué es exactamente lo que estás dejando para después?');if(/cansad|dormir|sueño|agot/.test(all))q.push('¿Qué ha pasado con tu descanso y cómo cambia tu día cuando descansas poco?');if(/trabaj|dinero|pagar|deuda|oblig/.test(all))q.push('¿Qué obligación tiene una consecuencia real si no la atiendes esta semana?');q.push('Justo antes de que esto ocurra, ¿qué suele pasar?');q.push('¿Qué has intentado ya y qué pasó?');return q}
function renderSession(s){let qs=sessionQuestions(s),idx=s.answers.length;if(s.validation==='yes')return closeSessionView(s);if(idx<Math.min(4,qs.length)&&!s.validation){page('🧭 Sesión de Claridad','Pregunta '+(idx+1)+' · una por una.','<div class="guide"><b>'+esc(qs[idx])+'</b></div><textarea id="cl_answer" class="field area"></textarea><button class="action primary" onclick="answerSession(\''+s.id+'\')"><b>Siguiente</b></button><button class="action" onclick="go(\'home\')"><b>Salir y continuar después</b></button>');return}renderMap(s)}
function answerSession(id){let a=document.getElementById('cl_answer').value.trim();if(!a)return;let s=state.claritySessions.find(x=>x.id===id);s.answers.push({q:sessionQuestions(s)[s.answers.length],a});save();renderSession(s)}
function mapData(s){let all=(s.initial+' '+s.answers.map(x=>x.a).join(' ')+' '+s.corrections.join(' ')).toLowerCase(),facts=['Relato inicial registrado.'],interpret=['La persona está intentando dar sentido a lo que vive.'],hyp=[],missing=[];if(/cansad|dormir|sueño|agot/.test(all))hyp.push({t:'El descanso podría estar afectando la capacidad para iniciar o sostener tareas.',c:'MEDIA'});if(/posterg|aplaz|no hago|descuidad/.test(all))hyp.push({t:'La tarea puede estar siendo demasiado grande, poco clara o compitiendo con algo más atractivo.',c:'MEDIA'});if(!hyp.length)hyp.push({t:'Todavía no hay evidencia suficiente para una hipótesis específica.',c:'BAJA'});if(s.answers.length<3)missing.push('Falta explorar más contexto antes de cerrar.');return {facts,interpret,hyp,missing}}
function renderMap(s){let m=mapData(s);page('🗺️ Mapa OREV® · versión '+s.mapVersion,'HECHO ≠ INTERPRETACIÓN ≠ HIPÓTESIS.','<div class="card"><b>● Hechos / relato</b>'+m.facts.map(x=>'<p>• '+esc(x)+'</p>').join('')+'</div><div class="card"><b>◇ Interpretaciones</b>'+m.interpret.map(x=>'<p>• '+esc(x)+'</p>').join('')+'</div><div class="card"><b>△ Hipótesis</b>'+m.hyp.map(x=>'<p>• '+esc(x.t)+' <span class="pill">certeza '+x.c+'</span></p>').join('')+'</div><div class="card"><b>? Información faltante</b>'+(m.missing.map(x=>'<p>• '+esc(x)+'</p>').join('')||'<p class="muted">No se detecta un vacío crítico en esta versión del mapa.</p>')+'</div><div class="guide"><b>¿Este mapa te representa?</b><div class="row"><button class="chip" onclick="validateMap(\''+s.id+'\',\'yes\')">✓ Sí</button><button class="chip" onclick="validateMap(\''+s.id+'\',\'partial\')">◐ En parte</button><button class="chip" onclick="validateMap(\''+s.id+'\',\'no\')">✕ No</button></div></div>')}
function validateMap(id,v){let s=state.claritySessions.find(x=>x.id===id);if(v==='yes'){s.validation='yes';save();return closeSessionView(s)}s.validation=v;save();page('✏️ Revisar mapa','Dime qué representa y qué no.','<textarea id="cl_correction" class="field area"></textarea><button class="action primary" onclick="saveCorrection(\''+id+'\')"><b>Crear mapa revisado</b></button>')}
function saveCorrection(id){let t=document.getElementById('cl_correction').value.trim();if(!t)return;let s=state.claritySessions.find(x=>x.id===id);s.corrections.push(t);s.mapVersion++;s.validation=null;save();renderMap(s)}
function closeSessionView(s){let action=s.answers[0]?.a||'Define una acción pequeña y observable para hoy.';page('✅ Cierre de claridad','Mapa validado por la persona.','<div class="ok"><b>Lo que sabemos</b><p>'+esc(s.initial)+'</p></div><div class="card"><b>Siguiente acción pequeña</b><p>'+esc(action)+'</p></div><div class="card"><b>Pregunta de cierre</b><p>¿Qué sería suficiente hacer hoy para poder soltar el resto hasta mañana?</p></div><button class="action primary" onclick="closeSession(\''+s.id+'\')"><b>Guardar y cerrar sesión</b></button>')}
function closeSession(id){let s=state.claritySessions.find(x=>x.id===id);s.closed=true;state.currentSessionId=null;save();go('home')}
function work(){listArea('work','💼 Trabajo')}function family(){listArea('family','👨‍👩‍👧 Familia')}function house(){listArea('house','🏡 Casa')}function me(){listArea('me','🌿 Yo')}
function settings(){page('⚙️ Ajustes','Privacidad, respaldo y perfil.','<div class="card"><b>Perfil</b><p>'+esc(state.profile.name||'Sin nombre')+'</p><p class="muted">'+esc(state.profile.goal||'Sin objetivo definido')+'</p></div><button class="action" onclick="exportData()"><b>⬇️ Exportar respaldo JSON</b></button><label class="action">⬆️ Importar respaldo<input type="file" accept="application/json" onchange="importData(this)" style="display:block;margin-top:8px"></label><button class="action rose" onclick="resetOnboarding()"><b>Rehacer onboarding</b></button>')}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='orev-centro-control-respaldo.json';a.click();URL.revokeObjectURL(a.href)}
function importData(i){let f=i.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{state=Object.assign(blank(),JSON.parse(r.result));save();alert('Respaldo importado');go('home')}catch(e){alert('Archivo no válido')}};r.readAsText(f)}
function resetOnboarding(){state.profile.onboarded=false;save();go('home')}
function diagnostics(){let tests=[['Persistencia local',(()=>{let k='__t';localStorage.setItem(k,'1');let ok=localStorage.getItem(k)==='1';localStorage.removeItem(k);return ok})()],['Navegador online',navigator.onLine],['Micrófono navegador',!!(window.SpeechRecognition||window.webkitSpeechRecognition)],['Onboarding',state.profile.onboarded],['Sesiones OREV persistentes',Array.isArray(state.claritySessions)],['Archivos reales en nube',false],['Gmail OAuth',false],['Google Calendar',false],['Drive privado',false],['Backend clínico privado',false]];page('🧪 Diagnóstico automático','PASS local + dependencias externas.','<div class="grid">'+tests.map(t=>'<div class="card"><b>'+(t[1]?'✅ ':'⏳ ')+esc(t[0])+'</b><span class="status '+(t[1]?'s-real':'s-ext')+'">'+(t[1]?'FUNCIONAL REAL':'REQUIERE INTEGRACIÓN EXTERNA')+'</span></div>').join('')+'</div><div class="notice"><b>Regla:</b> este diagnóstico no declara PASS de Gmail, Calendar, Drive ni clínica hasta existir una prueba real.</div>')}
function render(r){({home,work,family,house,me,capture,day,focus,clarity,settings,diagnostics}[r]||home)()}
render('home');
</script></body></html>
