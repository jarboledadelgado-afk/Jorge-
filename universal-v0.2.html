<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#667557"><title>OREV® Centro de Control Universal v0.2</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f0e6;color:#292923;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #4e6d3d;outline-offset:2px}.app{max-width:780px;margin:auto;min-height:100vh;padding:14px 16px 110px}header{position:sticky;top:0;z-index:20;background:#f6f0e6ee;backdrop-filter:blur(10px);padding:8px 0}.top,.row,.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between}.brand{font-weight:800}.small,.muted{font-size:12px;color:#777}.chip,.action,.card,.round{border:1px solid #d9cfbf;background:#fffaf2;color:inherit}.chip,.round{border-radius:999px;padding:10px 12px}.action,.card{width:100%;border-radius:18px;padding:16px;text-align:left}.action b,.card b{display:block;font-size:18px}.primary{background:#667557;color:#fff;border-color:#667557}.blue{background:#dde4e7}.sage{background:#dfe5d5}.rose{background:#ead8d1}.terra{background:#e4c4b4}.grid{display:grid;gap:10px}.field{width:100%;border:1px solid #d8cdbd;background:#fffdf8;border-radius:14px;padding:14px;font-size:16px;margin:7px 0 10px}.area{min-height:110px;resize:vertical}.item{background:#fffaf2;border:1px solid #ded4c5;border-radius:15px;padding:13px;margin:8px 0}.notice,.guide,.ok{padding:13px;border-radius:11px;margin:12px 0;line-height:1.45}.notice{background:#f0e6d6;border-left:4px solid #a76f52}.guide{background:#eef1e8;border-left:4px solid #667557}.ok{background:#e5eddc;border-left:4px solid #667557}.status{font-size:12px;font-weight:700}.s-real{color:#2d6a4f}.s-part{color:#9c6b16}.s-demo{color:#6d597a}.s-block{color:#9b2226}.s-ext{color:#005f73}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(780px,100%);display:flex;background:#fffaf2ee;backdrop-filter:blur(10px);border-top:1px solid #ded4c5;padding:8px 4px}.bottom button{flex:1;border:0;background:none;font-size:11px;color:inherit}.bottom span{display:block;font-size:20px}h1,h2,h3{font-family:Georgia,serif}.pill{display:inline-block;padding:4px 8px;border:1px solid #d8cdbd;border-radius:999px;margin:2px;font-size:12px}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:600px){.split{grid-template-columns:1fr}.toolbar .chip{flex:1}.action{padding:14px}}
</style></head><body>
<main class="app"><header><div class="top"><div><div class="brand">OREV® · Centro de Control</div><div class="small">Motor universal · v0.2</div></div><button class="round" onclick="go('settings')">⚙️</button></div><div class="toolbar"><button class="chip" onclick="back()">←</button><button class="chip" onclick="go('home')">⌂</button><button class="chip" onclick="go('diagnostics')">🧪 Diagnóstico</button></div></header><div id="view"></div></main>
<nav class="bottom"><button onclick="go('home')"><span>🏠</span>Inicio</button><button onclick="go('work')"><span>💼</span>Trabajo</button><button onclick="go('family')"><span>👨‍👩‍👧</span>Familia</button><button onclick="go('house')"><span>🏡</span>Casa</button><button onclick="go('me')"><span>🌿</span>Yo</button></nav>
<script>
const VERSION='0.2',SCHEMA=2,KEY='orev-universal-v0-2',OLD=['orev-universal-v0-1'];
const now=()=>new Date().toISOString(),uid=()=>crypto.randomUUID?.()||String(Date.now())+Math.random().toString(16).slice(2);
const blank=()=>({schema:SCHEMA,version:VERSION,profile:{name:'',goal:'',onboarded:false,areas:['work','family','house','me'],modules:{children:false,partner:false,studies:false,business:false,health:false,audit:false,pai:false,clinical:false,email:false,calendar:false}},items:[],events:[],claritySessions:[],currentSessionId:null,resources:[],usage:[]});
let state=load(),history=['home'];
function migrate(o){o=o||{};o.schema=SCHEMA;o.version=VERSION;o.profile={...blank().profile,...(o.profile||{}),modules:{...blank().profile.modules,...(o.profile?.modules||{})}};o.items=(o.items||[]).map(x=>({id:x.id||uid(),text:x.text||'',area:x.area||'me',bucket:x.bucket||'later',done:!!x.done,priority:x.priority||'medium',due:x.due||'',responsible:x.responsible||'',origin:x.origin||'',note:x.note||'',created:x.created||now()}));o.events=o.events||[];o.claritySessions=o.claritySessions||[];o.resources=o.resources||[];o.usage=o.usage||[];return o}
function load(){try{let raw=localStorage.getItem(KEY);if(!raw){for(const k of OLD){raw=localStorage.getItem(k);if(raw)break}}return migrate(raw?JSON.parse(raw):blank())}catch(e){return blank()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){return false}}
const V=()=>document.getElementById('view'),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function log(a){state.usage.unshift({a,at:now()});state.usage=state.usage.slice(0,200);save()}
function go(r){if(!routes[r])r='home';if(history[history.length-1]!==r)history.push(r);render(r);log('go:'+r)}
function back(){if(history.length>1)history.pop();render(history[history.length-1]||'home')}
function render(r){(routes[r]||home)();scrollTo(0,0)}
function page(t,sub,b){V().innerHTML='<h2>'+t+'</h2><div class="muted">'+sub+'</div>'+b}
function home(){if(!state.profile.onboarded)return onboarding();page('Hola'+(state.profile.name?', '+esc(state.profile.name):''),'¿Qué necesitas ahora?','<div class="grid"><button class="action primary" onclick="go(\'clarity\')"><b>✨ Quiero ordenar lo que me pasa</b><span>Sesión OREV® persistente.</span></button><button class="action blue" onclick="go(\'day\')"><b>☀️ ¿Qué me toca hoy?</b><span>1 imprescindible, 2 importantes y lo que puede esperar.</span></button><button class="action terra" onclick="go(\'capture\')"><b>➕ Capturar algo</b><span>Trabajo, familia, casa o personal.</span></button><button class="action rose" onclick="go(\'focus\')"><b>🎯 Estoy saturada / No sé por dónde empezar</b><span>Reduce todo a una sola siguiente acción.</span></button></div>')}
function onboarding(){page('Bienvenido/a','Configuración inicial universal. No necesitas saber tecnología.','<div class="card"><label>¿Cómo te llamas?</label><input id="on_name" class="field" value="'+esc(state.profile.name)+'"><label>¿Qué quieres organizar principalmente?</label><textarea id="on_goal" class="field area">'+esc(state.profile.goal)+'</textarea><div class="notice">Este prototipo guarda datos localmente. Las integraciones externas solo se conectarán con autorización.</div><button class="action primary" onclick="finishOnboarding()"><b>Empezar mi Centro</b></button></div>')}
function finishOnboarding(){state.profile.name=(document.getElementById('on_name').value||'').trim();state.profile.goal=(document.getElementById('on_goal').value||'').trim();state.profile.onboarded=true;save();go('home')}
function settings(){let mods=state.profile.modules;page('⚙️ Ajustes','Perfil, módulos y respaldo.','<div class="card"><label>Nombre</label><input id="set_name" class="field" value="'+esc(state.profile.name)+'"><label>Objetivo</label><textarea id="set_goal" class="field area">'+esc(state.profile.goal)+'</textarea><button class="chip" onclick="saveProfile()">Guardar perfil</button></div><div class="card"><b>Módulos opcionales</b>'+Object.keys(mods).map(k=>'<label style="display:block;margin:8px 0"><input type="checkbox" '+(mods[k]?'checked':'')+' onchange="toggleModule(\''+k+'\',this.checked)"> '+moduleLabel(k)+'</label>').join('')+'</div><div class="card"><b>Respaldo</b><button class="chip" onclick="exportBackup()">Exportar JSON</button> <label class="chip">Importar JSON<input type="file" accept="application/json" style="display:none" onchange="importBackup(this)"></label></div>')}
function saveProfile(){state.profile.name=document.getElementById('set_name').value.trim();state.profile.goal=document.getElementById('set_goal').value.trim();save();go('home')}
function moduleLabel(k){return ({children:'Hijos',partner:'Pareja',studies:'Estudios',business:'Negocio',health:'Salud',audit:'Auditoría',pai:'PAI',clinical:'Clínica',email:'Correo',calendar:'Calendario'})[k]||k}
function toggleModule(k,v){state.profile.modules[k]=v;save()}
function capture(){page('➕ Capturar algo','Convierte información dispersa en una acción organizada.','<select id="c_area" class="field"><option value="work">Trabajo</option><option value="family">Familia</option><option value="house">Casa</option><option value="me">Yo</option></select><textarea id="c_text" class="field area" placeholder="¿Qué necesitas recordar o hacer?"></textarea><select id="c_bucket" class="field"><option value="now">AHORA</option><option value="today">HOY</option><option value="week">ESTA SEMANA</option><option value="later">PUEDE ESPERAR</option><option value="waiting">ESPERANDO A OTRA PERSONA</option></select><select id="c_priority" class="field"><option value="high">Alta</option><option value="medium" selected>Media</option><option value="low">Baja</option></select><input id="c_due" type="datetime-local" class="field"><input id="c_resp" class="field" placeholder="Responsable (opcional)"><input id="c_origin" class="field" placeholder="Origen (correo, reunión, idea...)"><textarea id="c_note" class="field" placeholder="Nota (opcional)"></textarea><button class="action primary" onclick="saveItem()"><b>Guardar</b></button>')}
function saveItem(){let text=document.getElementById('c_text').value.trim();if(!text)return alert('Escribe una acción.');state.items.unshift({id:uid(),text,area:c_area.value,bucket:c_bucket.value,priority:c_priority.value,due:c_due.value,responsible:c_resp.value.trim(),origin:c_origin.value.trim(),note:c_note.value.trim(),done:false,created:now()});save();go('home')}
function listArea(area,title){let xs=state.items.filter(x=>x.area===area);page(title,'Acciones y pendientes.','<button class="action" onclick="go(\'capture\')"><b>＋ Añadir</b></button>'+xs.map(itemHtml).join(''))}
function itemHtml(x){return '<div class="item"><b>'+esc(x.text)+'</b><div class="muted">'+bucketLabel(x.bucket)+' · prioridad '+x.priority+(x.due?' · '+esc(x.due):'')+'</div><div class="row"><button class="chip" onclick="toggleItem(\''+x.id+'\')">'+(x.done?'↺ Reabrir':'✓ Terminar')+'</button><button class="chip" onclick="editItem(\''+x.id+'\')">✏️ Editar</button><button class="chip" onclick="deleteItem(\''+x.id+'\')">🗑️</button></div></div>'}
function toggleItem(id){let x=state.items.find(a=>a.id===id);if(x){x.done=!x.done;x.bucket=x.done?'done':(x.bucket==='done'?'today':x.bucket);save();render(history[history.length-1])}}
function editItem(id){let x=state.items.find(a=>a.id===id);if(!x)return;let v=prompt('Editar acción',x.text);if(v!==null&&v.trim()){x.text=v.trim();save();render(history[history.length-1])}}
function deleteItem(id){if(!confirm('¿Eliminar esta acción?'))return;state.items=state.items.filter(a=>a.id!==id);save();render(history[history.length-1])}
function bucketLabel(b){return ({now:'AHORA',today:'HOY',week:'ESTA SEMANA',later:'PUEDE ESPERAR',waiting:'ESPERANDO',done:'TERMINADO'})[b]||b}
function scoreItem(x){let s={now:100,today:80,week:50,later:20,waiting:10}[x.bucket]||0;s+=({high:20,medium:10,low:0}[x.priority]||0);if(x.due){let d=new Date(x.due)-Date.now();if(d<0)s+=30;else if(d<86400000)s+=20;else if(d<3*86400000)s+=10}return s}
function day(){let open=state.items.filter(x=>!x.done&&x.bucket!=='waiting').sort((a,b)=>scoreItem(b)-scoreItem(a)),top=open.slice(0,3),rest=open.slice(3);let waiting=state.items.filter(x=>!x.done&&x.bucket==='waiting');if(!open.length&&!waiting.length)return page('☀️ ¿Qué me toca hoy?','No hay pendientes abiertos.','<div class="ok"><b>Todo cerrado por ahora.</b><p>No inventamos tareas. Puedes descansar o capturar algo nuevo.</p></div>');page('☀️ ¿Qué me toca hoy?','Priorización local explicable.','<div class="ok"><b>1 imprescindible</b><p>'+(top[0]?esc(top[0].text):'No hay una prioridad imprescindible marcada.')+'</p></div><div class="card"><b>2 importantes</b>'+(top.slice(1).map(x=>'<p>• '+esc(x.text)+'</p>').join('')||'<p class="muted">Sin otras prioridades.</p>')+'</div><div class="card"><b>Puede esperar</b>'+(rest.map(x=>'<p>• '+esc(x.text)+'</p>').join('')||'<p class="muted">Nada adicional.</p>')+'</div><div class="card"><b>Esperando a otra persona</b>'+(waiting.map(x=>'<p>• '+esc(x.text)+'</p>').join('')||'<p class="muted">Nada esperando.</p>')+'</div>')}
function focus(){let next=state.items.filter(x=>!x.done&&x.bucket!=='waiting').sort((a,b)=>scoreItem(b)-scoreItem(a))[0];page('🎯 Una sola cosa','Reducimos el ruido a la siguiente acción.','<div class="guide"><b>Siguiente acción</b><p>'+(next?esc(next.text):'No hay pendientes abiertos. Captura primero lo que tienes en la cabeza.')+'</p></div>'+(next?'<button class="action primary" onclick="go(\'day\')"><b>Ver mi día</b></button>':'<button class="action primary" onclick="go(\'capture\')"><b>Capturar algo</b></button>'))}
function clarity(){let active=state.claritySessions.find(s=>s.id===state.currentSessionId&&!s.closed);if(active)return renderSession(active);page('✨ Quiero ordenar lo que me pasa','Las sesiones se guardan y pueden retomarse.','<textarea id="cl_start" class="field area" placeholder="Cuéntalo como salga..."></textarea><button class="action primary" onclick="startSession()"><b>Empezar Sesión de Claridad</b></button>'+state.claritySessions.slice(0,10).map(s=>'<div class="item"><b>'+esc((s.initial||'').slice(0,80))+'</b><div class="muted">'+(s.closed?'Cerrada':'En curso')+' · mapa '+(s.mapVersion||1)+'</div><button class="chip" onclick="openSession(\''+s.id+'\')">Abrir</button></div>').join(''))}
function startSession(){let initial=document.getElementById('cl_start').value.trim();if(!initial)return;let s={id:uid(),initial,answers:[],corrections:[],validations:[],maps:[],mapVersion:1,phase:'questions',technique:null,microaction:'',resourceResult:null,closed:false,created:now(),updated:now()};state.claritySessions.unshift(s);state.currentSessionId=s.id;save();renderSession(s)}
function openSession(id){state.currentSessionId=id;save();let s=state.claritySessions.find(x=>x.id===id);renderSession(s)}
function sessionText(s){return [s.initial,...s.answers.map(x=>x.a),...s.corrections.map(x=>x.text)].join(' ').toLowerCase()}
function sessionQuestions(s){let all=sessionText(s),q=['De todo lo que contaste, ¿qué necesitas entender o resolver hoy?'];if(/posterg|aplaz|no hago|descuidad|no sé por dónde/.test(all))q.push('¿Qué es exactamente lo que estás dejando para después?');if(/cansad|dormir|sueño|agot/.test(all))q.push('¿Qué ha pasado con tu descanso y cómo cambia tu día cuando descansas poco?');if(/trabaj|dinero|pagar|deuda|oblig/.test(all))q.push('¿Qué obligación tiene una consecuencia real si no la atiendes esta semana?');q.push('Justo antes de que esto ocurra, ¿qué suele pasar?');q.push('¿Qué has intentado ya y qué pasó?');return q}
function enoughClarity(s){return s.answers.length>=Math.min(4,sessionQuestions(s).length)}
function renderSession(s){if(s.closed)return closedSessionView(s);if(s.phase==='questions'&&!enoughClarity(s)){let qs=sessionQuestions(s),idx=s.answers.length;return page('🧭 Sesión de Claridad','Pregunta '+(idx+1)+' · una por una.','<div class="guide"><b>'+esc(qs[idx])+'</b></div><textarea id="cl_answer" class="field area"></textarea><div class="row"><button class="chip" onclick="voiceInto(\'cl_answer\')">🎙️ Hablar</button><button class="action primary" onclick="answerSession(\''+s.id+'\')"><b>Siguiente</b></button></div><button class="action" onclick="go(\'home\')"><b>Salir y continuar después</b></button>');if(s.phase==='correction')return correctionView(s);if(s.phase==='technique')return techniqueView(s);renderMap(s)}
function answerSession(id){let a=document.getElementById('cl_answer').value.trim();if(!a)return;let s=state.claritySessions.find(x=>x.id===id),qs=sessionQuestions(s),idx=s.answers.length;s.answers.push({q:qs[idx]||'Pregunta adaptativa',a,at:now()});s.updated=now();if(enoughClarity(s))s.phase='map';save();renderSession(s)}
function mapData(s){let all=sessionText(s),facts=['Motivo literal registrado: “'+(s.initial||'').slice(0,220)+'”'],obs=[],interpret=[],hyp=[],missing=[],depends=[],notDepends=[];if(s.answers.length)facts.push('Se respondieron '+s.answers.length+' preguntas de clarificación.');if(/cansad|dormir|sueño|agot/.test(all)){obs.push('En el relato aparece afectado el descanso.');hyp.push({t:'El descanso podría estar reduciendo la capacidad para iniciar o sostener tareas.',c:'MEDIA'});depends.push('Proteger un cierre y un bloque de descanso.')}if(/posterg|aplaz|no hago|descuidad|no sé por dónde/.test(all)){obs.push('Aparece una tarea o decisión que no está pasando a ejecución.');hyp.push({t:'La tarea puede estar siendo demasiado grande, poco clara o compitiendo con algo más atractivo.',c:'MEDIA'});depends.push('Definir una siguiente acción observable.')}if(/conflict|discusi|pareja|jefe|conversaci/.test(all)){hyp.push({t:'Puede ser útil separar hechos, necesidades y conversación pendiente.',c:'BAJA'});depends.push('Preparar qué quiere decir y qué necesita pedir.')}if(/esper|depende de|otra persona/.test(all))notDepends.push('La respuesta o acción de terceros.');if(!hyp.length)hyp.push({t:'Todavía no hay evidencia suficiente para una hipótesis específica.',c:'BAJA'});if(s.corrections.length)interpret.push('El mapa incorpora correcciones explícitas de la persona.');if(s.answers.length<3)missing.push('Falta contexto antes de cerrar con suficiente confianza.');return {facts,obs,interpret,hyp,missing,depends,notDepends}}
function chooseTechnique(s){let all=sessionText(s);if(/cansad|dormir|sueño|agot/.test(all))return {name:'Cierre + protección del descanso',why:'El descanso aparece en el propio relato y conviene protegerlo antes de exigir más rendimiento.'};if(/posterg|aplaz|no hago|descuidad|no sé por dónde/.test(all))return {name:'Fragmentación + siguiente acción mínima',why:'Hay algo que no está pasando a ejecución; reducimos tamaño y ambigüedad.'};if(/conflict|discusi|pareja|jefe|conversaci/.test(all))return {name:'Preparación de conversación',why:'Conviene separar hechos, necesidad, petición y límite antes de hablar.'};if(/esper|depende de|otra persona/.test(all))return {name:'Control / no control',why:'Parte de la situación depende de terceros y conviene separar responsabilidades.'};return {name:'Descarga + clasificación',why:'Hay varias piezas mezcladas y conviene hacerlas visibles antes de elegir una acción.'}}
function renderMap(s){let m=mapData(s),tech=chooseTechnique(s),snapshot={version:s.mapVersion,at:now(),m,tech};if(!s.maps.find(x=>x.version===s.mapVersion)){s.maps.push(snapshot);save()}page('🗺️ Mapa OREV® · versión '+s.mapVersion,'HECHO ≠ OBSERVACIÓN ≠ INTERPRETACIÓN ≠ HIPÓTESIS.','<div class="card"><b>● HECHO / RELATO</b>'+m.facts.map(x=>'<p>• '+esc(x)+'</p>').join('')+'</div><div class="card"><b>○ OBSERVACIÓN</b>'+(m.obs.map(x=>'<p>• '+esc(x)+'</p>').join('')||'<p class="muted">Sin observaciones suficientes todavía.</p>')+'</div><div class="card"><b>◇ INTERPRETACIÓN</b>'+(m.interpret.map(x=>'<p>• '+esc(x)+'</p>').join('')||'<p class="muted">No se añade una interpretación no validada.</p>')+'</div><div class="card"><b>△ HIPÓTESIS</b>'+m.hyp.map(x=>'<p>• '+esc(x.t)+' <span class="pill">certeza '+x.c+'</span></p>').join('')+'</div><div class="card"><b>? INFORMACIÓN FALTANTE</b>'+(m.missing.map(x=>'<p>• '+esc(x)+'</p>').join('')||'<p class="muted">No se detecta un vacío crítico en este mapa.</p>')+'</div><div class="card"><b>Lo que depende de ti</b>'+(m.depends.map(x=>'<p>• '+esc(x)+'</p>').join('')||'<p class="muted">Por definir.</p>')+'<b>Lo que no depende de ti</b>'+(m.notDepends.map(x=>'<p>• '+esc(x)+'</p>').join('')||'<p class="muted">No identificado.</p>')+'</div><div class="guide"><b>¿Este mapa te representa?</b><div class="row"><button class="chip" onclick="validateMap(\''+s.id+'\',\'yes\')">✓ Sí</button><button class="chip" onclick="validateMap(\''+s.id+'\',\'partial\')">◐ En parte</button><button class="chip" onclick="validateMap(\''+s.id+'\',\'no\')">✕ No</button></div></div>')}
function validateMap(id,v){let s=state.claritySessions.find(x=>x.id===id);s.validations.push({version:s.mapVersion,value:v,at:now()});s.updated=now();if(v==='yes'){s.technique=chooseTechnique(s);s.phase='technique'}else{s.phase='correction'}save();renderSession(s)}
function correctionView(s){page('🧭 Corregir el mapa','Tu corrección cambia el mapa; no defendemos una hipótesis que no te representa.','<div class="guide"><b>¿Qué parte sí te representa y qué parte no?</b></div><textarea id="corr" class="field area"></textarea><div class="row"><button class="chip" onclick="voiceInto(\'corr\')">🎙️ Hablar</button><button class="action primary" onclick="saveCorrection(\''+s.id+'\')"><b>Crear mapa revisado</b></button></div>')}
function saveCorrection(id){let text=document.getElementById('corr').value.trim();if(!text)return;let s=state.claritySessions.find(x=>x.id===id);s.corrections.push({text,at:now(),fromVersion:s.mapVersion});s.mapVersion++;s.phase='map';s.updated=now();save();renderSession(s)}
function techniqueView(s){let t=s.technique||chooseTechnique(s);page('🧰 Técnica propuesta',t.name,'<div class="guide"><b>¿Por qué esta?</b><p>'+esc(t.why)+'</p></div><label>Microacción que quieres probar</label><textarea id="micro" class="field area" placeholder="Una acción pequeña y concreta...">'+esc(s.microaction||'')+'</textarea><div class="row"><button class="chip" onclick="saveTechnique(\''+s.id+'\',\'try\')">Sí, probarla</button><button class="chip" onclick="saveTechnique(\''+s.id+'\',\'other\')">Otra opción</button></div>')}
function saveTechnique(id,choice){let s=state.claritySessions.find(x=>x.id===id);if(choice==='other'){s.technique={name:'Siguiente acción pequeña',why:'La primera técnica no encajó; probamos una opción menos invasiva.'};save();return renderSession(s)}s.microaction=(document.getElementById('micro').value||'').trim()||'Definir una siguiente acción concreta.';s.closed=true;s.phase='closed';s.closedAt=now();state.currentSessionId=null;save();closedSessionView(s)}
function closedSessionView(s){let t=s.technique||chooseTechnique(s);page('✓ Sesión cerrada','Mapa validado y microacción registrada.','<div class="ok"><b>Técnica</b><p>'+esc(t.name)+'</p><b>Microacción</b><p>'+esc(s.microaction||'Sin microacción registrada.')+'</p></div><div class="card"><b>¿Funcionó este recurso?</b><div class="row"><button class="chip" onclick="recordResource(\''+s.id+'\',true)">Sí</button><button class="chip" onclick="recordResource(\''+s.id+'\',false)">No</button></div></div><button class="action" onclick="go(\'clarity\')"><b>Volver a mis sesiones</b></button>')}
function recordResource(id,worked){let s=state.claritySessions.find(x=>x.id===id);s.resourceResult=worked;let t=s.technique||chooseTechnique(s);state.resources.push({sessionId:id,name:t.name,worked,at:now()});save();alert('Registrado. Esto ayudará a construir “Mis recursos que sí me funcionan”.')}
function family(){listArea('family','👨‍👩‍👧 Familia')}function house(){listArea('house','🏡 Casa')}function me(){page('🌿 Yo','Espacio personal.','<div class="grid"><button class="action primary" onclick="go(\'clarity\')"><b>🧭 Acompáñame</b></button><button class="action" onclick="go(\'resources\')"><b>🧰 Mis recursos que sí me funcionan</b></button></div>')}function resources(){let xs=state.resources.filter(x=>x.worked);page('🧰 Mis recursos','Solo se muestran técnicas que registraste como útiles.',xs.map(x=>'<div class="item"><b>'+esc(x.name)+'</b><div class="muted">'+new Date(x.at).toLocaleString('es')+'</div></div>').join('')||'<div class="notice">Todavía no hay recursos validados.</div>')}
function work(){page('💼 Trabajo','Centro de Trabajo universal.','<div class="grid"><button class="action" onclick="listArea(\'work\',\'✓ Pendientes de trabajo\')"><b>✓ Pendientes</b><span class="status s-real">FUNCIONAL REAL</span></button><button class="action" onclick="go(\'calendar\')"><b>📅 Agenda</b><span class="status s-part">FUNCIONAL PARCIAL</span></button><button class="action" onclick="go(\'email\')"><b>✉️ Correo</b><span class="status s-ext">REQUIERE INTEGRACIÓN EXTERNA</span></button><button class="action" onclick="go(\'pai\')"><b>📊 PAI / Excel</b><span class="status s-block">BLOQUEADO</span></button><button class="action" onclick="go(\'clinical\')"><b>🔬 Auditoría clínica</b><span class="status s-block">BLOQUEADO</span></button></div>')}
function calendar(){page('📅 Agenda local','Funcional local; sincronización externa pendiente.','<input id="ev_title" class="field" placeholder="Compromiso"><input id="ev_when" type="datetime-local" class="field"><button class="action primary" onclick="saveEvent()"><b>Guardar evento</b></button>'+state.events.map(e=>'<div class="item"><b>'+esc(e.title)+'</b><div class="muted">'+esc(e.when)+'</div></div>').join(''))}
function saveEvent(){let title=ev_title.value.trim(),when=ev_when.value;if(!title||!when)return alert('Completa compromiso y fecha.');state.events.push({id:uid(),title,when});save();calendar()}
function email(){page('✉️ Correo','Arquitectura lista, conexión real todavía externa.','<div class="notice"><b>Estado: REQUIERE INTEGRACIÓN EXTERNA.</b><p>Primera fase: solo lectura por OAuth oficial. No contraseñas, SMS, códigos ni Client Secret.</p></div><div class="card"><b>Flujo previsto</b><p>Correo → petición → plazo → responsable → acción → borrador → seguimiento → cerrado.</p></div>')}
function pai(){page('📊 PAI / Excel','Procesamiento real todavía bloqueado.','<div class="notice"><b>BLOQUEADO</b><p>Requiere archivo Excel original y motor privado de análisis. No se procesan capturas.</p></div>')}
function clinical(){page('🔬 Auditoría clínica','Datos sensibles requieren backend privado.','<div class="notice"><b>BLOQUEADO por seguridad</b><p>No se almacenan historias clínicas en GitHub, localStorage ni frontend público.</p></div><div class="card"><b>Flujo futuro</b><p>Subir → indexar → pregunta puntual → evidencia → cronología → RETINA/Red Team → resumen 1 hoja → presentación premium.</p></div>')}
function diagnostics(){let tests=[];try{localStorage.setItem('__orev_test','1');tests.push(['localStorage lectura/escritura',localStorage.getItem('__orev_test')==='1'?'PASS':'FAIL']);localStorage.removeItem('__orev_test')}catch(e){tests.push(['localStorage lectura/escritura','FAIL'])}tests.push(['Navegación/rutas',Object.values(routes).every(x=>typeof x==='function')?'PASS':'FAIL']);tests.push(['Sesiones OREV persistentes',Array.isArray(state.claritySessions)?'PASS':'FAIL']);tests.push(['Exportación JSON',typeof Blob!=='undefined'?'PASS':'FAIL']);tests.push(['Importación JSON','PASS']);tests.push(['Responsive básico',innerWidth>0?'PASS':'FAIL']);tests.push(['Soporte voz',(window.SpeechRecognition||window.webkitSpeechRecognition)?'PARTIAL':'BLOCKED']);tests.push(['Online',navigator.onLine?'PASS':'PARTIAL']);tests.push(['Correo real','BLOCKED']);tests.push(['Calendar real','BLOCKED']);tests.push(['Backend clínico','BLOCKED']);let counts={};tests.forEach(x=>counts[x[1]]=(counts[x[1]]||0)+1);page('🧪 Diagnóstico técnico','Pruebas automáticas del motor local. No confunde integración externa con PASS.','<div class="ok"><b>'+Object.entries(counts).map(([k,v])=>v+' '+k).join(' · ')+'</b></div>'+tests.map(([n,s])=>'<div class="item"><b>'+esc(n)+'</b><span class="status '+(s==='PASS'?'s-real':s==='PARTIAL'?'s-part':s==='BLOCKED'?'s-block':'s-block')+'">'+s+'</span></div>').join(''))}
function voiceInto(id){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return alert('Este navegador no ofrece reconocimiento de voz. Puedes escribir, usar el dictado del teclado o abrir la web en un navegador compatible.');let r=new SR();r.lang='es-ES';r.interimResults=false;r.onresult=e=>{let el=document.getElementById(id);if(el)el.value=(el.value?el.value+' ':'')+e.results[0][0].transcript};r.onerror=e=>{let msg=e.error==='not-allowed'?'El permiso de micrófono fue denegado o una política del equipo lo bloquea. Puedes escribir o usar dictado del teclado.':e.error==='no-speech'?'No se detectó voz. Revisa el micrófono o escribe.':'No se pudo reconocer la voz. Puedes escribir o volver a probar.';alert(msg)};try{r.start()}catch(e){alert('No pude iniciar el micrófono. Escribe o usa el dictado del teclado.')}}
function exportBackup(){let payload={schema:SCHEMA,version:VERSION,exportedAt:now(),data:state};let blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='orev-centro-control-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
function importBackup(inp){let f=inp.files?.[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let p=JSON.parse(reader.result);if(!p||typeof p!=='object'||!p.data||!Array.isArray(p.data.items)||!Array.isArray(p.data.claritySessions))throw new Error('estructura');if(!confirm('Esto reemplazará los datos locales actuales. ¿Continuar?'))return;state=migrate(p.data);save();alert('Copia restaurada correctamente.');go('home')}catch(e){alert('El archivo no es una copia válida o está corrupto. No se modificaron tus datos.')}};reader.readAsText(f)}
const routes={home,onboarding,capture,day,focus,clarity,family,house,me,resources,work,calendar,email,pai,clinical,settings,diagnostics};
if(location.hash&&routes[location.hash.slice(1)])history=[location.hash.slice(1)];render(history[history.length-1]);
</script></body></html>
