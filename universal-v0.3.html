*{box-sizing:border-box}body{margin:0;background:#f6f0e6;color:#292923;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #4e6d3d;outline-offset:2px}.app{max-width:780px;margin:auto;min-height:100vh;padding:14px 16px 110px}header{position:sticky;top:0;z-index:20;background:#f6f0e6ee;backdrop-filter:blur(10px);padding:8px 0}.top,.row,.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between}.brand{font-weight:800}.small,.muted{font-size:12px;color:#777}.chip,.action,.card,.round{border:1px solid #d9cfbf;background:#fffaf2;color:inherit}.chip,.round{border-radius:999px;padding:10px 12px}.action,.card{width:100%;border-radius:18px;padding:16px;text-align:left}.action b,.card b{display:block;font-size:18px}.primary{background:#667557;color:#fff;border-color:#667557}.blue{background:#dde4e7}.sage{background:#dfe5d5}.rose{background:#ead8d1}.terra{background:#e4c4b4}.grid{display:grid;gap:10px}.field{width:100%;border:1px solid #d8cdbd;background:#fffdf8;border-radius:14px;padding:14px;font-size:16px;margin:7px 0 10px}.area{min-height:110px;resize:vertical}.item{background:#fffaf2;border:1px solid #ded4c5;border-radius:15px;padding:13px;margin:8px 0}.notice,.guide,.ok{padding:13px;border-radius:11px;margin:12px 0;line-height:1.45}.notice{background:#f0e6d6;border-left:4px solid #a76f52}.guide{background:#eef1e8;border-left:4px solid #667557}.ok{background:#e5eddc;border-left:4px solid #667557}.status{font-size:12px;font-weight:700}.s-real{color:#2d6a4f}.s-part{color:#9c6b16}.s-demo{color:#6d597a}.s-block{color:#9b2226}.s-ext{color:#005f73}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(780px,100%);display:flex;background:#fffaf2ee;backdrop-filter:blur(10px);border-top:1px solid #ded4c5;padding:8px 4px}.bottom button{flex:1;border:0;background:n
