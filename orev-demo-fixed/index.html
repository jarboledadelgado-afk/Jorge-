<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6c7d65"><title>OREV® Personal · Demo P0</title><style>
:root{--bg:#f6f0e7;--p:#fffaf3;--ink:#25342e;--mut:#6f776f;--sage:#6c7d65;--s2:#dfe7da;--terr:#c67e61;--t2:#efddd4;--line:#ddd1c2;--bad:#9c3e3e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:960px;margin:auto;padding:18px 18px 90px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;position:sticky;top:0;background:#f6f0e7ee;backdrop-filter:blur(10px);padding:10px 0;z-index:5}.brand,h1,h2,h3{font-family:Georgia,serif}.brand{font-size:28px;font-weight:800}.tag,.muted{color:var(--mut);font-size:13px}.nav{display:flex;gap:6px;flex-wrap:wrap}.btn,.nav button{border:1px solid var(--line);background:var(--p);color:var(--ink);border-radius:14px;padding:10px 13px;font:inherit;cursor:pointer}.primary{background:var(--sage);color:white;border-color:var(--sage)}.danger{color:var(--bad)}.hero{padding:36px 0 18px}.hero h1{font-size:clamp(44px,7vw,78px);line-height:.96;margin:10px 0}.lead{font-size:19px;color:var(--mut);line-height:1.45;max-width:720px}.grid{display:grid;gap:12px}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.card{background:var(--p);border:1px solid var(--line);border-radius:20px;padding:17px;margin:10px 0}.card.action{text-align:left;cursor:pointer}.card.action b{display:block;font:700 22px Georgia,serif;margin-bottom:6px}.sage{background:var(--s2)}.terr{background:var(--t2)}.notice{background:#efe2ce;border-left:5px solid #a86a42;border-radius:14px;padding:13px 15px;margin:12px 0}.status{background:#e4eddf;border-left:5px solid #4e7a5e;border-radius:14px;padding:12px 14px;margin:12px 0}.field{display:flex;flex-direction:column;gap:5px;margin:10px 0}.field b{font-size:14px}input,textarea{width:100%;border:1px solid var(--line);background:white;border-radius:13px;padding:12px;font:inherit}textarea{min-height:92px}.row{display:flex;gap:8px;flex-wrap:wrap}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-size:12px;margin-right:4px}.ok{color:#397153}.bad{color:var(--bad)}.metric{font:800 42px Georgia,serif}.bottom{display:none}@media(max-width:700px){.g3,.g2{grid-template-columns:1fr}.nav{display:none}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fffaf3ee;border-top:1px solid var(--line);z-index:9}.bottom button{flex:1;border:0;background:none;padding:12px 4px}.wrap{padding:12px 12px 82px}.hero{padding-top:24px}}
</style></head><body><div id="app" class="wrap"></div><nav id="bottom" class="bottom"></nav><script>
(()=>{'use strict';const K='orev-demo-fixed-v2',A=document.getElementById('app'),B=document.getElementById('bottom'),id=()=>Math.random().toString(36).slice(2)+Date.now().toString(36),now=()=>new Date().toISOString(),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let r='home';const seed=()=>({captures:[{id:id(),text:'Tengo demasiadas cosas abiertas y no sé por dónde empezar.',created:now()}],maps:[],actions:[],memory:[]});let S;try{S=JSON.parse(localStorage.getItem(K))||seed()}catch{S=seed()}function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch{}}const v=x=>document.getElementById(x)?.value?.trim()||'',ls=x=>v(x).split('\n').map(x=>x.trim()).filter(Boolean);function nav(){return[['home','Inicio'],['capture','Sácalo'],['clarity','Ordenar'],['maps','Mapas'],['actions','Acciones'],['memory','Memoria']].map(x=>`<button onclick="go('${x[0]}')">${x[1]}</button>`).join('')}function shell(x){A.innerHTML=`<header class="top"><div><div class="brand">OREV® Personal</div><div class="tag">Observar · Revelar · Evolucionar · Validar · Demo P0 reparada</div></div><div class="nav">${nav()}</div></header><div class="status"><b>● INTERFAZ ACTIVA</b> · demo local verificable</div><div class="notice"><b>Demo pública.</b> Usa solo datos de prueba; el backend P0 real se valida por separado.</div><main>${x}</main>`;B.innerHTML=[['home','🏠'],['capture','＋'],['clarity','🧭'],['actions','✓'],['memory','◌']].map(x=>`<button onclick="go('${x[0]}')">${x[1]}</button>`).join('')}window.go=x=>{r=x;render()};function home(){shell(`<section class="hero"><div class="muted">HACER VISIBLE LO INVISIBLE</div><h1>Menos ruido.<br>Más dirección.</h1><p class="lead">Haz visible una cosa. Sepárala. Valida el mapa. Muévela.</p></section><div class="grid g3"><button class="card action sage" onclick="go('capture')"><b>＋ Sácalo de mi cabeza</b>Captura primero.</button><button class="card action terr" onclick="go('clarity')"><b>🧭 Necesito ordenar algo</b>Hechos antes que hipótesis.</button><button class="card action" onclick="go('actions')"><b>✓ Siguiente movimiento</b>Acciones terminables.</button></div><div class="grid g3"><div class="card"><div class="metric">${S.captures.length}</div><span class="muted">capturas</span></div><div class="card"><div class="metric">${S.maps.length}</div><span class="muted">mapas</span></div><div class="card"><div class="metric">${S.actions.filter(x=>x.status!=='DONE').length}</div><span class="muted">acciones abiertas</span></div></div>`)}function capture(){shell(`<h2>Sácalo de mi cabeza</h2><p class="lead">No tienes que organizarlo antes de escribirlo.</p><div class="card"><textarea id="cap" placeholder="Tarea, preocupación, idea o pendiente..."></textarea><button class="btn primary" onclick="saveCap()">Guardar</button></div>${S.captures.map(x=>`<div class="card"><span class="pill">DECLARADO</span><p>${esc(x.text)}</p></div>`).join('')}`)}window.saveCap=()=>{if(!v('cap'))return alert('Escribe algo primero');S.captures.unshift({id:id(),text:v('cap'),created:now()});S.memory.unshift({id:id(),type:'DECLARED',text:v('cap'),status:'ACTIVE'});save();capture()};function clarity(){shell(`<h2>Necesito ordenar algo</h2><p class="lead">Separamos lo ocurrido de lo que todavía intentamos comprender.</p><div class="card"><label class="field"><b>Situación</b><textarea id="sit"></textarea></label><label class="field"><b>Hechos observables · uno por línea</b><textarea id="facts"></textarea></label><label class="field"><b>Tu interpretación</b><textarea id="story"></textarea></label><label class="field"><b>Qué todavía falta saber</b><textarea id="missing"></textarea></label><button class="btn primary" onclick="makeMap()">Revelar mapa provisional</button></div>`)}window.makeMap=()=>{if(!v('sit'))return alert('Describe la situación');let f=ls('facts'),st=v('story'),m={id:id(),situation:v('sit'),facts:f,hyp:st?`Podría haber una relación entre la dificultad y esta interpretación: “${st.slice(0,110)}”.`:'Todavía no hay suficiente información para una hipótesis fuerte.',unknown:ls('missing').length?ls('missing'):['Falta observar qué ocurre al intentar el siguiente paso.'],confidence:f.length>1?'MEDIA':'BAJA',validation:'PENDING',correction:''};S.maps.unshift(m);S.memory.unshift({id:id(),source:m.id,type:'INFERRED',text:m.hyp,status:'PENDING'});save();r='maps';render()};function maps(){shell(`<h2>Mapas OREV®</h2><p class="lead">La persona puede validar, corregir o rechazar el mapa.</p>${S.maps.length?S.maps.map(m=>`<div class="card"><span class="pill">${m.validation}</span><span class="pill">CONFIANZA ${m.confidence}</span><h3>${esc(m.situation)}</h3><p><b>HECHOS</b><br>${m.facts.length?m.facts.map(esc).join('<br>'):'—'}</p><p><b>PODRÍA SIGNIFICAR</b><br>${esc(m.hyp)}</p><p><b>NO SABEMOS TODAVÍA</b><br>${m.unknown.map(esc).join('<br>')}</p>${m.correction?`<div class="notice"><b>Corrección:</b> ${esc(m.correction)}</div>`:''}<div class="row"><button class="btn primary" onclick="validate('${m.id}','YES')">Sí</button><button class="btn" onclick="validate('${m.id}','PARTLY')">En parte</button><button class="btn danger" onclick="validate('${m.id}','NO')">No</button></div>${m.validation!=='NO'?`<button class="btn" onclick="evolve('${m.id}')">Evolucionar → microacción</button>`:'<p class="bad"><b>Mapa rechazado:</b> no genera acción.</p>'}</div>`).join(''):'<div class="card">Aún no hay mapas.</div>'}`)}window.validate=(mid,x)=>{let m=S.maps.find(y=>y.id===mid);if(!m)return;let c='';if(x==='PARTLY')c=prompt('¿Qué parte sí y cuál no?')||'';if(x==='NO')c=prompt('¿Qué entendimos mal?')||'';m.validation=x;m.correction=c;let mm=S.memory.find(z=>z.source===mid);if(mm)mm.status=x==='NO'?'DISCARDED':x==='YES'?'VALIDATED':'PARTLY_VALIDATED';save();maps()};window.evolve=mid=>{let m=S.maps.find(y=>y.id===mid);if(!m||m.validation==='NO')return alert('Un mapa rechazado no puede generar acción');let d=prompt('Acción pequeña y realista','Preparar durante 15 minutos el siguiente paso');if(!d)return;let done=prompt('¿Qué significa terminada?','Dejar listo un borrador concreto');if(!done)return;S.actions.unshift({id:id(),map:mid,description:d,done,status:'OPEN'});save();r='actions';render()};function actions(){shell(`<h2>Siguiente movimiento</h2>${S.actions.length?S.actions.map(a=>`<div class="card"><span class="pill ${a.status==='DONE'?'ok':''}">${a.status}</span><h3>${esc(a.description)}</h3><p><b>Terminado significa:</b> ${esc(a.done)}</p>${a.status!=='DONE'?`<button class="btn primary" onclick="finish('${a.id}')">Registrar resultado</button>`:''}</div>`).join(''):'<div class="card">Aún no hay acciones.</div>'}`)}window.finish=aid=>{let a=S.actions.find(x=>x.id===aid),out=prompt('¿Qué ocurrió realmente?','Hice el paso y ahora sé qué falta');if(!out)return;let learn=prompt('¿Qué aprendimos?','Una acción pequeña redujo la sensación de saturación');if(!learn)return;a.status='DONE';S.memory.unshift({id:id(),type:'RESULT',text:out,status:'ACTIVE'},{id:id(),type:'LEARNING',text:learn,status:'ACTIVE'});save();actions()};function memory(){let g={};S.memory.forEach(x=>(g[x.type]??=[]).push(x));shell(`<h2>Lo que OREV® recuerda de mí</h2><p class="lead">Puedes corregir o eliminar cualquier elemento.</p>${Object.entries(g).map(([k,aa])=>`<h3>${k}</h3>${aa.map(x=>`<div class="card"><span class="pill">${x.status}</span><p>${esc(x.text)}</p><button class="btn danger" onclick="delMem('${x.id}')">Eliminar</button></div>`).join('')}`).join('')||'<div class="card">Aún no hay memoria.</div>'}`)}window.delMem=i=>{S.memory=S.memory.filter(x=>x.id!==i);save();memory()};function render(){({home,capture,clarity,maps,actions,memory}[r]||home)()}render()})();
</script></body></html>
