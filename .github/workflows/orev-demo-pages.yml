name: Deploy OREV Demo Pages

on:
  push:
    branches:
      - orev-personal-v4.1-p0
    paths:
      - 'orev-demo-fixed/**'
      - '.github/workflows/orev-demo-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static demo
        uses: actions/upload-pages-artifact@v3
        with:
          path: orev-demo-fixed
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
