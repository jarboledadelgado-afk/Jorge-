<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#667557"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Centro de Control Zary v1.8.4</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f0e6;color:#292923;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:620px;margin:auto;min-height:100vh;padding:calc(8px + env(safe-area-inset-top)) 16px calc(98px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:#f6f0e6ee;backdrop-filter:blur(10px);padding:8px 0 10px}.topline{display:flex;align-items:center;justify-content:space-between;gap:8px}.navctl{display:flex;gap:7px}
.round,.chip{border:1px solid #d9cfbf;background:#fffaf2;border-radius:999px;padding:9px 11px;color:inherit}.round{min-width:40px;text-align:center}.brand{font-weight:800}.small,.muted{font-size:12px;color:#777}.toolbar{display:flex;gap:7px;margin-top:8px}.toolbar button{flex:1}
button,input,textarea,select{font:inherit}h1,h2,h3{font-family:Georgia,serif}h1{font-size:34px;margin:20px 0 7px}h2{font-size:27px;margin:16px 0 7px}h3{font-size:21px}.sub{color:#6f6b62;line-height:1.45;margin-bottom:18px}
.grid{display:grid;gap:11px}.action,.card{width:100%;border:1px solid #ded4c5;background:#fffaf2;border-radius:19px;padding:16px;text-align:left;color:inherit}.action b,.card b{display:block;font-size:18px;margin-bottom:4px}
.primary{background:#667557;color:#fff;border-color:#667557}.sage{background:#dfe5d5}.rose{background:#ead8d1}.terra{background:#e4c4b4}.blue{background:#dde4e7}
.field{width:100%;border:1px solid #d8cdbd;background:#fffdf8;border-radius:14px;padding:14px;font-size:16px;margin:7px 0 10px}.area{min-height:110px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.item{background:#fffaf2;border:1px solid #ded4c5;border-radius:15px;padding:13px;margin:8px 0}
.notice{background:#f0e6d6;border-left:4px solid #a76f52;padding:12px;border-radius:10px;margin:12px 0;font-size:14px}.guide{background:#eef1e8;border-left:4px solid #667557;padding:14px;border-radius:12px;margin:12px 0;line-height:1.45}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(620px,100%);display:flex;background:#fffaf2ee;backdrop-filter:blur(10px);border-top:1px solid #ded4c5;padding:8px 5px calc(8px + env(safe-area-inset-bottom));z-index:30}
.bottom button{flex:1;border:0;background:none;font-size:11px;padding:5px 2px;color:inherit}.bottom span{display:block;font-size:20px}.composer{background:#fffaf2;border:1px solid #ded4c5;border-radius:18px;padding:12px;margin:10px 0}.composer-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.toast{position:fixed;left:50%;bottom:105px;transform:translateX(-50%);background:#292923;color:white;padding:10px 14px;border-radius:999px;z-index:50;display:none;max-width:90%;font-size:13px}.filebtn{position:relative;overflow:hidden}.filebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
</style></head><body>
<main class="app"><header><div class="topline"><div class="navctl"><button class="round" onclick="appBack()">←</button><button class="round" onclick="appNext()">→</button><button class="round" onclick="go('home')">⌂</button></div><div style="text-align:center"><div class="brand">OREV® · Zary</div><div class="small">Centro de Control · v1.8.4</div></div><button class="round" onclick="go('settings')">⚙️</button></div><div class="toolbar"><button class="chip" onclick="go('search')">🔎 Buscar</button><button class="chip" onclick="quickVoice()">🎙️ Hablar</button><button class="chip" onclick="go('dailylog')">🗣️ Mi día</button></div></header><div id="view"></div></main>
<nav class="bottom"><button onclick="go('home')"><span>🏠</span>Inicio</button><button onclick="go('work')"><span>💼</span>Trabajo</button><button onclick="go('child')"><span>👶</span>Mi niña</button><button onclick="go('house')"><span>🏡</span>Casa</button><button onclick="go('me')"><span>🌿</span>Yo</button></nav><div id="toast" class="toast"></div>
<script>
const KEY='zary-control-v1-8-4',oldKeys=['zary-control-v1-8-3','zary-control-v1-8','zary-control-v1-7'];
const now=()=>new Date().toISOString(), blank=()=>({capture:[],work:[],child:[],house:[],partner:[],me:[],daily:[],today:['','',''],events:[],focusTask:''});
let s=load(),current='home',stack=['home'],forward=[],pendingFiles=[];
function load(){try{let raw=localStorage.getItem(KEY);if(!raw)for(const k of oldKeys){raw=localStorage.getItem(k);if(raw)break}let o=Object.assign(blank(),raw?JSON.parse(raw):{});['capture','work','child','house','partner','me','daily'].forEach(k=>o[k]=(o[k]||[]).map(v=>typeof v==='string'?{text:v,created:now(),done:false,files:[]}:{files:[],done:false,...v}));return o}catch(e){return blank()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}
const V=()=>document.getElementById('view'),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2000)}
function go(r,push=true){if(!routes[r])r='home';if(push&&r!==current){stack.push(r);forward=[]}current=r;routes[r]();scrollTo(0,0)}
function appBack(){if(stack.length>1){forward.push(stack.pop());current=stack[stack.length-1];routes[current]()}else go('home',false)}
function appNext(){if(forward.length){let r=forward.pop();stack.push(r);current=r;routes[r]()}else toast('No hay una pantalla siguiente')}
function page(t,sub,b){V().innerHTML=(current!=='home'?'<button class="action" onclick="appBack()"><b>← Volver</b></button>':'')+'<h2>'+t+'</h2><div class="sub">'+sub+'</div>'+b}
function composer(key,ph,guide=false){return '<div class="composer"><textarea id="txt" class="field area" placeholder="'+ph+'"></textarea><div class="composer-actions"><button class="chip" onclick="voiceInto(\'txt\')">🎙️ Hablar</button><label class="chip filebtn">📎 Archivo<input type="file" multiple onchange="showFiles(this)"></label><label class="chip filebtn">📷 Foto<input type="file" accept="image/*" capture="environment" onchange="showFiles(this)"></label></div><div class="row" style="margin-top:8px"><button class="action primary" onclick="saveComposer(\''+key+'\')"><b>💾 Guardar</b></button>'+(guide?'<button class="action sage" onclick="guideCurrent()"><b>🧭 Guíame ahora</b></button>':'')+'</div></div>'}
function showFiles(i){pendingFiles=[...pendingFiles,...Array.from(i.files||[]).map(f=>({name:f.name,type:f.type,size:f.size}))];toast(pendingFiles.length+' adjunto(s) preparados')}
function saveComposer(k){let t=(document.getElementById('txt')?.value||'').trim();if(!t&&!pendingFiles.length)return toast('Escribe, habla o adjunta algo.');s[k].unshift({text:t||'[Adjunto]',created:now(),done:false,files:pendingFiles});pendingFiles=[];save();routes[k==='daily'?'dailylog':k]();toast('Guardado')}
function itemHtml(k,x,i){return '<div class="item"><b>'+esc(x.text)+'</b><div class="muted">'+new Date(x.created).toLocaleString('es')+'</div>'+(k==='capture'?'<button class="chip" style="margin-top:8px" onclick="guideSaved('+i+')">🧭 Orientarme</button> ':'')+'<button class="chip" style="margin-top:8px" onclick="toggle(\''+k+'\','+i+')">'+(x.done?'↺ Reabrir':'✓ Terminar')+'</button> <button class="chip" onclick="editItem(\''+k+'\','+i+')">✏️</button> <button class="chip" onclick="del(\''+k+'\','+i+')">🗑️</button></div>'}
function listArea(t,sub,k,ph,guide=false){page(t,sub,composer(k,ph,guide)+s[k].map((x,i)=>itemHtml(k,x,i)).join(''))}
function toggle(k,i){s[k][i].done=!s[k][i].done;save();routes[k==='daily'?'dailylog':k]()}function editItem(k,i){let v=prompt('Editar',s[k][i].text);if(v!==null){s[k][i].text=v.trim()||s[k][i].text;save();routes[k==='daily'?'dailylog':k]()}}function del(k,i){if(confirm('¿Eliminar este registro?')){s[k].splice(i,1);save();routes[k==='daily'?'dailylog':k]()}}
function home(){page('Hola, Zary.','¿Qué necesitas ahora?','<div class="grid"><button class="action primary" onclick="go(\'capture\')"><b>✨ Quiero ordenar lo que me pasa</b><span>Habla y recibe una guía inicial.</span></button><button class="action blue" onclick="go(\'dailylog\')"><b>🗣️ Cuéntame tu día</b><span>Registra lo que haces para organizar mejor tu rutina.</span></button><button class="action" onclick="go(\'dayplan\')"><b>☀️ ¿Qué me toca hoy?</b></button><button class="action terra" onclick="go(\'focus\')"><b>🎯 Hiperfoco</b></button><button class="action rose" onclick="go(\'overload\')"><b>🫶 Estoy saturada</b></button></div>')}
function capture(){listArea('✨ Quiero ordenar lo que me pasa','Aquí no solo guardamos: también puedes pedir una orientación práctica.','capture','Cuenta qué pasó, qué sientes o qué te preocupa…',true)}
function guideCurrent(){let t=(document.getElementById('txt')?.value||'').trim();if(!t)return toast('Primero cuéntame qué está pasando.');showGuide(t)}
function guideSaved(i){showGuide(s.capture[i].text)}
function showGuide(t){
 sessionText=t; sessionAnswers=[]; sessionStep=0; renderClarityQuestion();
}
let sessionText='',sessionAnswers=[],sessionStep=0;
function clarityQuestions(t){let x=t.toLowerCase(),q=[];
 q.push('De todo lo que acabas de contar, ¿qué es lo que más necesitas resolver o entender hoy?');
 if(/posterg|aplaz|dejando|descuidad|no hago|no sé por dónde/.test(x))q.push('¿Qué es exactamente lo que vienes dejando para después? Dime una tarea o situación concreta.');
 if(/cansad|dormir|sueño|agot/.test(x))q.push('¿Qué ha pasado con tu descanso en los últimos días y qué notas que cambia en ti cuando descansas poco?');
 if(/trabaj|dinero|pagar|deuda|oblig/.test(x))q.push('¿Qué obligación concreta tiene una consecuencia real si no la atiendes esta semana?');
 if(/proyecto|idea|tecnolog|inteligencia artificial|enganch/.test(x))q.push('Cuando aparece una idea nueva, ¿qué haces con la tarea que estabas haciendo justo antes?');
 q.push('Justo antes de que esto ocurra, ¿qué suele pasar: qué haces, qué piensas o qué necesitas en ese momento?');
 q.push('¿Qué has intentado ya para resolverlo y qué pasó cuando lo intentaste?');
 return q.slice(0,5)
}
function renderClarityQuestion(){let qs=clarityQuestions(sessionText);if(sessionStep>=qs.length||sessionStep>=4)return renderMap();let q=qs[sessionStep];let body='<div class="guide"><b>🧭 Sesión de Claridad · paso '+(sessionStep+1)+'</b><p><strong>'+esc(q)+'</strong></p><textarea id="clarityAnswer" class="field area" placeholder="Respóndeme como salga…"></textarea><div class="row"><button class="chip" onclick="voiceInto(\'clarityAnswer\')">🎙️ Hablar</button><button class="action primary" onclick="nextClarity()"><b>→ Siguiente pregunta</b></button></div><p class="muted">Voy preguntando de una en una. Si ya hay suficiente claridad, construimos el mapa.</p></div>';V().insertAdjacentHTML('afterbegin',body);scrollTo(0,0)}
function nextClarity(){let a=(document.getElementById('clarityAnswer')?.value||'').trim();if(!a)return toast('Respóndeme antes de continuar.');sessionAnswers.push(a);sessionStep++;document.querySelector('.guide')?.remove();renderClarityQuestion()}
function renderMap(){let all=(sessionText+' '+sessionAnswers.join(' ')).toLowerCase();let facts=['Lo que dijiste literalmente: “'+sessionText.slice(0,220)+(sessionText.length>220?'…':'')+'”'];let interpretations=[];let hypotheses=[];let needs=[];let technique='Descarga + siguiente acción';let why='Hay varias piezas mezcladas y conviene reducirlas a una acción observable.';
 if(/cansad|dormir|sueño|agot/.test(all)){facts.push('Has mencionado cansancio o descanso/sueño.');needs.push('Proteger un cierre y un espacio de descanso.');hypotheses.push('Hipótesis a validar: el cansancio puede estar reduciendo tu capacidad para iniciar o sostener tareas.');technique='Cierre + protección del descanso';why='El descanso aparece en tu propio relato y conviene protegerlo antes de exigir más rendimiento.'}
 if(/posterg|aplaz|no hago|dejando|descuidad/.test(all)){facts.push('Has dicho que hay algo que se posterga o queda sin hacer.');hypotheses.push('Hipótesis a validar: la tarea puede ser demasiado grande, poco clara, competir con algo más atractivo o faltarle un primer paso.');technique='Fragmentación + Hiperfoco';why='Hay una tarea importante que no está pasando a ejecución; primero la reducimos y luego protegemos un bloque.'}
 if(/trabaj|dinero|pagar|deuda|oblig/.test(all))needs.push('Dar espacio explícito a la obligación con consecuencia real.');
 if(/proyecto|idea|tecnolog|inteligencia artificial|enganch/.test(all))interpretations.push('Posible tensión: lo que entusiasma ahora puede estar compitiendo con una obligación menos atractiva. Esto todavía no es un hecho.');
 let html='<div class="guide"><b>🗺️ Primer mapa OREV®</b><p><strong>● HECHOS / RELATO</strong><br>'+facts.map(v=>'• '+esc(v)).join('<br>')+'</p><p><strong>◇ INTERPRETACIONES</strong><br>'+(interpretations.length?interpretations.map(v=>'• '+esc(v)).join('<br>'):'• Todavía no necesito convertir esto en una interpretación.')+'</p><p><strong>△ HIPÓTESIS</strong><br>'+(hypotheses.length?hypotheses.map(v=>'• '+esc(v)).join('<br>'):'• Aún falta evidencia para proponer una hipótesis útil.')+'</p><p><strong>? NECESIDADES / INFORMACIÓN A SEGUIR MIRANDO</strong><br>'+(needs.length?needs.map(v=>'• '+esc(v)).join('<br>'):'• Identificar qué necesita cambiar primero.')+'</p><p><strong>🧰 Técnica propuesta: '+esc(technique)+'</strong><br>'+esc(why)+'</p><p><strong>OREV®</strong><br>Observar → separar piezas.<br>Revelar → proponer una explicación, sin convertirla en sentencia.<br>Evolucionar → probar una microacción.<br>Validar → comprobar contigo si el mapa explica lo que pasa.</p><div class="row"><button class="chip" onclick="validateMap(\'yes\')">✓ Sí me representa</button><button class="chip" onclick="validateMap(\'part\')">◐ En parte</button><button class="chip" onclick="validateMap(\'no\')">✕ No</button></div><p class="muted">Una hipótesis es un mapa, no una sentencia. Si el mapa no explica el territorio, cambiamos el mapa.</p></div>';document.querySelector('.guide')?.remove();V().insertAdjacentHTML('afterbegin',html);scrollTo(0,0)}
function validateMap(v){if(v==='yes'){toast('Mapa validado. Ahora prueba la técnica y revisamos qué ocurre.');return}let q=v==='part'?'¿Qué parte sí te representa y qué parte cambiarías?':'¿Qué entendí mal o qué pieza importante me falta?';document.querySelector('.guide').insertAdjacentHTML('beforeend','<div class="notice"><b>'+q+'</b><textarea id="mapCorrection" class="field area"></textarea><div class="row"><button class="chip" onclick="voiceInto(\'mapCorrection\')">🎙️ Hablar</button><button class="chip" onclick="reviseMap()">↺ Revisar mapa</button></div></div>')}
function reviseMap(){let a=(document.getElementById('mapCorrection')?.value||'').trim();if(!a)return toast('Cuéntame qué debo corregir.');sessionAnswers.push(a);sessionStep=99;renderMap()}

function work(){page('💼 Trabajo','Correo, auditoría, PAI, agenda y pendientes.','<div class="grid"><button class="action" onclick="go(\'worklist\')"><b>✓ Pendientes</b></button><button class="action" onclick="go(\'calendar\')"><b>📅 Agenda</b></button><button class="action" onclick="go(\'clinical\')"><b>🔬 Auditoría clínica</b></button><button class="action" onclick="go(\'pai\')"><b>📊 PAI / Excel</b></button></div>')}
function worklist(){listArea('Pendientes de trabajo','Escribe, habla o adjunta.','work','¿Qué queda pendiente?')}
function child(){listArea('👶 Mi niña','Citas, compras, documentos y recuerdos.','child','¿Qué quiero recordar o hacer?')}
function house(){listArea('🏡 Casa','Compras, cocina, limpieza y organización.','house','¿Qué hace falta en casa?')}
function me(){page('🌿 Yo','Tu espacio también cuenta.','<div class="grid"><button class="action primary" onclick="go(\'capture\')"><b>🧭 Acompáñame</b></button><button class="action" onclick="go(\'personal\')"><b>🌱 Tiempo para mí</b></button><button class="action" onclick="go(\'partner\')"><b>❤️ Pareja</b></button><button class="action" onclick="go(\'dailylog\')"><b>🗣️ Mi día a día</b></button></div>')}
function personal(){listArea('🌱 Tiempo para mí','Descanso y espacio personal.','me','¿Qué necesito para mí?')}
function partner(){listArea('❤️ Pareja','Conversaciones, acuerdos y planes.','partner','¿Qué quiero hablar u organizar?')}
function dailylog(){page('🗣️ Cuéntame tu día','Ve contándome qué haces. Esto ayuda a organizar la carga y ver qué queda pendiente.',composer('daily','Ej.: trabajé de 8 a 12, respondí correos y me falta el informe…')+s.daily.map((x,i)=>itemHtml('daily',x,i)).join(''))}
function dayplan(){let open=k=>s[k].filter(x=>!x.done).slice(0,3).map(x=>'• '+esc(x.text)).join('<br>')||'Sin pendientes registrados';page('☀️ ¿Qué me toca hoy?','Una vista simple de lo que ya está registrado.','<div class="card"><b>Mis 3</b>'+s.today.map((x,i)=>'<input class="field" value="'+esc(x)+'" onchange="s.today['+i+']=this.value;save()" placeholder="Prioridad '+(i+1)+'">').join('')+'</div><div class="card"><b>💼 Trabajo</b>'+open('work')+'</div><div class="card"><b>👶 Mi niña</b>'+open('child')+'</div><div class="card"><b>🏡 Casa</b>'+open('house')+'</div><div class="notice">Cuando Google Calendar esté conectado, esta pantalla podrá organizarse alrededor de los compromisos reales.</div>')}
function focus(){page('🎯 Hiperfoco','Una cosa cada vez.','<input id="focusText" class="field" value="'+esc(s.focusTask)+'" placeholder="¿Qué vas a terminar?"><div class="row"><button class="chip" onclick="voiceInto(\'focusText\')">🎙️</button><button class="chip" onclick="startFocus(25)">25 min</button><button class="chip" onclick="startFocus(45)">45 min</button><button class="chip" onclick="startFocus(60)">60 min</button></div><div id="clock" style="font-size:42px;text-align:center;margin:22px">—</div>')}
let timer,left=0;function startFocus(m){s.focusTask=document.getElementById('focusText').value;save();clearInterval(timer);left=m*60;beep();tick();timer=setInterval(()=>{left--;tick();if(left<=0){clearInterval(timer);beep();alert('Bloque terminado. Guarda el avance y descansa antes de decidir otro bloque.')}},1000)}function tick(){let e=document.getElementById('clock');if(e)e.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0')}function beep(){try{let a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();o.stop(a.currentTime+.15)}catch(e){}}
function overload(){page('🫶 Estoy saturada','Solo una cosa ahora.',composer('capture','¿Qué es lo que más pesa en este momento?',true))}
function calendar(){page('📅 Agenda','Registro manual mientras se valida Google Calendar.','<input id="evtitle" class="field" placeholder="Evento"><div class="row"><button class="chip" onclick="voiceInto(\'evtitle\')">🎙️</button><input id="evdate" class="field" type="datetime-local"></div><button class="action primary" onclick="addEvent()"><b>＋ Guardar evento</b></button>'+s.events.map((e,i)=>'<div class="item"><b>'+esc(e.title)+'</b><br>'+esc(e.date)+'</div>').join(''))}function addEvent(){let t=document.getElementById('evtitle').value.trim(),d=document.getElementById('evdate').value;if(!t||!d)return toast('Falta título o fecha');s.events.push({title:t,date:d});save();calendar()}
function clinical(){page('🔬 Auditoría clínica','Cierre blindado y trazabilidad.','<div class="notice">No se guardan historias clínicas en localStorage ni en GitHub. El análisis clínico real requiere procesamiento privado.</div><textarea id="clinicalQ" class="field area" placeholder="¿Qué necesito saber del expediente?"></textarea><div class="composer-actions"><button class="chip" onclick="voiceInto(\'clinicalQ\')">🎙️ Hablar</button><label class="chip filebtn">📎 PDF<input type="file" accept="application/pdf"></label><label class="chip filebtn">📷 Foto<input type="file" accept="image/*" capture="environment"></label></div><div class="grid" style="margin-top:10px"><button class="action"><b>🔎 Pregunta puntual</b></button><button class="action"><b>🧾 Resumen 1 hoja</b></button><button class="action"><b>🔬 RETINA + Red Team</b></button><button class="action"><b>📊 Presentación Premium</b></button></div>')}
function pai(){page('📊 PAI / Excel','Usar archivo original, no reconstruir desde capturas.','<textarea id="paiText" class="field area" placeholder="¿Qué necesitas revisar?"></textarea><div class="composer-actions"><button class="chip" onclick="voiceInto(\'paiText\')">🎙️</button><label class="chip filebtn">📎 Excel<input type="file" accept=".xlsx,.xls"></label><label class="chip filebtn">📷 Foto<input type="file" accept="image/*" capture="environment"></label></div>')}
function search(){page('🔎 Buscar','Busca en lo que has guardado.','<input id="q" class="field" placeholder="Buscar…" oninput="doSearch()"><button class="chip" onclick="voiceInto(\'q\')">🎙️ Hablar</button><div id="results"></div>')}function doSearch(){let q=document.getElementById('q').value.toLowerCase(),a=[];['capture','work','child','house','partner','me','daily'].forEach(k=>s[k].forEach(x=>{if(x.text.toLowerCase().includes(q)&&q)a.push('<div class="item"><b>'+esc(x.text)+'</b><div class="muted">'+k+'</div></div>')}));document.getElementById('results').innerHTML=a.join('')||'<p class="muted">Sin resultados.</p>'}
function settings(){page('⚙️ Ajustes','Privacidad y datos.','<div class="card"><b>Versión</b><span>v1.8.4</span></div><div class="notice">La guía emocional actual es una orientación local estructurada. Para conversación inteligente profunda y longitudinal todavía hace falta conectar un modelo privado/autorizado.</div>')}
function voiceInto(id){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return toast('Usa el micrófono del teclado en este navegador.');let r=new SR();r.lang='es-ES';r.onresult=e=>{let el=document.getElementById(id);el.value=(el.value?el.value+' ':'')+e.results[0][0].transcript};r.onerror=()=>toast('Revisa el permiso del micrófono');r.start()}
function quickVoice(){let target=current==='work'?'work':current==='child'?'child':current==='house'?'house':current==='partner'?'partner':current==='personal'?'me':'capture';if(current!==target)go(target);setTimeout(()=>voiceInto('txt'),100)}
const routes={home,work,worklist,child,house,me,personal,partner,dailylog,dayplan,focus,overload,calendar,clinical,pai,capture,search,settings};
home();
</script></body></html>
