<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#667557">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Centro de Control Zary v1.7</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f0e6;color:#292923;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:600px;margin:auto;min-height:100vh;padding:calc(14px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 0 14px}.brand{font-weight:800}.small,.muted{font-size:12px;color:#777}
button,input,textarea,select{font:inherit}.gear,.chip{border:1px solid #d9cfbf;background:#fffaf2;border-radius:999px;padding:9px 12px}
h1,h2,h3{font-family:Georgia,serif}h1{font-size:34px;margin:20px 0 7px}h2{font-size:27px;margin:16px 0 7px}h3{font-size:21px}
.sub{color:#6f6b62;line-height:1.45;margin-bottom:20px}.grid{display:grid;gap:11px}.action,.card{width:100%;border:1px solid #ded4c5;background:#fffaf2;border-radius:19px;padding:17px;text-align:left;color:inherit}
.action b,.card b{display:block;font-size:18px;margin-bottom:4px}.primary{background:#667557;color:white;border-color:#667557}.sage{background:#dfe5d5}.rose{background:#ead8d1}.terra{background:#e4c4b4}.blue{background:#dde4e7}
.field{width:100%;border:1px solid #d8cdbd;background:#fffdf8;border-radius:14px;padding:14px;font-size:16px;margin:7px 0 12px}.area{min-height:115px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.item{background:#fffaf2;border:1px solid #ded4c5;border-radius:15px;padding:13px;margin:8px 0}.notice{background:#f0e6d6;border-left:4px solid #a76f52;padding:12px;border-radius:10px;margin:12px 0;font-size:14px}
.ok{background:#e5eddc;border-left:4px solid #667557;padding:12px;border-radius:10px;margin:12px 0}.bad{background:#f5dddd;border-left:4px solid #9b4b43;padding:12px;border-radius:10px;margin:12px 0}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(600px,100%);display:flex;background:#fffaf2ee;backdrop-filter:blur(10px);border-top:1px solid #ded4c5;padding:8px 5px calc(8px + env(safe-area-inset-bottom));z-index:10}
.bottom button{flex:1;border:0;background:none;font-size:11px;padding:6px 2px}.bottom span{display:block;font-size:20px}.focus{font-size:46px;text-align:center;margin:20px}.danger{color:#8a3d35}
.badge{display:inline-block;border-radius:999px;background:#e9e1d5;padding:5px 8px;font-size:11px;margin:2px}.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.kpi .card{text-align:center;padding:12px}.kpi strong{font-size:25px;display:block}
.sep{height:1px;background:#e0d7c9;margin:16px 0}.statusline{display:flex;gap:8px;align-items:center}.dot{width:10px;height:10px;border-radius:50%;background:#aaa}.dot.on{background:#667557}.dot.wait{background:#c08b3f}
</style>
</head>
<body>
<main class="app"><header><div><div class="brand">OREV® · Zary</div><div class="small">Centro de Control Personal · v1.7</div></div><button class="gear" onclick="go('settings')">⚙️</button></header><div id="view"></div></main>
<nav class="bottom">
<button onclick="go('home')"><span>🏠</span>Inicio</button>
<button onclick="go('work')"><span>💼</span>Trabajo</button>
<button onclick="go('child')"><span>👶</span>Mi niña</button>
<button onclick="go('house')"><span>🏡</span>Casa</button>
<button onclick="go('me')"><span>🌿</span>Yo</button>
</nav>
<script>
const KEY='zary-control-v1-7';
const oldKeys=['zary-control-v1-6-3','zary-control-v1-6-2','zary-control-v1-6','zary-control-center-v1-4'];
const now=()=>new Date().toISOString();
const blank=()=>({capture:[],work:[],child:[],partner:[],house:[],me:[],today:['','',''],weekly:'',energy:'',rest:'',focusTask:'',events:[],paiNotes:'',completed:0,googleClientId:'',driveFolderId:'',googleEmail:'',lastWeekly:''});
let mem={};
function norm(x){let o=Object.assign(blank(),x||{});['capture','work','child','partner','house','me'].forEach(k=>o[k]=(o[k]||[]).map(v=>typeof v==='string'?{text:v,created:now(),done:false}:{done:false,...v}));return o}
function load(){try{let raw=localStorage.getItem(KEY);if(!raw){for(const k of oldKeys){raw=localStorage.getItem(k);if(raw)break}}return norm(raw?JSON.parse(raw):{})}catch(e){return norm(mem)}}
let s=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){mem=s}}
const V=()=>document.getElementById('view');
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function page(t,sub,body){V().innerHTML='<h2>'+t+'</h2><div class="sub">'+sub+'</div>'+body;scrollTo(0,0)}
function home(){let open=['work','child','house','partner','me'].reduce((n,k)=>n+s[k].filter(x=>!x.done).length,0);V().innerHTML='<h1>Hola, Zary.</h1><div class="sub">No tienes que resolverlo todo. ¿Qué necesitas ahora?</div><div class="kpi"><div class="card"><strong>'+open+'</strong><span class="muted">pendientes visibles</span></div><div class="card"><strong>'+s.events.length+'</strong><span class="muted">eventos guardados</span></div></div><div class="grid"><button class="action primary" onclick="go(\'capture\')"><b>✨ Necesito ordenar mi cabeza</b><span>Habla o escribe. Primero lo hacemos visible.</span></button><button class="action sage" onclick="go(\'today\')"><b>☀️ Organizar mi día</b><span>Tres prioridades reales.</span></button><button class="action terra" onclick="go(\'focus\')"><b>🎯 Necesito concentrarme</b><span>Un bloque de hiperfoco, una sola cosa.</span></button><button class="action rose" onclick="go(\'overload\')"><b>🫶 Estoy saturada</b><span>Reduce ruido y encuentra el siguiente paso.</span></button><button class="action" onclick="go(\'calendar\')"><b>📅 Calendario</b><span>Compromisos y Google Calendar.</span></button><button class="action" onclick="go(\'week\')"><b>📋 Revisar mi semana</b><span>Trabajo, casa, niña, pareja y tiempo para ti.</span></button><button class="action blue" onclick="voice(\'capture\')"><b>🎙️ Hablar</b><span>Dicta una nota sin escribir.</span></button></div>'}
function listArea(title,sub,key,placeholder){page(title,sub,'<textarea id="new" class="field area" placeholder="'+placeholder+'"></textarea><div class="row"><button class="chip" onclick="voice(\''+key+'\')">🎙️ Hablar</button><button class="chip" onclick="add(\''+key+'\')">＋ Guardar</button></div><div>'+s[key].map((x,i)=>'<div class="item"><div class="row"><div style="flex:5"><b>'+esc(x.text)+'</b><div class="muted">'+age(x.created)+(x.done?' · terminado':'')+'</div></div><button class="chip" onclick="toggle(\''+key+'\','+i+')">'+(x.done?'↺':'✓')+'</button><button class="chip" onclick="del(\''+key+'\','+i+')">×</button></div></div>').join('')+'</div>')}
function age(d){if(!d)return'';let n=Math.floor((Date.now()-new Date(d))/86400000);return n<=0?'hoy':n===1?'hace 1 día':'hace '+n+' días'}
function add(k,v){let e=document.getElementById('new'),x=(v||e?.value||'').trim();if(x){s[k].unshift({text:x,created:now(),done:false});save();routes[k]?.()}}
function toggle(k,i){s[k][i].done=!s[k][i].done;if(s[k][i].done)s.completed++;save();routes[k]?.()}
function del(k,i){s[k].splice(i,1);save();routes[k]?.()}
function capture(){listArea('Necesito ordenar mi cabeza','No tienes que explicarlo perfecto. Aquí capturamos antes de resolver.','capture','¿Qué está ocupando espacio en tu cabeza?')}
function work(){page('💼 Trabajo','Todo lo profesional vive aquí.','<div class="grid"><button class="action" onclick="location.href=\'zary-v1.5.html\'"><b>✉️ Correo</b><span>Gmail: lectura piloto separada.</span></button><button class="action" onclick="go(\'clinical\')"><b>🔬 Auditoría clínica</b><span>Cierre blindado, RETINA, resumen y presentación.</span></button><button class="action" onclick="go(\'pai\')"><b>📊 PAI / Excel</b><span>Notas y flujo de informes.</span></button><button class="action" onclick="go(\'calendar\')"><b>📅 Agenda</b><span>Calendario y espacios disponibles.</span></button><button class="action" onclick="go(\'drive\')"><b>☁️ Archivo en Drive</b><span>Copias privadas y carpeta del Centro.</span></button><button class="action" onclick="go(\'worklist\')"><b>✓ Pendientes</b><span>Qué toca, qué espera y qué cerrar.</span></button></div>')}
function worklist(){listArea('Pendientes de trabajo','Si algo lleva días arrastrándose, lo hacemos visible.','work','¿Qué queda pendiente?')}
function clinical(){page('🔬 Auditoría clínica','Flujo diseñado para documentación sensible.','<div class="notice"><b>Cierre blindado:</b> antes de afirmar desenlace revisar egreso, traslado, fallecimiento, continuidad hospitalaria, fecha/hora y documento fuente.</div><div class="grid"><button class="action" onclick="clinicalAction(\'dato\')"><b>🔎 Solo necesito un dato</b><span>Pregunta puntual + evidencia + certeza.</span></button><button class="action" onclick="clinicalAction(\'resumen\')"><b>🧾 Resumen ejecutivo · 1 hoja</b><span>Qué pasó, hitos, diagnóstico, desenlace y vacíos.</span></button><button class="action" onclick="clinicalAction(\'retina\')"><b>🔬 RETINA + Red Team</b><span>Revisión independiente contra fuentes.</span></button><button class="action" onclick="clinicalAction(\'ppt\')"><b>📊 Presentación Premium</b><span>Gráficos verificables y guion.</span></button><button class="action primary" onclick="clinicalAction(\'all\')"><b>🚨 Ejecutar todo</b><span>Prepara el protocolo completo para procesamiento privado.</span></button></div><div class="bad"><b>Privacidad:</b> esta web pública no sube ni almacena historias clínicas. Para analizar expedientes reales hace falta una capa privada autorizada. No se simularán resultados.</div>')}
function clinicalAction(mode){const labels={dato:'Pregunta puntual',resumen:'Resumen de 1 hoja',retina:'RETINA + Red Team',ppt:'Presentación Premium',all:'Auditoría completa'};let txt='MODO: '+labels[mode]+'\n\nREGLAS:\n1. Leer el expediente completo.\n2. Separar HECHO DOCUMENTADO / INTERPRETACIÓN / INFORMACIÓN FALTANTE.\n3. Diagnósticos: confirmado / sospechado / descartado / no consta.\n4. Trazabilidad por documento, página, fecha y hora.\n5. CIERRE BLINDADO: egreso / traslado / fallecimiento / continúa hospitalizado / fecha-hora / documento fuente.\n6. RETINA: segunda pasada verificando fechas, cifras, diagnósticos, pruebas, tratamientos y gráficos.\n7. RED TEAM: intentar refutar la conclusión inicial.\n8. Si no está documentado, no afirmarlo.';navigator.clipboard?.writeText(txt);alert('Protocolo '+labels[mode]+' copiado. Ábrelo junto con los archivos en un entorno privado de análisis.')}
function pai(){page('📊 PAI / Excel','Organiza el trabajo PAI sin reconstruir cifras desde capturas.','<textarea class="field area" onchange="s.paiNotes=this.value;save()" placeholder="Pendientes, periodos, responsables, archivos que faltan…">'+esc(s.paiNotes)+'</textarea><button class="action" onclick="go(\'worklist\')"><b>＋ Convertir en pendiente</b></button><div class="notice">La auditoría de fórmulas y coberturas requiere el Excel original.</div>')}
function child(){listArea('👶 Mi niña','Citas, compras, documentos, fechas y cosas que no quieres olvidar.','child','Algo de mi niña que quiero recordar…')}
function partner(){listArea('❤️ Pareja','Planes, acuerdos, conversaciones y pendientes compartidos.','partner','Algo que quiero recordar, hablar u organizar…')}
function house(){listArea('🏡 Casa','Compras, cocina, limpieza, pagos, reparaciones y organización.','house','Ej.: comprar detergente, organizar habitación…')}
function me(){page('🌿 Yo','Tu espacio cuenta antes de llenar todo de obligaciones.','<div class="grid"><button class="action primary" onclick="go(\'capture\')"><b>🧠 Ordenar mi cabeza</b><span>Hablar o escribir lo que pesa.</span></button><button class="action" onclick="go(\'personal\')"><b>🌱 Tiempo para mí</b><span>Descanso, energía y cosas para ti.</span></button><button class="action" onclick="go(\'partner\')"><b>❤️ Pareja</b><span>Conversaciones, acuerdos y planes.</span></button><button class="action" onclick="go(\'week\')"><b>📋 Mi semana</b><span>Ver la carga completa.</span></button></div>')}
function personal(){listArea('🌱 Tiempo para mí','No todo tiene que convertirse en productividad.','me','Algo que necesito o quiero hacer por mí…')}
function today(){page('☀️ Mis 3 de hoy','Si estas tres avanzan, el día ya tuvo dirección.',[0,1,2].map(i=>'<label class="muted">Prioridad '+(i+1)+'</label><input class="field" value="'+esc(s.today[i])+'" onchange="s.today['+i+']=this.value;save()" placeholder="Una acción concreta">').join('')+'<div class="notice">Consulta el calendario antes de añadir más. Tres es el límite.</div>')}
let timer=null,left=0;
function focus(){page('🎯 Modo Hiperfoco','Una tarea. Un bloque. Después paramos y decidimos.','<input id="ft" class="field" value="'+esc(s.focusTask)+'" placeholder="¿Qué quiero terminar?"><div class="row"><button class="chip" onclick="startFocus(25)">25 min</button><button class="chip" onclick="startFocus(45)">45 min</button><button class="chip" onclick="startFocus(60)">60 min</button></div><div id="clock" class="focus">—</div><button class="action" onclick="stopFocus()"><b>■ Terminar bloque</b><span>Guardar el avance y salir del foco.</span></button>')}
function startFocus(m){s.focusTask=document.getElementById('ft').value.trim();save();clearInterval(timer);left=m*60;beep();tick();timer=setInterval(()=>{left--;tick();if(left<=0){clearInterval(timer);beep();setTimeout(beep,300);alert('Bloque terminado. Guarda el avance y descansa antes de decidir si necesitas otro.')}},1000)}
function tick(){let e=document.getElementById('clock');if(e)e.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0')}
function stopFocus(){clearInterval(timer);beep();go('home')}
function beep(){try{let a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);g.gain.value=.05;o.frequency.value=880;o.start();o.stop(a.currentTime+.16)}catch(e){}}
function overload(){page('🫶 Estoy saturada','No vamos a organizar toda tu vida ahora. Solo encontrar el siguiente paso.','<textarea id="ov" class="field area" placeholder="¿Qué pesa más ahora?"></textarea><button class="action primary" onclick="saveOverload()"><b>Guardar y elegir una sola cosa</b></button><div class="notice">Este acompañamiento organiza y orienta; no diagnostica ni sustituye atención profesional o de emergencia.</div>')}
function saveOverload(){let x=document.getElementById('ov').value.trim();if(x){s.capture.unshift({text:x,created:now(),done:false});save();go('today')}}
function week(){let open=k=>s[k].filter(x=>!x.done).length;let oldWork=s.work.filter(x=>!x.done&&Date.now()-new Date(x.created)>6*86400000).length;let summary='Trabajo: '+open('work')+' pendientes; Mi niña: '+open('child')+'; Casa: '+open('house')+'; Pareja: '+open('partner')+'; Para mí: '+open('me')+'. '+(oldWork?oldWork+' tarea(s) de trabajo llevan más de 7 días. ':'')+'Energía: '+(s.energy||'sin registrar')+'. Descanso: '+(s.rest||'sin registrar')+'.';s.lastWeekly=summary;save();page('📋 Revisar mi semana','Una lectura basada solo en lo que registraste.','<div class="card"><b>Resumen estructurado</b><p>'+esc(summary)+'</p></div><label class="muted">Energía</label><select class="field" onchange="s.energy=this.value;save();week()"><option>'+esc(s.energy||'Sin registrar')+'</option><option>Alta</option><option>Media</option><option>Baja</option></select><label class="muted">Descanso</label><select class="field" onchange="s.rest=this.value;save();week()"><option>'+esc(s.rest||'Sin registrar')+'</option><option>Bien</option><option>Regular</option><option>Poco</option></select><textarea class="field area" onchange="s.weekly=this.value;save()" placeholder="¿Qué pasó esta semana?">'+esc(s.weekly)+'</textarea><button class="action" onclick="downloadWeekly()"><b>⬇️ Descargar resumen semanal</b></button><div class="notice">El sistema no afirma “estás descansada” si no lo registraste.</div>')}
function downloadWeekly(){downloadText('revision-semanal-zary.txt','REVISIÓN SEMANAL ZARY\n\n'+s.lastWeekly+'\n\nNotas:\n'+s.weekly)}
function calendar(){let ev=s.events.map((e,i)=>'<div class="item"><b>'+esc(e.title)+'</b><div class="muted">'+esc(e.date)+' '+esc(e.time||'')+' · '+esc(e.area)+'</div><button class="chip" onclick="openGoogleEvent('+i+')">Google Calendar</button> <button class="chip" onclick="s.events.splice('+i+',1);save();calendar()">×</button></div>').join('');page('📅 Calendario','El tiempo es parte del Centro de Control.','<input id="et" class="field" placeholder="Compromiso o cita"><div class="row"><input id="ed" type="date" class="field"><input id="etime" type="time" class="field"></div><select id="ea" class="field"><option>Trabajo</option><option>Mi niña</option><option>Casa</option><option>Pareja</option><option>Yo</option></select><button class="action primary" onclick="addEvent()"><b>＋ Guardar compromiso</b></button>'+ev+'<div class="sep"></div><button class="action" onclick="connectGoogle()"><b>🔗 Conectar Google Calendar + Drive</b><span>'+googleStatus()+'</span></button><div class="notice">Sin conexión OAuth, “Google Calendar” abre el formulario oficial con el evento preparado; no modifica el calendario silenciosamente.</div>')}
function addEvent(){let t=document.getElementById('et').value.trim(),d=document.getElementById('ed').value,tm=document.getElementById('etime').value,a=document.getElementById('ea').value;if(!t||!d)return alert('Añade título y fecha.');s.events.unshift({title:t,date:d,time:tm,area:a});save();calendar()}
function openGoogleEvent(i){let e=s.events[i],start=e.date.replaceAll('-','')+'T'+(e.time?e.time.replace(':',''):'0900')+'00',end=start;let u='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(e.title)+'&dates='+start+'/'+end+'&details='+encodeURIComponent('Centro de Control Zary · '+e.area);window.open(u,'_blank')}
let gToken=null,gClient=null;
const GOOGLE_SCOPE='https://www.googleapis.com/auth/calendar.readonly https://www.googleapis.com/auth/drive.file';
function googleStatus(){return gToken?'Conectado en esta sesión':s.googleClientId?'Listo para autorizar':'Pendiente de configuración técnica'}
function connectGoogle(){if(!s.googleClientId)return alert('La conexión está preparada, pero falta insertar el OAuth Client ID válido en Ajustes > Configuración técnica. No se necesita contraseña ni client_secret.');try{if(!window.google?.accounts?.oauth2)return alert('Google Identity Services todavía no cargó. Espera unos segundos.');gClient=google.accounts.oauth2.initTokenClient({client_id:s.googleClientId,scope:GOOGLE_SCOPE,callback:r=>{if(r.error)return alert('Google no autorizó: '+r.error);gToken=r.access_token;alert('Google Calendar + Drive conectados durante esta sesión.');calendar()}});gClient.requestAccessToken({prompt:'consent'})}catch(e){alert(e.message)}}
function drive(){page('☁️ Archivo en Google Drive','Drive será el archivo privado. Gmail no debe ser la carpeta documental.','<div class="statusline"><span class="dot '+(gToken?'on':'wait')+'"></span><b>'+googleStatus()+'</b></div><button class="action" onclick="connectGoogle()"><b>🔗 Autorizar Google</b><span>Calendar (lectura) + Drive (archivos creados por la app).</span></button><button class="action primary" onclick="saveBackupDrive()"><b>☁️ Guardar copia del Centro en Drive</b><span>Solo funciona después de autorizar.</span></button><button class="action" onclick="downloadBackup()"><b>⬇️ Descargar copia privada</b><span>Alternativa local inmediata.</span></button><div class="notice">No se suben historias clínicas desde esta función. Los expedientes requieren un flujo privado separado.</div>')}
async function saveBackupDrive(){if(!gToken)return connectGoogle();try{let body=new Blob([JSON.stringify({...s,googleClientId:''},null,2)],{type:'application/json'});let meta={name:'Centro-Control-Zary-'+new Date().toISOString().slice(0,10)+'.json',mimeType:'application/json'};let form=new FormData();form.append('metadata',new Blob([JSON.stringify(meta)],{type:'application/json'}));form.append('file',body);let r=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{Authorization:'Bearer '+gToken},body:form});if(!r.ok)throw new Error('Drive API '+r.status);let j=await r.json();alert('Copia guardada en Google Drive. ID: '+j.id)}catch(e){alert('No se pudo guardar: '+e.message)}}
function downloadBackup(){downloadText('Centro-Control-Zary-backup.json',JSON.stringify({...s,googleClientId:''},null,2),'application/json')}
function downloadText(name,text,type='text/plain'){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function voice(k){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Este navegador no expone dictado directo. Usa el micrófono del teclado del teléfono.');return}let r=new SR();r.lang='es-ES';r.interimResults=false;r.onresult=e=>{let t=e.results[0][0].transcript;if(document.getElementById('new'))document.getElementById('new').value=t;else{s[k].unshift({text:t,created:now(),done:false});save();alert('Dictado guardado.')}};r.onerror=()=>alert('No pude escuchar. Revisa el permiso del micrófono.');r.start()}
function technical(){page('🧩 Configuración técnica','Solo para quien administra la aplicación. Zary no necesita tocar esto.','<label class="muted">OAuth Client ID web de Google</label><input id="cid" class="field" value="'+esc(s.googleClientId)+'" placeholder="...apps.googleusercontent.com"><button class="action primary" onclick="saveTech()"><b>Guardar configuración técnica</b></button><div class="notice">El Client ID no es una contraseña. Nunca pegues Client Secret, contraseña, SMS ni códigos de verificación.</div>')}
function saveTech(){let x=document.getElementById('cid').value.trim();if(x&&!x.endsWith('.apps.googleusercontent.com'))return alert('Ese valor no parece un OAuth Client ID web.');s.googleClientId=x;save();alert('Configuración guardada en este dispositivo.');go('settings')}
function settings(){page('⚙️ Ajustes','Privacidad, conexiones y copias.','<div class="card"><b>Versión</b><span class="muted">Centro de Control Zary v1.7</span></div><button class="action" onclick="go(\'drive\')"><b>☁️ Google Drive + Calendar</b><span>'+googleStatus()+'</span></button><button class="action" onclick="go(\'technical\')"><b>🧩 Configuración técnica</b><span>OAuth Client ID. Solo administración.</span></button><button class="action" onclick="downloadBackup()"><b>⬇️ Exportar mis datos</b></button><button class="action danger" onclick="wipe()"><b>🗑️ Borrar datos locales</b></button><div class="notice">Las notas personales se guardan localmente hasta que Zary autorice Drive. Las historias clínicas no se guardan aquí.</div>')}
function wipe(){if(confirm('¿Borrar las notas guardadas en este dispositivo?')){s=blank();localStorage.removeItem(KEY);save();home()}}
