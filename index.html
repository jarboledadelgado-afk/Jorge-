<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#667557">
<title>Centro de Control Zary v1.9.0</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f0e6;color:#292923;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #4e6d3d;outline-offset:2px}
.app{max-width:680px;margin:auto;min-height:100vh;padding:calc(8px + env(safe-area-inset-top)) 16px calc(100px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:#f6f0e6ee;backdrop-filter:blur(10px);padding:8px 0 10px}
.topline{display:flex;align-items:center;justify-content:space-between;gap:8px}.navctl,.toolbar,.row{display:flex;gap:8px;flex-wrap:wrap}.toolbar{margin-top:8px}
.round,.chip,.action,.card{border:1px solid #d9cfbf;background:#fffaf2;color:inherit}.round,.chip{border-radius:999px;padding:10px 12px}.round{min-width:42px}
.action,.card{width:100%;border-radius:18px;padding:16px;text-align:left}.action b,.card b{display:block;font-size:18px;margin-bottom:4px}
.primary{background:#667557;color:#fff;border-color:#667557}.sage{background:#dfe5d5}.rose{background:#ead8d1}.terra{background:#e4c4b4}.blue{background:#dde4e7}
.brand{font-weight:800}.small,.muted{font-size:12px;color:#777}.sub{color:#6f6b62;line-height:1.45;margin-bottom:16px}.grid{display:grid;gap:10px}
h1,h2,h3{font-family:Georgia,serif}.field{width:100%;border:1px solid #d8cdbd;background:#fffdf8;border-radius:14px;padding:14px;font-size:16px;margin:7px 0 10px}.area{min-height:110px;resize:vertical}
.item{background:#fffaf2;border:1px solid #ded4c5;border-radius:15px;padding:13px;margin:8px 0}.notice,.guide,.ok{padding:13px;border-radius:11px;margin:12px 0;line-height:1.45}
.notice{background:#f0e6d6;border-left:4px solid #a76f52}.guide{background:#eef1e8;border-left:4px solid #667557}.ok{background:#e5eddc;border-left:4px solid #667557}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(680px,100%);display:flex;background:#fffaf2ee;backdrop-filter:blur(10px);border-top:1px solid #ded4c5;padding:8px 5px calc(8px + env(safe-area-inset-bottom));z-index:30}
.bottom button{flex:1;border:0;background:none;font-size:11px;padding:5px 2px;color:inherit}.bottom span{display:block;font-size:20px}
.composer{background:#fffaf2;border:1px solid #ded4c5;border-radius:18px;padding:12px;margin:10px 0}.composer-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.toast{position:fixed;left:50%;bottom:108px;transform:translateX(-50%);background:#292923;color:#fff;padding:10px 14px;border-radius:999px;z-index:50;display:none;max-width:90%;font-size:13px}
.filebtn{position:relative;overflow:hidden}.filebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
@media(max-width:480px){.composer-actions{grid-template-columns:1fr}.toolbar .chip{flex:1}.action{padding:14px}}
</style>
</head>
<body>
<main class="app">
<header>
<div class="topline">
<div class="navctl">
<button class="round" aria-label="Atrás" onclick="appBack()">←</button>
<button class="round" aria-label="Adelante" onclick="appNext()">→</button>
<button class="round" aria-label="Inicio" onclick="go('home')">⌂</button>
</div>
<div style="text-align:center"><div class="brand">OREV® · Zary</div><div class="small">Centro de Control · v1.9.0</div></div>
<button class="round" aria-label="Ajustes" onclick="go('settings')">⚙️</button>
</div>
<div class="toolbar">
<button class="chip" onclick="go('search')">🔎 Buscar</button>
<button class="chip" onclick="quickVoice()">🎙️ Hablar</button>
<button class="chip" onclick="go('dailylog')">🗣️ Mi día</button>
</div>
</header>
<div id="view" tabindex="-1"></div>
</main>
<nav class="bottom" aria-label="Navegación principal">
<button onclick="go('home')"><span>🏠</span>Inicio</button>
<button onclick="go('work')"><span>💼</span>Trabajo</button>
<button onclick="go('child')"><span>👶</span>Mi niña</button>
<button onclick="go('house')"><span>🏡</span>Casa</button>
<button onclick="go('me')"><span>🌿</span>Yo</button>
</nav>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
const VERSION='1.9.0', KEY='zary-control-v1-9-0', oldKeys=['zary-control-v1-8-5','zary-control-v1-8-4','zary-control-v1-8-3','zary-control-v1-8','zary-control-v1-7'];
const now=()=>new Date().toISOString();
const blank=()=>({capture:[],work:[],child:[],house:[],partner:[],me:[],daily:[],today:['','',''],events:[],focusTask:'',usage:[]});
let s=load(),current='home',stack=['home'],forward=[],pendingFiles=[],timer=null,left=0;
const V=()=>document.getElementById('view');
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function load(){try{let raw=localStorage.getItem(KEY);if(!raw)for(const k of oldKeys){raw=localStorage.getItem(k);if(raw)break}let o=Object.assign(blank(),raw?JSON.parse(raw):{});['capture','work','child','house','partner','me','daily'].forEach(k=>o[k]=(o[k]||[]).map(v=>typeof v==='string'?{text:v,created:now(),done:false,files:[]}:{files:[],done:false,...v}));return o}catch(e){return blank()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(s));return true}catch(e){toast('No se pudo guardar en este dispositivo');return false}}
function logUsage(action){s.usage.unshift({action,at:now(),route:current});s.usage=s.usage.slice(0,100);save()}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>e.style.display='none',2200)}
function renderRoute(r){(routes[r]||home)();window.scrollTo(0,0);setTimeout(()=>V()?.focus({preventScroll:true}),0)}
function go(r,push=true){if(!routes[r])r='home';if(push&&r!==current){stack.push(r);forward=[]}current=r;location.hash=r;renderRoute(r);logUsage('go:'+r)}
function appBack(){if(stack.length>1){forward.push(stack.pop());current=stack[stack.length-1];location.hash=current;renderRoute(current)}else go('home',false)}
function appNext(){if(forward.length){const r=forward.pop();stack.push(r);current=r;location.hash=r;renderRoute(r)}else toast('No hay una pantalla siguiente')}
window.addEventListener('hashchange',()=>{const r=location.hash.replace('#','');if(routes[r]&&r!==current){current=r;if(stack[stack.length-1]!==r)stack.push(r);renderRoute(r)}});
window.addEventListener('keydown',e=>{const tag=(document.activeElement?.tagName||'').toLowerCase(),editing=['input','textarea','select'].includes(tag);if(editing)return;if(e.key==='ArrowLeft'){e.preventDefault();appBack()}else if(e.key==='ArrowRight'){e.preventDefault();appNext()}else if(e.key==='Escape'&&current!=='home'){e.preventDefault();appBack()}});
function page(t,sub,b){V().innerHTML=(current!=='home'?'<button class="action" onclick="appBack()"><b>← Volver</b></button>':'')+'<h2>'+t+'</h2><div class="sub">'+sub+'</div>'+b}
function composer(key,ph,guide=false){return '<div class="composer"><textarea id="txt" class="field area" placeholder="'+ph+'"></textarea><div class="composer-actions"><button class="chip" onclick="voiceInto(\'txt\')">🎙️ Hablar</button><label class="chip filebtn">📎 Referencia<input type="file" multiple onchange="showFiles(this)"></label><label class="chip filebtn">📷 Foto<input type="file" accept="image/*" capture="environment" onchange="showFiles(this)"></label></div><div class="notice"><b>Importante:</b> en esta versión el archivo no se sube; solo se guarda su nombre, tipo y tamaño como referencia local.</div><div class="row"><button class="action primary" onclick="saveComposer(\''+key+'\')"><b>💾 Guardar</b></button>'+(guide?'<button class="action sage" onclick="guideCurrent()"><b>🧭 Guíame ahora</b></button>':'')+'</div></div>'}
function showFiles(i){pendingFiles=[...pendingFiles,...Array.from(i.files||[]).map(f=>({name:f.name,type:f.type,size:f.size}))];toast(pendingFiles.length+' referencia(s) preparadas')}
function saveComposer(k){const t=(document.getElementById('txt')?.value||'').trim();if(!t&&!pendingFiles.length)return toast('Escribe, habla o adjunta una referencia.');s[k].unshift({text:t||'[Referencia de archivo]',created:now(),done:false,files:pendingFiles});pendingFiles=[];save();renderRoute(k==='daily'?'dailylog':k);toast('Guardado')}
function itemHtml(k,x,i){return '<div class="item"><b>'+esc(x.text)+'</b><div class="muted">'+new Date(x.created).toLocaleString('es')+'</div>'+(x.files?.length?'<div class="muted">📎 '+x.files.map(f=>esc(f.name)).join(', ')+' · referencias, no archivos subidos</div>':'')+(k==='capture'?'<button class="chip" onclick="guideSaved('+i+')">🧭 Orientarme</button> ':'')+'<button class="chip" onclick="toggle(\''+k+'\','+i+')">'+(x.done?'↺ Reabrir':'✓ Terminar')+'</button> <button class="chip" onclick="editItem(\''+k+'\','+i+')">✏️</button> <button class="chip" onclick="delItem(\''+k+'\','+i+')">🗑️</button></div>'}
function listArea(t,sub,k,ph,guide=false){page(t,sub,composer(k,ph,guide)+s[k].map((x,i)=>itemHtml(k,x,i)).join(''))}
function toggle(k,i){s[k][i].done=!s[k][i].done;save();renderRoute(k==='daily'?'dailylog':k)}
function editItem(k,i){const v=prompt('Editar',s[k][i].text);if(v!==null){s[k][i].text=v.trim()||s[k][i].text;save();renderRoute(k==='daily'?'dailylog':k)}}
function delItem(k,i){if(confirm('¿Eliminar este registro?')){s[k].splice(i,1);save();renderRoute(k==='daily'?'dailylog':k)}}
function home(){page('Hola, Zary.','¿Qué necesitas ahora?','<div class="grid"><button class="action primary" onclick="go(\'capture\')"><b>✨ Quiero ordenar lo que me pasa</b><span>Habla y recibe una guía inicial.</span></button><button class="action blue" onclick="go(\'dailylog\')"><b>🗣️ Cuéntame tu día</b></button><button class="action" onclick="go(\'dayplan\')"><b>☀️ ¿Qué me toca hoy?</b></button><button class="action terra" onclick="go(\'focus\')"><b>🎯 Hiperfoco</b></button><button class="action rose" onclick="go(\'overload\')"><b>🫶 Estoy saturada</b></button><button class="action" onclick="go(\'status\')"><b>🧪 Estado del piloto</b><span>Qué funciona, qué está pendiente y qué está bloqueado.</span></button></div>')}
function capture(){listArea('✨ Quiero ordenar lo que me pasa','Registro local + guía OREV® basada en lo que escribes.','capture','Cuenta qué pasó, qué sientes o qué te preocupa…',true)}
let sessionText='',sessionAnswers=[],sessionStep=0,mapVersion=1,mapValidation='';
function guideCurrent(){const t=(document.getElementById('txt')?.value||'').trim();if(!t)return toast('Primero cuéntame qué está pasando.');showGuide(t)}
function guideSaved(i){showGuide(s.capture[i].text)}
function showGuide(t){sessionText=t;sessionAnswers=[];sessionStep=0;mapVersion=1;renderClarityQuestion()}
function clarityQuestions(t){const x=t.toLowerCase(),q=['De todo lo que acabas de contar, ¿qué es lo que más necesitas resolver o entender hoy?'];if(/posterg|aplaz|dejando|descuidad|no hago|no sé por dónde/.test(x))q.push('¿Qué es exactamente lo que vienes dejando para después?');if(/cansad|dormir|sueño|agot/.test(x))q.push('¿Qué ha pasado con tu descanso en los últimos días?');if(/trabaj|dinero|pagar|deuda|oblig/.test(x))q.push('¿Qué obligación concreta tiene una consecuencia real si no la atiendes esta semana?');q.push('Justo antes de que esto ocurra, ¿qué suele pasar?');q.push('¿Qué has intentado ya y qué pasó?');return q.slice(0,5)}
function renderClarityQuestion(){const qs=clarityQuestions(sessionText);if(sessionStep>=qs.length||sessionStep>=4)return renderMap();const q=qs[sessionStep];V().insertAdjacentHTML('afterbegin','<div class="guide"><b>🧭 Sesión de Claridad · paso '+(sessionStep+1)+'</b><p><strong>'+esc(q)+'</strong></p><textarea id="clarityAnswer" class="field area"></textarea><div class="row"><button class="chip" onclick="voiceInto(\'clarityAnswer\')">🎙️ Hablar</button><button class="action primary" onclick="nextClarity()"><b>→ Siguiente pregunta</b></button></div></div>')}
function nextClarity(){const a=(document.getElementById('clarityAnswer')?.value||'').trim();if(!a)return toast('Respóndeme antes de continuar.');sessionAnswers.push(a);sessionStep++;document.querySelector('.guide')?.remove();renderClarityQuestion()}
function renderMap(){const all=(sessionText+' '+sessionAnswers.join(' ')).toLowerCase(),facts=['Lo que dijiste literalmente: “'+sessionText.slice(0,220)+(sessionText.length>220?'…':'')+'”'],interpretations=[],hypotheses=[],needs=[];let technique='Siguiente acción pequeña',why='Conviene reducir las piezas a una acción observable.';if(/cansad|dormir|sueño|agot/.test(all)){facts.push('Has mencionado cansancio o descanso.');needs.push('Proteger un espacio de descanso.');hypotheses.push('Hipótesis a validar: el cansancio puede estar reduciendo tu capacidad de iniciar o sostener tareas.')}if(/posterg|aplaz|no hago|dejando|descuidad/.test(all)){facts.push('Has dicho que algo se posterga.');hypotheses.push('Hipótesis a validar: la tarea puede ser demasiado grande, poco clara o competir con algo más atractivo.');technique='Fragmentación + Hiperfoco';why='Primero reducimos la tarea y después protegemos un bloque.'}if(mapVersion>1&&sessionAnswers.length)facts.push('Corrección aportada: “'+sessionAnswers.at(-1).slice(0,180)+'”');const html='<div class="guide"><b>🗺️ Mapa OREV® · versión '+mapVersion+'</b><p><strong>● HECHOS / RELATO</strong><br>'+facts.map(v=>'• '+esc(v)).join('<br>')+'</p><p><strong>◇ INTERPRETACIONES</strong><br>'+(interpretations.length?interpretations.map(v=>'• '+esc(v)).join('<br>'):'• Sin interpretación necesaria todavía.')+'</p><p><strong>△ HIPÓTESIS</strong><br>'+(hypotheses.length?hypotheses.map(v=>'• '+esc(v)).join('<br>'):'• Falta evidencia para una hipótesis útil.')+'</p><p><strong>? NECESIDADES</strong><br>'+(needs.length?needs.map(v=>'• '+esc(v)).join('<br>'):'• Identificar qué necesita cambiar primero.')+'</p><p><strong>🧰 Técnica propuesta:</strong> '+esc(technique)+'<br>'+esc(why)+'</p><p><strong>¿Este mapa te representa ahora?</strong></p><div class="row"><button class="chip" onclick="validateMap(\'yes\')">✓ Sí</button><button class="chip" onclick="validateMap(\'part\')">◐ En parte</button><button class="chip" onclick="validateMap(\'no\')">✕ No</button></div><p class="muted">Una hipótesis es un mapa, no una sentencia. Si el territorio contradice el mapa, cambiamos el mapa.</p></div>';document.querySelector('.guide')?.remove();V().insertAdjacentHTML('afterbegin',html)}
function validateMap(v){mapValidation=v;if(v==='yes')return renderActionStep();const q=v==='part'?'¿Qué parte sí te representa y qué parte no?':'¿Qué entendí mal o qué pieza importante falta?';document.querySelector('.guide').insertAdjacentHTML('beforeend','<div class="notice" id="correctionBox"><b>'+q+'</b><textarea id="mapCorrection" class="field area"></textarea><button class="chip" onclick="continueCorrection()">→ Continuar</button></div>')}
function continueCorrection(){const a=(document.getElementById('mapCorrection')?.value||'').trim();if(!a)return toast('Cuéntame qué debo corregir.');sessionAnswers.push(a);mapVersion++;renderMap()}
function renderActionStep(){document.querySelector('.guide')?.remove();V().insertAdjacentHTML('afterbegin','<div class="guide"><b>✓ Mapa validado por ti</b><p><strong>Microacción:</strong> elige una sola acción de 20–30 minutos.</p><div class="row"><button class="action primary" onclick="go(\'focus\')"><b>🎯 Empezar ahora</b></button><button class="chip" onclick="saveFollowupPrompt()">✍️ Definir otra</button></div></div>')}
function saveFollowupPrompt(){const a=prompt('¿Qué paso sí sería realista ahora?');if(a?.trim()){s.me.unshift({text:'Microacción OREV®: '+a.trim(),created:now(),done:false,files:[]});save();go('me')}}
function work(){page('💼 Trabajo','Correo, auditoría, PAI, agenda y pendientes.','<div class="grid"><button class="action" onclick="go(\'worklist\')"><b>✓ Pendientes</b></button><button class="action" onclick="go(\'calendar\')"><b>📅 Agenda</b></button><button class="action" onclick="go(\'gmail\')"><b>✉️ Gmail piloto</b><span>Integración separada de solo lectura.</span></button><button class="action" onclick="go(\'clinical\')"><b>🔬 Auditoría clínica</b></button><button class="action" onclick="go(\'pai\')"><b>📊 PAI / Excel</b></button></div>')}
function worklist(){listArea('Pendientes de trabajo','Escribe, habla o adjunta una referencia.','work','¿Qué queda pendiente?')}
function child(){listArea('👶 Mi niña','Citas, compras, documentos y recuerdos.','child','¿Qué quiero recordar o hacer?')}
function house(){listArea('🏡 Casa','Compras, cocina, limpieza y organización.','house','¿Qué hace falta en casa?')}
function me(){page('🌿 Yo','Tu espacio también cuenta.','<div class="grid"><button class="action primary" onclick="go(\'capture\')"><b>🧭 Acompáñame</b></button><button class="action" onclick="go(\'personal\')"><b>🌱 Tiempo para mí</b></button><button class="action" onclick="go(\'partner\')"><b>❤️ Pareja</b></button><button class="action" onclick="go(\'dailylog\')"><b>🗣️ Mi día a día</b></button></div>')}
function personal(){listArea('🌱 Tiempo para mí','Descanso y espacio personal.','me','¿Qué necesito para mí?')}
function partner(){listArea('❤️ Pareja','Conversaciones, acuerdos y planes.','partner','¿Qué quiero hablar u organizar?')}
function dailylog(){page('🗣️ Cuéntame tu día','Registro local para organizar carga y pendientes.',composer('daily','Ej.: trabajé de 8 a 12…')+s.daily.map((x,i)=>itemHtml('daily',x,i)).join(''))}
function dayplan(){const open=k=>s[k].filter(x=>!x.done).slice(0,3).map(x=>'• '+esc(x.text)).join('<br>')||'—';page('☀️ ¿Qué me toca hoy?','Vista basada solo en lo que registraste en este dispositivo.','<div class="card"><b>Mis 3</b>'+s.today.map((x,i)=>'<input class="field" value="'+esc(x)+'" onchange="s.today['+i+']=this.value;save()" placeholder="Prioridad '+(i+1)+'">').join('')+'</div><div class="card"><b>💼 Trabajo</b>'+open('work')+'</div><div class="card"><b>👶 Mi niña</b>'+open('child')+'</div><div class="card"><b>🏡 Casa</b>'+open('house')+'</div><div class="card"><b>🌿 Para mí</b>'+open('me')+'</div><div class="notice">Google Calendar automático sigue PENDIENTE: aquí no se afirma una sincronización que todavía no existe.</div>')}
function focus(){page('🎯 Hiperfoco','Una cosa. Después paramos.','<input id="focusText" class="field" value="'+esc(s.focusTask)+'" placeholder="¿Qué quiero terminar?"><div class="row"><button class="chip" onclick="voiceInto(\'focusText\')">🎙️</button><button class="chip" onclick="startFocus(25)">25 min</button><button class="chip" onclick="startFocus(45)">45 min</button><button class="chip" onclick="stopFocus()">Detener</button></div><div id="clock" style="font-size:42px;text-align:center;margin:20px">—</div>')}
function startFocus(m){s.focusTask=document.getElementById('focusText').value;save();left=m*60;clearInterval(timer);beep();tick();timer=setInterval(()=>{left--;tick();if(left<=0){clearInterval(timer);timer=null;beep();alert('Bloque terminado. Guarda el avance y descansa antes de decidir si haces otro.')}},1000)}
function stopFocus(){clearInterval(timer);timer=null;left=0;tick();toast('Temporizador detenido')}
function tick(){const e=document.getElementById('clock');if(e)e.textContent=left?Math.floor(left/60)+':'+String(left%60).padStart(2,'0'):'—'}
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);g.gain.value=.05;o.frequency.value=880;o.start();o.stop(a.currentTime+.15)}catch(e){}}
function overload(){page('🫶 Estoy saturada','Solo necesitamos una siguiente acción.',composer('capture','¿Qué pesa más ahora?',true))}
function calendar(){page('📅 Agenda','Agenda local. Sin sincronización automática con Google Calendar todavía.','<input id="evtitle" class="field" placeholder="Compromiso"><input id="evdate" class="field" type="datetime-local"><button class="action primary" onclick="addEvent()"><b>＋ Guardar evento</b></button>'+s.events.map((e,i)=>'<div class="item"><b>'+esc(e.title)+'</b><br>'+esc(e.date)+' <button class="chip" onclick="deleteEvent('+i+')">🗑️</button></div>').join(''))}
function addEvent(){const t=document.getElementById('evtitle').value.trim(),d=document.getElementById('evdate').value;if(!t||!d)return toast('Falta título o fecha.');s.events.push({title:t,date:d});save();calendar();toast('Evento local guardado')}
function deleteEvent(i){if(confirm('¿Eliminar evento?')){s.events.splice(i,1);save();calendar()}}
function gmail(){page('✉️ Gmail piloto','Existe un piloto separado de solo lectura; necesita consentimiento OAuth real para probarse con la cuenta de Zary.','<div class="notice">Estado: IMPLEMENTADO EN ARCHIVO SEPARADO / E2E REAL PENDIENTE.</div><button class="action primary" onclick="location.href=\'zary-v1.5.html\'"><b>Abrir piloto Gmail</b></button>')}
function clinical(){page('🔬 Auditoría clínica','La capa clínica real requiere procesamiento privado; esta web pública no debe almacenar historias clínicas.','<div class="notice">Estado: BLOQUEADO por backend privado. Los botones anteriores eran decorativos y fueron retirados para no simular funciones.</div><div class="grid"><button class="action" onclick="clinicalInfo(\'Pregunta puntual\')"><b>🔎 Pregunta puntual</b></button><button class="action" onclick="clinicalInfo(\'Resumen 1 hoja\')"><b>🧾 Resumen 1 hoja</b></button><button class="action" onclick="clinicalInfo(\'RETINA + Red Team\')"><b>🔬 RETINA + Red Team</b></button><button class="action" onclick="clinicalInfo(\'Presentación Premium\')"><b>📊 Presentación Premium</b></button></div>')}
function clinicalInfo(name){alert(name+': requiere capa privada de procesamiento. No se ejecuta dentro de GitHub Pages.')}
function pai(){page('📊 PAI / Excel','Para auditoría real se necesita el archivo original y una capa de procesamiento segura.',composer('work','¿Qué necesitas revisar del PAI?'))}
function searchPage(){page('🔎 Buscar','Busca en lo guardado localmente.','<input id="q" class="field" placeholder="Buscar…" oninput="doSearch()"><div id="results"></div>')}
function doSearch(){const q=document.getElementById('q').value.toLowerCase(),out=[];['capture','work','child','house','partner','me','daily'].forEach(k=>s[k].forEach(x=>{if(q&&x.text.toLowerCase().includes(q))out.push('<div class="item"><b>'+esc(x.text)+'</b><div class="muted">'+k+'</div></div>')}));document.getElementById('results').innerHTML=out.join('')||'<div class="muted">Sin resultados</div>'}
function settings(){page('⚙️ Ajustes','Privacidad, respaldo y restauración.','<div class="card"><b>Guardado actual</b><span class="muted">Notas: localStorage de este navegador. Archivos: solo metadatos de referencia.</span></div><button class="action" onclick="exportData()"><b>⬇️ Exportar copia privada JSON</b></button><label class="action" style="display:block"><b>⬆️ Importar copia privada JSON</b><input type="file" accept="application/json" onchange="importData(this)" style="margin-top:10px"></label><button class="action rose" onclick="resetData()"><b>🗑️ Borrar datos locales</b></button>')}
function exportData(){const b=new Blob([JSON.stringify(s,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='Centro-Zary-v'+VERSION+'-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(input){const f=input.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||typeof o!=='object')throw new Error();s=Object.assign(blank(),o);save();toast('Copia importada');go('home')}catch(e){toast('El archivo no es una copia válida')}};r.readAsText(f)}
function resetData(){if(confirm('Esto borrará los datos locales de esta versión. ¿Continuar?')){localStorage.removeItem(KEY);s=blank();go('home');toast('Datos locales borrados')}}
function statusPage(){page('🧪 Estado del piloto','La evidencia manda sobre el porcentaje.','<div class="ok"><b>IMPLEMENTADO EN ESTA VERSIÓN</b><br>navegación interna, historial por hash, teclado ←/→/Esc fuera de campos, registros locales, edición, borrado, búsqueda, agenda local, temporizador, exportación e importación JSON, guía OREV® local.</div><div class="notice"><b>PENDIENTE DE PRUEBA REAL</b><br>Safari/iPhone de Zary, dictado Web Speech, audio en Safari y OAuth Gmail con su cuenta.</div><div class="notice"><b>BLOQUEADO POR INFRAESTRUCTURA</b><br>backend privado, Google Calendar bidireccional, Google Drive automático, procesamiento clínico privado y automatización con la app cerrada.</div><div class="card"><b>VEREDICTO ACTUAL</b><span>SARI/ZARY EN QA — no se declara piloto definitivo hasta completar prueba real.</span></div>')}
function voiceInto(id){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return toast('Usa el micrófono del teclado en este navegador.');const r=new SR();r.lang='es-ES';r.onresult=e=>{const el=document.getElementById(id);if(el)el.value=(el.value?el.value+' ':'')+e.results[0][0].transcript};r.onerror=()=>toast('No pude escuchar. Revisa el permiso del micrófono.');r.start()}
function quickVoice(){go('capture');setTimeout(()=>voiceInto('txt'),150)}
const routes={home,work,worklist,child,house,me,personal,partner,capture,dailylog,dayplan,focus,overload,calendar,gmail,clinical,pai,search:searchPage,settings,status:statusPage};
const initial=location.hash.replace('#','');if(initial&&routes[initial]){current=initial;stack=[initial]}renderRoute(current);
</script>
</body></html>
