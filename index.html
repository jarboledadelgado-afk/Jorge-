<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#5f6f52"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>Centro de Control Personal Zary</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f0e6;color:#272822;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:560px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 18px calc(28px + env(safe-area-inset-bottom))}header{display:flex;align-items:center;justify-content:space-between;padding:18px 0 10px}.brand{font-weight:800;letter-spacing:.02em}.gear,.back{border:1px solid #d7cdbd;background:#fffaf2;border-radius:999px;padding:10px 14px;font-size:15px}h1{font-family:Georgia,serif;font-size:34px;line-height:1.05;margin:30px 0 8px}h2{font-family:Georgia,serif;font-size:27px;margin:24px 0 10px}.sub{color:#68685f;font-size:17px;line-height:1.45;margin-bottom:28px}.grid{display:grid;gap:12px}.card,button.action{width:100%;border:1px solid #ded4c5;background:#fffaf2;border-radius:18px;padding:18px;text-align:left;color:#272822;font-size:17px;box-shadow:0 2px 10px #00000008}.card b,.action b{display:block;font-size:18px;margin-bottom:4px}.muted{color:#777268;font-size:14px}.primary{background:#667557!important;color:white!important;border-color:#667557!important}.rose{background:#ead8d1!important}.sage{background:#dfe5d5!important}.terra{background:#e4c4b4!important}.field{width:100%;border:1px solid #d8cdbd;background:#fffdf8;border-radius:15px;padding:15px;font-size:17px;margin:7px 0 13px;min-height:52px}.field.area{min-height:130px;resize:vertical}.row{display:flex;gap:10px}.row>*{flex:1}.pill{display:inline-block;background:#e2e7da;border-radius:999px;padding:7px 11px;font-size:13px;margin:3px}.item{background:#fffaf2;border:1px solid #ded4c5;border-radius:16px;padding:14px;margin:9px 0;display:flex;gap:10px;align-items:flex-start}.item input{margin-top:4px;transform:scale(1.3)}.item.done span{text-decoration:line-through;opacity:.55}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.nav button{border:0;border-radius:999px;padding:9px 12px;background:#e8e0d4}.notice{background:#f0e6d6;border-left:4px solid #a76f52;padding:13px;border-radius:10px;margin:15px 0;font-size:14px}.footer{text-align:center;color:#8b8377;font-size:12px;margin-top:34px}.danger{color:#8a3d35}.hidden{display:none}</style></head><body><main class="app"><header><div class="brand">OREV® · Zary</div><button class="gear" onclick="go('settings')">⚙️ Ajustes</button></header><div id="view"></div></main><script>const KEY='zary-control-center-v1-4';let mem={};function get(){try{let x=localStorage.getItem(KEY)||localStorage.getItem('zary-control-center-v1-3')||localStorage.getItem('sari-control-center-v1');return x?JSON.parse(x):{inbox:[],today:['','',''],work:[],notes:[],close:'',week:''}}catch(e){return mem.data||{inbox:[],today:['','',''],work:[],notes:[],close:'',week:''}}}let s=get();function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){mem.data=s}}function esc(x){return String(x||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function shell(title,body){document.getElementById('view').innerHTML='<div class="nav"><button onclick="go(\'home\')">Inicio</button><button onclick="go(\'inbox\')">Sacar de mi cabeza</button><button onclick="go(\'today\')">Mis 3 de hoy</button><button onclick="go(\'work\')">Trabajo</button></div><h2>'+title+'</h2>'+body}function home(){document.getElementById('view').innerHTML='<h1>Buenos días, Zary.</h1><div class="sub">Hoy no tienes que resolverlo todo.<br>Solo necesitas saber qué merece tu atención ahora.</div><div class="grid"><button class="action primary" onclick="go(\'inbox\')"><b>🧠 Sacar de mi cabeza</b><span>Escríbelo aquí. No tienes que ordenarlo todavía.</span></button><button class="action sage" onclick="go(\'today\')"><b>✓ Mis 3 de hoy</b><span>Solo tres cosas que sí importan hoy.</span></button><button class="action" onclick="go(\'work\')"><b>💼 Trabajo</b><span>Correos, pendientes e informes.</span></button><button class="action rose" onclick="go(\'order\')"><b>🧩 Necesito ordenar algo</b><span>Convierte ruido en un siguiente paso.</span></button><button class="action terra" onclick="go(\'close\')"><b>🌙 Cerrar mi día</b><span>Deja lo pendiente fuera de tu cabeza.</span></button><button class="action" onclick="go(\'week\')"><b>📅 Mi semana</b><span>Una mirada simple, sin sobrecarga.</span></button></div><div class="footer">Centro de Control Personal Zary · v1.4</div>'}function inbox(){shell('Sácalo de mi cabeza','<div class="sub">Aquí no hace falta resolver. Primero lo hacemos visible.</div><textarea id="capture" class="field area" placeholder="¿Qué tienes dando vueltas en la cabeza?"></textarea><button class="action primary" onclick="addInbox()"><b>Guardar fuera de mi cabeza</b></button><div id="items">'+s.inbox.map((x,i)=>'<div class="item"><span style="flex:1">'+esc(x)+'</span><button onclick="delInbox('+i+')">×</button></div>').join('')+'</div>')}function addInbox(){let v=document.getElementById('capture').value.trim();if(v){s.inbox.unshift(v);save();inbox()}}function delInbox(i){s.inbox.splice(i,1);save();inbox()}function today(){shell('Mis 3 de hoy','<div class="sub">Si haces estas tres, el día ya tuvo dirección.</div>'+[0,1,2].map(i=>'<label class="muted">Prioridad '+(i+1)+'</label><input class="field" value="'+esc(s.today[i])+'" placeholder="Una cosa concreta" onchange="setToday('+i+',this.value)">').join('')+'<div class="notice">No añadas una cuarta. Lo demás puede esperar o ir a “Sacar de mi cabeza”.</div>')}function setToday(i,v){s.today[i]=v;save()}function work(){shell('Trabajo','<div class="grid"><button class="action" onclick="go(\'emails\')"><b>✉️ Correos</b><span>Qué llegó, qué requiere respuesta y qué puede esperar.</span></button><button class="action" onclick="go(\'reports\')"><b>📄 Informes de vacunación</b><span>Registro simple de pendientes.</span></button></div><h2>Pendientes de trabajo</h2><div class="row"><input id="w" class="field" placeholder="Nuevo pendiente"><button class="gear" onclick="addWork()">Añadir</button></div>'+s.work.map((x,i)=>'<div class="item '+(x.done?'done':'')+'"><input type="checkbox" '+(x.done?'checked':'')+' onchange="toggleWork('+i+')"><span style="flex:1">'+esc(x.text)+'</span><button onclick="delWork('+i+')">×</button></div>').join(''))}function addWork(){let e=document.getElementById('w');if(e.value.trim()){s.work.push({text:e.value.trim(),done:false});save();work()}}function toggleWork(i){s.work[i].done=!s.work[i].done;save();work()}function delWork(i){s.work.splice(i,1);save();work()}function emails(){shell('Correos','<div class="sub">Este centro no lee tu correo automáticamente. Aquí puedes ordenar lo que necesita atención sin inventar información.</div><div class="grid"><div class="card"><b>1 · ¿Requiere respuesta?</b><span class="muted">Si no, archivar o dejar para después.</span></div><div class="card"><b>2 · ¿Tiene fecha límite?</b><span class="muted">Si sí, conviértelo en una acción concreta.</span></div><div class="card"><b>3 · ¿Qué respuesta mínima sirve?</b><span class="muted">No todo correo necesita una respuesta perfecta.</span></div></div>')}function reports(){shell('Informes de vacunación','<div class="notice">Módulo de organización. No contiene datos reales hasta que Zary los registre.</div><textarea class="field area" placeholder="Pendientes, fechas o notas" onchange="s.reports=this.value;save()">'+esc(s.reports||'')+'</textarea>')}function order(){shell('Ordenar algo','<div class="sub">No intentes resolver todo a la vez. Completa estas tres frases.</div><label class="muted">Lo que está pasando</label><textarea id="o1" class="field area" placeholder="Hechos, sin tener que explicarlos perfectos"></textarea><label class="muted">Lo que más pesa ahora</label><input id="o2" class="field" placeholder="Una sola cosa"><label class="muted">El siguiente paso más pequeño</label><input id="o3" class="field" placeholder="Algo que puedas hacer"><button class="action primary" onclick="saveOrder()"><b>Guardar claridad</b></button>')}function saveOrder(){let a=[o1.value,o2.value,o3.value].map(x=>x.trim()).filter(Boolean).join(' → ');if(a){s.notes.unshift(a);save();alert('Guardado. Ya no tienes que sostenerlo todo en la cabeza.');home()}}function closeDay(){shell('Cerrar mi día','<div class="sub">Lo que no terminó hoy no tiene que quedarse abierto en tu cabeza.</div><textarea class="field area" placeholder="¿Qué queda pendiente y puede esperar hasta mañana?" onchange="s.close=this.value;save()">'+esc(s.close||'')+'</textarea><button class="action primary" onclick="home()"><b>Cerrar por hoy</b><span>Mañana puedes volver a mirar el mapa.</span></button>')}function week(){shell('Mi semana','<div class="sub">Una vista ligera: compromisos, una prioridad y algo que puede esperar.</div><textarea class="field area" placeholder="Esta semana..." onchange="s.week=this.value;save()">'+esc(s.week||'')+'</textarea><div class="notice">Trabajado ≠ terminado. Puedes volver a mirar lo que cambie.</div>')}function settings(){shell('Configuración y privacidad','<div class="card"><b>Datos</b><span class="muted">La información que escribes se guarda localmente en este navegador cuando el dispositivo lo permite. Esta versión no envía tus notas a un servidor.</span></div><div class="card"><b>Versión</b><span class="muted">Centro de Control Personal Zary v1.4 · OREV®</span></div><button class="action danger" onclick="wipe()"><b>Borrar datos guardados en este dispositivo</b><span>Esta acción no se puede deshacer.</span></button>')}function wipe(){if(confirm('¿Seguro que quieres borrar los datos guardados en este dispositivo?')){s={inbox:[],today:['','',''],work:[],notes:[],close:'',week:''};try{localStorage.removeItem(KEY)}catch(e){}save();home()}}function go(x){({home,inbox,today,work,emails,reports,order,close:closeDay,week,settings}[x]||home)();scrollTo(0,0)}window.addEventListener('error',e=>console.log('Zary app error',e.message));home();</script></body></html>
