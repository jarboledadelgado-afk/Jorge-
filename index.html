<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#667557"><meta name="apple-mobile-web-app-capable" content="yes"><title>Centro de Control Zary v1.6.2</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f0e6;color:#292923;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:600px;margin:auto;min-height:100vh;padding:calc(14px + env(safe-area-inset-top)) 16px calc(92px + env(safe-area-inset-bottom))}header{display:flex;justify-content:space-between;align-items:center;padding:8px 0 14px}.brand{font-weight:800}.small,.muted{font-size:12px;color:#777}button,input,textarea,select{font:inherit}.gear,.chip{border:1px solid #d9cfbf;background:#fffaf2;border-radius:999px;padding:9px 12px}h1,h2,h3{font-family:Georgia,serif}h1{font-size:34px;margin:20px 0 7px}h2{font-size:27px;margin:16px 0 7px}h3{font-size:21px}.sub{color:#6f6b62;line-height:1.45;margin-bottom:20px}.grid{display:grid;gap:11px}.action,.card{width:100%;border:1px solid #ded4c5;background:#fffaf2;border-radius:19px;padding:17px;text-align:left;color:inherit}.action b,.card b{display:block;font-size:18px;margin-bottom:4px}.primary{background:#667557;color:white;border-color:#667557}.sage{background:#dfe5d5}.rose{background:#ead8d1}.terra{background:#e4c4b4}.blue{background:#dde4e7}.field{width:100%;border:1px solid #d8cdbd;background:#fffdf8;border-radius:14px;padding:14px;font-size:16px;margin:7px 0 12px}.area{min-height:115px;resize:vertical}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.item{background:#fffaf2;border:1px solid #ded4c5;border-radius:15px;padding:13px;margin:8px 0}.notice{background:#f0e6d6;border-left:4px solid #a76f52;padding:12px;border-radius:10px;margin:12px 0;font-size:14px}.ok{background:#e5eddc;border-left:4px solid #667557;padding:12px;border-radius:10px;margin:12px 0}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(600px,100%);display:flex;background:#fffaf2ee;backdrop-filter:blur(10px);border-top:1px solid #ded4c5;padding:8px 5px calc(8px + env(safe-area-inset-bottom));z-index:10}.bottom button{flex:1;border:0;background:none;font-size:11px;padding:6px 2px}.bottom span{display:block;font-size:20px}.focus{font-size:46px;text-align:center;margin:20px}.danger{color:#8a3d35}.badge{display:inline-block;border-radius:999px;background:#e9e1d5;padding:5px 8px;font-size:11px;margin:2px}.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.kpi .card{text-align:center;padding:12px}.kpi strong{font-size:25px;display:block}.sep{height:1px;background:#e0d7c9;margin:16px 0}</style></head><body><main class="app"><header><div><div class="brand">OREV® · Zary</div><div class="small">Centro de Control Personal · v1.6.2</div></div><button class="gear" onclick="go('settings')">⚙️</button></header><div id="view"></div></main><nav class="bottom"><button onclick="go('home')"><span>🏠</span>Inicio</button><button onclick="go('work')"><span>💼</span>Trabajo</button><button onclick="go('child')"><span>👶</span>Mi niña</button><button onclick="go('house')"><span>🏡</span>Casa</button><button onclick="go('me')"><span>🌿</span>Yo</button></nav><script>const KEY='zary-control-v1-6-2';const old=['zary-control-v1-6','zary-control-center-v1-4'];const now=()=>new Date().toISOString();const blank=()=>({capture:[],work:[],child:[],partner:[],house:[],me:[],today:['','',''],weekly:'',energy:'',rest:'',focusTask:'',events:[],clinicalCases:[],paiNotes:'',completed:0});let mem={};function norm(x){let b=blank(),o=Object.assign(b,x||{});['capture','work','child','partner','house','me'].forEach(k=>o[k]=(o[k]||[]).map(v=>typeof v==='string'?{text:v,created:now(),done:false}:{done:false,...v}));return o}function load(){try{let raw=localStorage.getItem(KEY);if(!raw)for(let k of old){raw=localStorage.getItem(k);if(raw)break}return norm(raw?JSON.parse(raw):{})}catch(e){return norm(mem)}}let s=load();function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){mem=s}}const V=()=>document.getElementById('view');const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function page(t,sub,body){V().innerHTML='<h2>'+t+'</h2><div class="sub">'+sub+'</div>'+body;scrollTo(0,0)}function home(){let open=['work','child','house','partner','me'].reduce((n,k)=>n+s[k].filter(x=>!x.done).length,0);V().innerHTML='<h1>Hola, Zary.</h1><div class="sub">No tienes que resolverlo todo. ¿Qué necesitas ahora?</div><div class="kpi"><div class="card"><strong>'+open+'</strong><span class="muted">pendientes visibles</span></div><div class="card"><strong>'+s.events.length+'</strong><span class="muted">eventos guardados</span></div></div><div class="grid"><button class="action primary" onclick="go(\'capture\')"><b>✨ Necesito ordenar mi cabeza</b><span>Habla o escribe. Primero lo hacemos visible.</span></button><button class="action sage" onclick="go(\'today\')"><b>☀️ Organizar mi día</b><span>Tres prioridades reales.</span></button><button class="action terra" onclick="go(\'focus\')"><b>🎯 Necesito concentrarme</b><span>Un bloque de hiperfoco, una sola cosa.</span></button><button class="action rose" onclick="go(\'overload\')"><b>🫶 Estoy saturada</b><span>Reduce ruido y encuentra el siguiente paso.</span></button><button class="action" onclick="go(\'calendar\')"><b>📅 Calendario</b><span>Compromisos y acceso rápido a Google Calendar.</span></button><button class="action" onclick="go(\'week\')"><b>📋 Revisar mi semana</b><span>Trabajo, casa, niña, pareja y tiempo para ti.</span></button><button class="action blue" onclick="voice('capture')"><b>🎙️ Hablar</b><span>Dicta una nota sin escribir.</span></button></div>'}function listArea(title,sub,key,placeholder){page(title,sub,'<textarea id="new" class="field area" placeholder="'+placeholder+'"></textarea><div class="row"><button class="chip" onclick="voice(\''+key+'\')">🎙️ Hablar</button><button class="chip" onclick="add(\''+key+'\')">＋ Guardar</button></div><div>'+s[key].map((x,i)=>'<div class="item"><div class="row"><div style="flex:5"><b>'+esc(x.text)+'</b><div class="muted">'+age(x.created)+(x.done?' · terminado':'')+'</div></div><button class="chip" onclick="toggle(\''+key+'\','+i+')">'+(x.done?'↺':'✓')+'</button><button class="chip" onclick="del(\''+key+'\','+i+')">×</button></div></div>').join('')+'</div>')}function age(d){if(!d)return'';let n=Math.floor((Date.now()-new Date(d))/86400000);return n<=0?'hoy':n===1?'hace 1 día':'hace '+n+' días'}function add(k,v){let e=document.getElementById('new'),x=(v||e?.value||'').trim();if(x){s[k].unshift({text:x,created:now(),done:false});save();routes[k]?.()}}function toggle(k,i){s[k][i].done=!s[k][i].done;if(s[k][i].done)s.completed++;save();routes[k]?.()}function del(k,i){s[k].splice(i,1);save();routes[k]?.()}function capture(){listArea('Necesito ordenar mi cabeza','No tienes que explicarlo perfecto. Aquí capturamos antes de resolver.','capture','¿Qué está ocupando espacio en tu cabeza?')}function work(){page('💼 Trabajo','Todo lo profesional vive aquí.','<div class="grid"><button class="action" onclick="location.href=\'zary-v1.5.html\'"><b>✉️ Correo</b><span>Gmail está preparado en un módulo separado; la autorización real sigue pendiente de validar.</span></button><button class="action" onclick="go(\'clinical\')"><b>🔬 Auditoría clínica</b><span>Pregunta puntual, cronología, cierre blindado, RETINA y entregables.</span></button><button class="action" onclick="go(\'pai\')"><b>📊 PAI / Excel</b><span>Notas y flujo para informes de vacunación.</span></button><button class="action" onclick="go(\'calendar\')"><b>📅 Agenda laboral</b><span>Ver tiempo antes de aceptar más trabajo.</span></button><button class="action" onclick="go(\'worklist\')"><b>✓ Pendientes</b><span>Qué toca, qué espera y qué se puede cerrar.</span></button><button class="action terra" onclick="go(\'focus\')"><b>🎯 Hiperfoco</b><span>Terminar una cosa sin mirar el resto.</span></button></div>')}function worklist(){listArea('Pendientes de trabajo','Si algo lleva días arrastrándose, el sistema lo hace visible.','work','¿Qué queda pendiente?')}function clinical(){let cs=s.clinicalCases;page('🔬 Auditoría clínica','Interfaz segura preparada. Los expedientes no se almacenan en GitHub ni localStorage.','<div class="notice"><b>Cierre blindado:</b> antes de afirmar desenlace revisar egreso, traslado, fallecimiento, continuidad hospitalaria, fecha/hora y documento fuente.</div><input id="caseName" class="field" placeholder="Nombre o código interno del caso"><input id="clinicalFiles" class="field" type="file" multiple accept=".pdf,.xlsx,.xls,.doc,.docx,.txt"><div class="row"><button class="chip" onclick="stageClinical()">📄 Preparar expediente</button><button class="chip" onclick="clinicalPrompt()">📋 Copiar protocolo</button></div><div class="grid"><button class="action"><b>🔎 Solo necesito un dato</b><span>Salida prevista: respuesta + evidencia + página/fecha + certeza.</span></button><button class="action"><b>🧾 Resumen ejecutivo · 1 hoja</b><span>Qué pasó, hitos, diagnóstico, desenlace y vacíos.</span></button><button class="action"><b>🔬 RETINA + Red Team</b><span>Revisión independiente contra documentos fuente.</span></button><button class="action"><b>📊 Presentación Premium</b><span>Narrativa, gráficos verificables y guion.</span></button><button class="action primary" onclick="alert(\'El botón queda bloqueado hasta conectar una capa privada de procesamiento clínico. No voy a fingir una auditoría que el navegador no puede hacer.\')"><b>🚨 Ejecutar todo</b><span>Bloqueado hasta procesamiento privado validado.</span></button></div><h3>Casos preparados</h3>'+(cs.length?cs.map(x=>'<div class="item"><b>'+esc(x.name)+'</b><div class="muted">'+x.count+' archivo(s) seleccionados · no almacenados</div></div>').join(''):'<p class="muted">Ningún caso preparado todavía.</p>')+'<div class="ok">Los archivos seleccionados permanecen en el dispositivo; esta versión no los sube automáticamente.</div>')}function stageClinical(){let f=document.getElementById('clinicalFiles').files,n=document.getElementById('caseName').value.trim()||'Caso sin nombre';if(!f.length)return alert('Selecciona al menos un archivo.');s.clinicalCases.unshift({name:n,count:f.length,created:now()});s.clinicalCases=s.clinicalCases.slice(0,10);save();alert('Expediente preparado. Los archivos no se han almacenado en la aplicación.');clinical()}function clinicalPrompt(){let t='AUDITORÍA CLÍNICA — CIERRE BLINDADO\nSeparar HECHO DOCUMENTADO / INTERPRETACIÓN / INFORMACIÓN FALTANTE. Revisar cronología completa. Verificar diagnósticos confirmados, sospechados, descartados y no documentados. Antes del cierre comprobar egreso, traslado, fallecimiento, continuidad hospitalaria, fecha/hora y documento fuente. Ejecutar RETINA y Red Team antes de emitir conclusión. No inventar desenlace.';navigator.clipboard?.writeText(t);alert('Protocolo copiado para usarlo con el expediente en un entorno privado de análisis.')}function pai(){page('📊 PAI / Excel','Organiza el trabajo PAI sin reconstruir cifras desde capturas.','<textarea class="field area" onchange="s.paiNotes=this.value;save()" placeholder="Pendientes, periodos, responsables, archivos que faltan…">'+esc(s.paiNotes)+'</textarea><button class="action" onclick="go(\'worklist\')"><b>＋ Convertir algo en pendiente</b></button><div class="notice">La auditoría real de fórmulas y coberturas requiere el archivo Excel original.</div>')}function child(){listArea('👶 Mi niña','Citas, compras, documentos, fechas y cosas que no quieres olvidar.','child','Algo de mi niña que quiero recordar…')}function partner(){listArea('❤️ Pareja','Planes, acuerdos, conversaciones y pendientes compartidos.','partner','Algo que quiero recordar, hablar u organizar…')}function house(){listArea('🏡 Casa','Compras, cocina, limpieza, pagos, reparaciones y organización.','house','Ej.: comprar detergente, organizar habitación…')}function me(){page('🌿 Yo','Tu espacio cuenta antes de llenar todo de obligaciones.','<div class="grid"><button class="action primary" onclick="go(\'capture\')"><b>🧠 Ordenar mi cabeza</b><span>Hablar o escribir lo que pesa.</span></button><button class="action" onclick="go(\'personal\')"><b>🌱 Tiempo para mí</b><span>Descanso, energía y cosas que quiero hacer por mí.</span></button><button class="action" onclick="go(\'partner\')"><b>❤️ Pareja</b><span>Conversaciones, acuerdos y planes.</span></button><button class="action" onclick="go(\'week\')"><b>📋 Mi semana</b><span>Ver la carga completa.</span></button></div>')}function personal(){listArea('🌱 Tiempo para mí','No todo tiene que convertirse en productividad.','me','Algo que necesito o quiero hacer por mí…')}function today(){let candidates=[...s.work,...s.house,...s.child,...s.me].filter(x=>!x.done).slice(0,5);page('☀️ Mis 3 de hoy','Tres prioridades reales. Antes mira si tu calendario ya está lleno.',[0,1,2].map(i=>'<label class="muted">Prioridad '+(i+1)+'</label><input class="field" value="'+esc(s.today[i])+'" onchange="s.today['+i+']=this.value;save()" placeholder="Una acción concreta">').join('')+(candidates.length?'<div class="card"><b>Pendientes que podrías considerar</b>'+candidates.map(x=>'<span class="badge">'+esc(x.text)+'</span>').join('')+'</div>':'')+'<button class="action" onclick="go(\'calendar\')"><b>📅 Revisar calendario primero</b></button>')}let timer=null,left=0;function focus(){page('🎯 Modo Hiperfoco','Una tarea. Un bloque. Después se detiene y decides.','<input id="ft" class="field" value="'+esc(s.focusTask)+'" placeholder="¿Qué quiero terminar?"><div class="row"><button class="chip" onclick="startFocus(25)">25 min</button><button class="chip" onclick="startFocus(45)">45 min</button><button class="chip" onclick="startFocus(60)">60 min</button></div><div id="clock" class="focus">—</div><div class="row"><button class="chip" onclick="finishFocus(true)">✓ Terminé</button><button class="chip" onclick="finishFocus(false)">■ Parar y guardar avance</button></div>')}function startFocus(m){s.focusTask=document.getElementById('ft').value.trim();save();clearInterval(timer);left=m*60;beep();tick();timer=setInterval(()=>{left--;tick();if(left<=0){clearInterval(timer);beep();setTimeout(beep,300);alert('Bloque terminado. Guarda el avance y haz una pausa antes de decidir si necesitas otro.')}},1000)}function tick(){let e=document.getElementById('clock');if(e)e.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0')}function finishFocus(done){clearInterval(timer);beep();if(done)s.completed++;save();home()}function beep(){try{let a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);g.gain.value=.05;o.frequency.value=880;o.start();o.stop(a.currentTime+.16)}catch(e){}}function overload(){page('🫶 Estoy saturada','No vamos a organizar toda tu vida. Solo bajar el ruido.','<textarea id="ov" class="field area" placeholder="¿Qué está pesando más ahora?"></textarea><button class="action primary" onclick="saveOverload()"><b>Guardar y volver a solo 3 prioridades</b></button><div class="notice">Este acompañamiento ayuda a ordenar y priorizar; no diagnostica. Si existe una emergencia o riesgo inmediato, usa ayuda profesional o de emergencia.</div>')}function saveOverload(){let x=document.getElementById('ov').value.trim();if(x){s.capture.unshift({text:x,created:now(),done:false});save();today()}}function calendar(){let list=s.events.sort((a,b)=>a.start.localeCompare(b.start));page('📅 Calendario','Registra compromisos aquí y envíalos a Google Calendar. La lectura automática del calendario de Zary requiere OAuth validado.','<input id="evTitle" class="field" placeholder="Evento o cita"><label class="muted">Inicio</label><input id="evStart" class="field" type="datetime-local"><label class="muted">Fin</label><input id="evEnd" class="field" type="datetime-local"><select id="evArea" class="field"><option>💼 Trabajo</option><option>👶 Mi niña</option><option>❤️ Pareja</option><option>🏡 Casa</option><option>🌿 Yo</option></select><button class="action primary" onclick="addEvent()"><b>＋ Guardar compromiso</b></button><div class="sep"></div>'+list.map((e,i)=>'<div class="item"><b>'+esc(e.title)+'</b><div class="muted">'+esc(e.area)+' · '+new Date(e.start).toLocaleString('es')+'</div><div class="row"><button class="chip" onclick="googleEvent('+i+')">Google Calendar ↗</button><button class="chip" onclick="delEvent('+i+')">×</button></div></div>').join('')+'<div class="notice">Pendiente técnico: sincronización bidireccional con Google Calendar. No se declara conectada hasta probarla con la cuenta de Zary.</div>')}function addEvent(){let t=evTitle.value.trim(),st=evStart.value,en=evEnd.value;if(!t||!st)return alert('Escribe el evento y la hora de inicio.');if(!en)en=new Date(new Date(st).getTime()+3600000).toISOString().slice(0,16);s.events.push({title:t,start:st,end:en,area:evArea.value});save();calendar()}function delEvent(i){s.events.splice(i,1);save();calendar()}function gdate(x){return new Date(x).toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'')}function googleEvent(i){let e=s.events[i],u='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(e.title)+'&dates='+gdate(e.start)+'/'+gdate(e.end)+'&details='+encodeURIComponent('Centro de Control Zary · '+e.area);window.open(u,'_blank')}function week(){let all=['work','child','house','partner','me'],open={},oldn=0;all.forEach(k=>{open[k]=s[k].filter(x=>!x.done).length;oldn+=s[k].filter(x=>!x.done&&Date.now()-new Date(x.created)>6*86400000).length});let summary='Esta semana tienes '+(Object.values(open).reduce((a,b)=>a+b,0))+' pendientes visibles entre todas las áreas. '+(oldn?oldn+' llevan 7 días o más abiertos. Conviene decidir si se dividen, pasan a hiperfoco, dependen de alguien o dejan de ser prioridad.':'No hay pendientes visibles con más de 7 días.')+' Energía registrada: '+(s.energy||'sin registrar')+'. Descanso: '+(s.rest||'sin registrar')+'.';page('📋 Revisión semanal','La lectura se basa solo en lo que Zary haya registrado. No infiere estados emocionales no escritos.','<div class="card"><b>Resumen automático</b><p>'+esc(summary)+'</p></div><div class="kpi"><div class="card"><strong>'+open.work+'</strong><span class="muted">Trabajo</span></div><div class="card"><strong>'+open.house+'</strong><span class="muted">Casa</span></div><div class="card"><strong>'+open.child+'</strong><span class="muted">Mi niña</span></div><div class="card"><strong>'+open.partner+'</strong><span class="muted">Pareja</span></div></div><label class="muted">Energía</label><select class="field" onchange="s.energy=this.value;save();week()"><option>'+esc(s.energy||'Sin registrar')+'</option><option>Alta</option><option>Media</option><option>Baja</option></select><label class="muted">Descanso</label><select class="field" onchange="s.rest=this.value;save();week()"><option>'+esc(s.rest||'Sin registrar')+'</option><option>Bien</option><option>Regular</option><option>Poco</option></select><textarea class="field area" onchange="s.weekly=this.value;save()" placeholder="¿Qué pasó esta semana?">'+esc(s.weekly)+'</textarea><button class="action" onclick="downloadWeekly()"><b>⬇️ Guardar revisión semanal</b><span>Descarga un archivo de texto privado.</span></button>')}function downloadWeekly(){let t='REVISIÓN SEMANAL — ZARY\nFecha: '+new Date().toLocaleDateString('es')+'\n\n'+(s.weekly||'Sin notas adicionales')+'\n\nEnergía: '+(s.energy||'sin registrar')+'\nDescanso: '+(s.rest||'sin registrar');download('revision-semanal-zary.txt',t)}function voice(k){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return alert('El reconocimiento de voz web no está disponible aquí. Puedes usar el micrófono del teclado del iPhone.');let r=new SR();r.lang='es-ES';r.interimResults=false;r.onresult=e=>{let t=e.results[0][0].transcript;if(document.getElementById('new'))document.getElementById('new').value=t;else{s[k].unshift({text:t,created:now(),done:false});save();alert('Dictado convertido en texto y guardado.')}};r.onerror=()=>alert('No pude escuchar. Revisa el permiso del micrófono.');r.start()}function download(name,text){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function exportBackup(){download('zary-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(s,null,2))}function settings(){page('⚙️ Configuración y privacidad','Estado real de conexiones y datos.','<div class="ok"><b>IMPLEMENTADO</b><br>5 áreas de vida, captura, micrófono cuando el navegador lo permite, Mis 3, Hiperfoco, saturación, revisión semanal, agenda local, envío manual de eventos a Google Calendar, flujo clínico seguro y exportación local.</div><div class="notice"><b>PENDIENTE DE VALIDAR</b><br>OAuth Gmail, sincronización bidireccional con Google Calendar, creación automática de carpetas en Drive y procesamiento clínico privado.</div><div class="card"><b>Privacidad clínica</b><span class="muted">Los expedientes seleccionados no se guardan en GitHub ni localStorage. Un historial preparado solo registra nombre/código del caso y número de archivos, nunca su contenido.</span></div><button class="action" onclick="exportBackup()"><b>⬇️ Exportar copia privada</b><span>Descarga los datos personales de este navegador en JSON.</span></button><button class="action danger" onclick="wipe()"><b>Borrar datos locales</b></button>')}function wipe(){if(confirm('¿Borrar las notas y datos locales de este dispositivo?')){s=blank();old.concat([KEY]).forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});save();home()}}const routes={home,work,worklist,clinical,pai,child,partner,house,me,personal,capture,today,focus,overload,calendar,week,settings};function go(x){(routes[x]||home)()}home();</script></body></html>
