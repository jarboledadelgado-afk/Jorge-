<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#667557"><title>Centro de Control Zary v1.6.3</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f0e6;color:#292923;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:600px;margin:auto;min-height:100vh;padding:24px 16px 100px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-weight:800}.small{font-size:13px;color:#777}h1,h2{font-family:Georgia,serif}h1{font-size:34px}h2{font-size:28px}.card{display:block;width:100%;border:1px solid #ded4c5;background:#fffaf2;border-radius:19px;padding:18px;margin:11px 0;text-align:left;color:#292923;text-decoration:none;font:inherit}.card b{display:block;font-size:18px;margin-bottom:5px}.card small{font-size:14px;color:#6f6b62}.save{width:100%;border:0;border-radius:16px;background:#667557;color:white;padding:15px;font:inherit;font-weight:700;margin:8px 0}textarea,input{width:100%;border:1px solid #d8cdbd;background:#fffdf8;border-radius:14px;padding:14px;font:inherit;margin:8px 0;min-height:52px}textarea{min-height:120px}.item,.notice{background:#fffaf2;border:1px solid #ded4c5;border-radius:15px;padding:14px;margin:9px 0}.item button{float:right}.notice{border-left:4px solid #a76f52}.row{display:flex;gap:8px}.row button{flex:1;border:1px solid #d8cdbd;border-radius:999px;background:#fffaf2;padding:12px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(600px,100%);display:flex;background:#fffaf2f5;border-top:1px solid #ded4c5;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:10}.bottom button{flex:1;border:0;background:none;font-size:11px;padding:5px 1px}.bottom span{display:block;font-size:21px}#clock{text-align:center;font-size:48px;font-weight:700;margin:24px}</style></head><body><main class="app"><header><div><div class="brand">OREV® · Zary</div><div class="small">Centro de Control Personal · v1.6.3</div></div></header><div id="view"><h1>Cargando…</h1></div></main><nav class="bottom"><button onclick="go('home')"><span>🏠</span>Inicio</button><button onclick="go('work')"><span>💼</span>Trabajo</button><button onclick="go('child')"><span>👶</span>Mi niña</button><button onclick="go('house')"><span>🏡</span>Casa</button><button onclick="go('me')"><span>🌿</span>Yo</button></nav><script>const KEY='zary-v163';let s={work:[],child:[],house:[],me:[],partner:[]};try{s=Object.assign(s,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}const V=()=>document.getElementById('view');function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}function esc(x){return String(x||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function btn(k,t,d){return '<button class="card" onclick="go(\''+k+'\')"><b>'+t+'</b><small>'+d+'</small></button>'}function home(){V().innerHTML='<h1>Hola, Zary.</h1><p>¿Qué necesitas ahora?</p>'+btn('work','💼 Trabajo','Correo, auditoría, PAI y pendientes')+btn('child','👶 Mi niña','Citas, compras y cosas que recordar')+btn('house','🏡 Casa','Compras, cocina y organización')+btn('me','🌿 Yo','Ordenar mi cabeza, pareja y tiempo para mí')+btn('focus','🎯 Hiperfoco','Una tarea a la vez')}function list(k,title){V().innerHTML='<h2>'+title+'</h2><textarea id="note" placeholder="Escribe aquí..."></textarea><button class="save" onclick="add(\''+k+'\')">Guardar</button>'+(s[k]||[]).map((x,i)=>'<div class="item">'+esc(x)+' <button onclick="del(\''+k+'\','+i+')">×</button></div>').join('')}function add(k){let e=document.getElementById('note');if(e&&e.value.trim()){s[k].unshift(e.value.trim());save();go(k)}}function del(k,i){s[k].splice(i,1);save();go(k)}function work(){V().innerHTML='<h2>💼 Trabajo</h2>'+btn('tasks','✓ Pendientes','Tareas profesionales')+'<a class="card" href="zary-v1.5.html"><b>✉️ Correo</b><small>Abrir piloto Gmail</small></a>'+btn('clinical','🔬 Auditoría clínica','Cierre blindado, RETINA y entregables')+btn('pai','📊 PAI / Excel','Informes de vacunación')+btn('focus','🎯 Hiperfoco','Terminar una cosa')}function clinical(){V().innerHTML='<h2>🔬 Auditoría clínica</h2><div class="notice"><b>Cierre blindado:</b> HECHO DOCUMENTADO ≠ INTERPRETACIÓN ≠ INFORMACIÓN FALTANTE.</div>'+btn('clinical','🔎 Solo necesito un dato','Respuesta con evidencia y certeza')+btn('clinical','🧾 Resumen ejecutivo · 1 hoja','Cronología, desenlace y vacíos')+btn('clinical','🔬 RETINA + Red Team','Segunda revisión independiente')+btn('clinical','📊 Presentación Premium','Gráficos verificables y guion')+'<div class="notice">El procesamiento de historias clínicas requiere una capa privada segura. No se almacenan expedientes en este sitio público.</div>'}function me(){V().innerHTML='<h2>🌿 Yo</h2>'+btn('head','🧠 Ordenar mi cabeza','Escribir lo que pesa')+btn('partner','❤️ Pareja','Planes y conversaciones')+btn('personal','🌱 Tiempo para mí','Descanso y espacio personal')+btn('focus','🎯 Hiperfoco','Concentrarme sin sobrecarga')}let timer=null,left=0;function focus(){V().innerHTML='<h2>🎯 Hiperfoco</h2><input id="task" placeholder="¿Qué quiero terminar?"><div class="row"><button onclick="startFocus(25)">25 min</button><button onclick="startFocus(45)">45 min</button><button onclick="startFocus(60)">60 min</button></div><div id="clock">—</div><button class="save" onclick="stopFocus()">Terminar bloque</button>'}function startFocus(m){clearInterval(timer);left=m*60;tick();timer=setInterval(()=>{left--;tick();if(left<=0){clearInterval(timer);alert('Bloque terminado. Guarda el avance y descansa.')}},1000)}function tick(){let e=document.getElementById('clock');if(e)e.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0')}function stopFocus(){clearInterval(timer);home()}function pai(){V().innerHTML='<h2>📊 PAI / Excel</h2><div class="notice">Para auditar cifras y fórmulas se necesita el Excel original. No se reconstruyen datos desde capturas.</div>'+btn('tasks','Añadir pendiente PAI','Guardar una tarea profesional')}const routes={home,work,child:()=>list('child','👶 Mi niña'),house:()=>list('house','🏡 Casa'),me,partner:()=>list('partner','❤️ Pareja'),personal:()=>list('me','🌱 Tiempo para mí'),head:()=>list('me','🧠 Ordenar mi cabeza'),tasks:()=>list('work','✓ Pendientes de trabajo'),clinical,pai,focus};function go(k){(routes[k]||home)();window.scrollTo(0,0)}window.go=go;window.add=add;window.del=del;window.startFocus=startFocus;window.stopFocus=stopFocus;home();</script></body></html>
