<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#667557"><meta name="apple-mobile-web-app-capable" content="yes"><title>Centro de Control Zary v1.6</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f0e6;color:#292923;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:580px;margin:auto;min-height:100vh;padding:calc(14px + env(safe-area-inset-top)) 16px calc(90px + env(safe-area-inset-bottom))}header{display:flex;justify-content:space-between;align-items:center;padding:8px 0 16px}.brand{font-weight:800}.small,button{font:inherit}.small{font-size:12px;color:#777}.gear,.chip{border:1px solid #d9cfbf;background:#fffaf2;border-radius:999px;padding:9px 12px}h1,h2{font-family:Georgia,serif}h1{font-size:34px;margin:20px 0 7px}h2{font-size:27px}.sub{color:#6f6b62;line-height:1.45;margin-bottom:20px}.grid{display:grid;gap:11px}.action,.card{width:100%;border:1px solid #ded4c5;background:#fffaf2;border-radius:19px;padding:17px;text-align:left;color:inherit}.action b,.card b{display:block;font-size:18px;margin-bottom:4px}.primary{background:#667557;color:white;border-color:#667557}.sage{background:#dfe5d5}.rose{background:#ead8d1}.terra{background:#e4c4b4}.cream{background:#fffaf2}.blue{background:#dde4e7}.field{width:100%;border:1px solid #d8cdbd;background:#fffdf8;border-radius:14px;padding:14px;font-size:16px;margin:7px 0 12px}.area{min-height:120px}.row{display:flex;gap:8px}.row>*{flex:1}.item{background:#fffaf2;border:1px solid #ded4c5;border-radius:15px;padding:13px;margin:8px 0}.notice{background:#f0e6d6;border-left:4px solid #a76f52;padding:12px;border-radius:10px;margin:12px 0;font-size:14px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(580px,100%);display:flex;background:#fffaf2ee;backdrop-filter:blur(10px);border-top:1px solid #ded4c5;padding:8px 5px calc(8px + env(safe-area-inset-bottom));z-index:10}.bottom button{flex:1;border:0;background:none;font-size:11px;padding:6px 2px}.bottom span{display:block;font-size:20px}.focus{font-size:42px;text-align:center;margin:20px}.muted{font-size:13px;color:#777}.danger{color:#8a3d35}</style></head><body><main class="app"><header><div><div class="brand">OREV® · Zary</div><div class="small">Centro de Control Personal · v1.6</div></div><button class="gear" onclick="go('settings')">⚙️</button></header><div id="view"></div></main><nav class="bottom"><button onclick="go('home')"><span>🏠</span>Inicio</button><button onclick="go('work')"><span>💼</span>Trabajo</button><button onclick="go('child')"><span>👶</span>Mi niña</button><button onclick="go('house')"><span>🏡</span>Casa</button><button onclick="go('me')"><span>🌿</span>Yo</button></nav><script>const KEY='zary-control-v1-6';const empty=()=>({capture:[],work:[],child:[],partner:[],house:[],me:[],today:['','',''],weekly:'',energy:'',rest:'',focusTask:'',focusMinutes:25});let mem={};function load(){try{return Object.assign(empty(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return Object.assign(empty(),mem)}}let s=load();function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){mem=s}}const V=()=>document.getElementById('view');const esc=x=>String(x||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function page(t,sub,body){V().innerHTML='<h2>'+t+'</h2><div class="sub">'+sub+'</div>'+body;scrollTo(0,0)}function home(){V().innerHTML='<h1>Hola, Zary.</h1><div class="sub">No tienes que resolverlo todo. ¿Qué necesitas ahora?</div><div class="grid"><button class="action primary" onclick="go(\'capture\')"><b>✨ Necesito ordenar mi cabeza</b><span>Habla o escribe. Primero lo hacemos visible.</span></button><button class="action sage" onclick="go(\'today\')"><b>☀️ Organizar mi día</b><span>Tres prioridades reales, no una lista infinita.</span></button><button class="action terra" onclick="go(\'focus\')"><b>🎯 Necesito concentrarme</b><span>Un bloque de hiperfoco, una sola cosa.</span></button><button class="action rose" onclick="go(\'overload\')"><b>🫶 Estoy saturada</b><span>Reduce el ruido y encuentra el siguiente paso.</span></button><button class="action" onclick="go(\'week\')"><b>📅 Revisar mi semana</b><span>Trabajo, casa, niña, pareja y tiempo para ti.</span></button><button class="action blue" onclick="voice()"><b>🎙️ Hablar</b><span>Dicta una nota sin escribir.</span></button></div>'}function area(title,sub,key,placeholder){page(title,sub,'<textarea id="new" class="field area" placeholder="'+placeholder+'"></textarea><div class="row"><button class="chip" onclick="voiceTo(\''+key+'\')">🎙️ Hablar</button><button class="chip" onclick="add(\''+key+'\')">＋ Guardar</button></div><div>'+s[key].map((x,i)=>'<div class="item">'+esc(x)+' <button class="chip" style="float:right" onclick="del(\''+key+'\','+i+')">×</button></div>').join('')+'</div>')}function add(k,v){let e=document.getElementById('new'),x=(v||e?.value||'').trim();if(x){s[k].unshift(x);save();routes[k]?.();}}function del(k,i){s[k].splice(i,1);save();routes[k]?.()}function capture(){area('Necesito ordenar mi cabeza','No tienes que explicarlo perfecto. Escríbelo o dilo como salga.','capture','¿Qué está ocupando espacio en tu cabeza?')}function work(){page('💼 Trabajo','Todo lo profesional vive aquí.','<div class="grid"><button class="action" onclick="location.href=\'zary-v1.5.html\'"><b>✉️ Correo de trabajo</b><span>Conexión Gmail en piloto de solo lectura.</span></button><button class="action" onclick="go(\'clinical\')"><b>🔬 Auditoría clínica</b><span>Pregunta puntual, cronología, RETINA, resumen y presentación.</span></button><button class="action" onclick="go(\'pai\')"><b>📊 PAI / Excel</b><span>Organizar informes y futuras revisiones de archivos.</span></button><button class="action" onclick="go(\'worklist\')"><b>✓ Pendientes</b><span>Qué toca, qué espera y qué puede salir.</span></button><button class="action" onclick="go(\'focus\')"><b>🎯 Hiperfoco</b><span>Terminar una cosa sin mirar el resto.</span></button></div>')}function worklist(){area('Pendientes de trabajo','Captura tareas concretas.','work','¿Qué queda pendiente?')}function clinical(){page('🔬 Auditoría clínica','Diseñada con cierre blindado. La interfaz está lista; el procesamiento clínico automático requiere una capa segura de análisis, no se ejecuta en este sitio público.','<div class="grid"><button class="action"><b>🔎 Solo necesito un dato</b><span>Pregunta puntual + evidencia + nivel de certeza.</span></button><button class="action"><b>🧾 Resumen ejecutivo · 1 hoja</b><span>Qué pasó, cronología, evidencia, desenlace y vacíos.</span></button><button class="action"><b>🔬 Auditoría RETINA</b><span>Segunda revisión contra fuentes y contradicciones.</span></button><button class="action"><b>📊 Presentación Premium</b><span>Narrativa, gráficos verificables y guion de exposición.</span></button><button class="action primary"><b>🚨 Ejecutar todo</b><span>Se activará cuando exista procesamiento privado validado.</span></button></div><div class="notice"><b>Regla:</b> no se guardarán historias clínicas ni datos de pacientes en GitHub o localStorage. HECHO ≠ INTERPRETACIÓN ≠ INFORMACIÓN FALTANTE.</div>')}function pai(){page('📊 PAI / Excel','Módulo preparado para el flujo profesional.','<div class="notice">Para auditar fórmulas, coberturas y metas se necesita el Excel original. No se reconstruyen datos desde capturas.</div><button class="action" onclick="go(\'worklist\')"><b>Registrar pendiente PAI</b></button>')}function child(){area('👶 Mi niña','Citas, cosas que necesita, fechas y todo lo que Zary no quiere olvidar.','child','Algo de mi niña que quiero recordar…')}function partner(){area('❤️ Pareja','Planes, acuerdos, conversaciones y pendientes compartidos.','partner','Algo que quiero recordar, hablar u organizar…')}function house(){area('🏡 Casa','Compras, cocina, limpieza, pagos, reparaciones y organización doméstica.','house','Ej.: comprar detergente, organizar habitación…')}function me(){page('🌿 Yo','Tu espacio también cuenta.','<div class="grid"><button class="action primary" onclick="go(\'capture\')"><b>🧠 Ordenar mi cabeza</b><span>Hablar o escribir lo que está pesando.</span></button><button class="action" onclick="go(\'personal\')"><b>🌱 Tiempo para mí</b><span>Descanso, energía y cosas que quiero hacer por mí.</span></button><button class="action" onclick="go(\'partner\')"><b>❤️ Pareja</b><span>Conversaciones, acuerdos y planes.</span></button><button class="action" onclick="go(\'week\')"><b>📅 Mi semana</b><span>Ver la carga completa, no solo el trabajo.</span></button></div>')}function personal(){area('🌱 Tiempo para mí','No todo tiene que convertirse en productividad.','me','Algo que necesito o quiero hacer por mí…')}function today(){page('☀️ Mis 3 de hoy','Si estas tres avanzan, el día ya tuvo dirección.',[0,1,2].map(i=>'<label class="muted">Prioridad '+(i+1)+'</label><input class="field" value="'+esc(s.today[i])+'" onchange="s.today['+i+']=this.value;save()" placeholder="Una acción concreta">').join('')+'<div class="notice">Antes de llenar el día, revisa citas y compromisos. La sincronización real con Google Calendar todavía requiere autorización de Zary.</div>')}let timer=null,left=0;function focus(){page('🎯 Modo Hiperfoco','Una tarea. Un bloque. Después paramos y decidimos.','<input id="ft" class="field" value="'+esc(s.focusTask)+'" placeholder="¿Qué quiero terminar?"><div class="row"><button class="chip" onclick="startFocus(25)">25 min</button><button class="chip" onclick="startFocus(45)">45 min</button><button class="chip" onclick="startFocus(60)">60 min</button></div><div id="clock" class="focus">—</div><button class="action" onclick="stopFocus()"><b>■ Terminar bloque</b><span>Guardar el avance y salir del foco.</span></button>')}function startFocus(m){s.focusTask=document.getElementById('ft').value.trim();save();clearInterval(timer);left=m*60;beep();tick();timer=setInterval(()=>{left--;tick();if(left<=0){clearInterval(timer);beep();setTimeout(beep,300);alert('Bloque terminado. Guarda el avance y descansa antes de decidir si necesitas otro.')}},1000)}function tick(){let e=document.getElementById('clock');if(e)e.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0')}function stopFocus(){clearInterval(timer);beep();go('home')}function beep(){try{let a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);g.gain.value=.05;o.frequency.value=880;o.start();o.stop(a.currentTime+.16)}catch(e){}}function overload(){page('🫶 Estoy saturada','No vamos a organizar toda tu vida ahora. Solo encontrar el siguiente paso.','<div class="card"><b>1. ¿Qué pesa más ahora?</b><textarea id="ov" class="field area" placeholder="Dilo sin ordenar"></textarea></div><button class="action primary" onclick="saveOverload()"><b>Guardar y elegir una sola cosa</b></button><div class="notice">Si esto es una emergencia o te sientes en peligro, este centro no sustituye ayuda profesional o de emergencia.</div>')}function saveOverload(){let x=document.getElementById('ov').value.trim();if(x){s.capture.unshift(x);save();go('today')}}function week(){page('📅 Revisar mi semana','Mira la vida completa antes de decidir la próxima semana.','<label class="muted">¿Cómo estuvo mi energía?</label><select class="field" onchange="s.energy=this.value;save()"><option>'+esc(s.energy||'Sin registrar')+'</option><option>Alta</option><option>Media</option><option>Baja</option></select><label class="muted">¿Cómo estuvo mi descanso?</label><select class="field" onchange="s.rest=this.value;save()"><option>'+esc(s.rest||'Sin registrar')+'</option><option>Bien</option><option>Regular</option><option>Poco</option></select><textarea class="field area" onchange="s.weekly=this.value;save()" placeholder="¿Qué pasó esta semana?">'+esc(s.weekly)+'</textarea><div class="card"><b>Vista rápida</b><span class="muted">Trabajo: '+s.work.length+' · Mi niña: '+s.child.length+' · Casa: '+s.house.length+' · Pareja: '+s.partner.length+' · Para mí: '+s.me.length+' · En mi cabeza: '+s.capture.length+'</span></div><div class="notice">La futura revisión inteligente podrá resumir patrones solo a partir de datos autorizados. No diagnosticará ni inventará cómo te sientes.</div>')}function voice(){voiceTo('capture')}function voiceTo(k){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('El dictado por voz no está disponible en este navegador. Puedes usar el micrófono del teclado del iPhone.');return}let r=new SR();r.lang='es-ES';r.interimResults=false;r.onresult=e=>{let t=e.results[0][0].transcript;if(document.getElementById('new'))document.getElementById('new').value=t;else{s[k].unshift(t);save();alert('Nota de voz convertida a texto y guardada.')}};r.onerror=()=>alert('No pude escuchar. Revisa el permiso del micrófono.');r.start()}function settings(){page('⚙️ Configuración y privacidad','Control de datos y conexiones.','<div class="card"><b>Datos personales</b><span class="muted">Las notas de esta versión se guardan localmente en este navegador. No se suben a Drive todavía.</span></div><div class="card"><b>Google</b><span class="muted">Gmail está en piloto separado. Calendar y Drive están diseñados pero todavía no autorizados ni conectados.</span></div><div class="card"><b>Datos clínicos</b><span class="muted">Nunca se guardan expedientes clínicos en este repositorio público ni en localStorage.</span></div><button class="action danger" onclick="wipe()"><b>Borrar datos locales</b></button>')}function wipe(){if(confirm('¿Borrar las notas guardadas en este dispositivo?')){s=empty();localStorage.removeItem(KEY);save();home()}}const routes={home,work,worklist,clinical,pai,child,partner,house,me,personal,capture,today,focus,overload,week,settings};function go(x){(routes[x]||home)()}home();</script></body></html>
