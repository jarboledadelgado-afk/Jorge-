<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#667557"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Centro de Control Zary v1.8</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f0e6;color:#292923;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:620px;margin:auto;min-height:100vh;padding:calc(8px + env(safe-area-inset-top)) 16px calc(98px + env(safe-area-inset-bottom))}header{position:sticky;top:0;z-index:20;background:#f6f0e6ee;backdrop-filter:blur(10px);padding:8px 0 10px}.topline{display:flex;align-items:center;justify-content:space-between;gap:8px}.navctl{display:flex;gap:7px}.round,.chip{border:1px solid #d9cfbf;background:#fffaf2;border-radius:999px;padding:9px 11px;color:inherit}.round{min-width:40px;text-align:center}.brand{font-weight:800}.small,.muted{font-size:12px;color:#777}.toolbar{display:flex;gap:7px;margin-top:8px}.toolbar button{flex:1}.view{min-height:65vh}button,input,textarea,select{font:inherit}h1,h2,h3{font-family:Georgia,serif}h1{font-size:34px;margin:20px 0 7px}h2{font-size:27px;margin:16px 0 7px}h3{font-size:21px}.sub{color:#6f6b62;line-height:1.45;margin-bottom:18px}.grid{display:grid;gap:11px}.action,.card{width:100%;border:1px solid #ded4c5;background:#fffaf2;border-radius:19px;padding:16px;text-align:left;color:inherit}.action b,.card b{display:block;font-size:18px;margin-bottom:4px}.primary{background:#667557;color:#fff;border-color:#667557}.sage{background:#dfe5d5}.rose{background:#ead8d1}.terra{background:#e4c4b4}.blue{background:#dde4e7}.field{width:100%;border:1px solid #d8cdbd;background:#fffdf8;border-radius:14px;padding:14px;font-size:16px;margin:7px 0 10px}.area{min-height:110px;resize:vertical}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.item{background:#fffaf2;border:1px solid #ded4c5;border-radius:15px;padding:13px;margin:8px 0}.notice{background:#f0e6d6;border-left:4px solid #a76f52;padding:12px;border-radius:10px;margin:12px 0;font-size:14px}.ok{background:#e5eddc;border-left:4px solid #667557;padding:12px;border-radius:10px;margin:12px 0}.bad{background:#f5dddd;border-left:4px solid #9b4b43;padding:12px;border-radius:10px;margin:12px 0}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(620px,100%);display:flex;background:#fffaf2ee;backdrop-filter:blur(10px);border-top:1px solid #ded4c5;padding:8px 5px calc(8px + env(safe-area-inset-bottom));z-index:30}.bottom button{flex:1;border:0;background:none;font-size:11px;padding:5px 2px;color:inherit}.bottom span{display:block;font-size:20px}.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.kpi .card{text-align:center;padding:12px}.kpi strong{font-size:24px;display:block}.composer{background:#fffaf2;border:1px solid #ded4c5;border-radius:18px;padding:12px;margin:10px 0}.composer-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.attach{font-size:12px;color:#6f6b62;margin:6px 0}.focus{font-size:46px;text-align:center;margin:20px}.badge{display:inline-block;background:#e8e0d4;border-radius:999px;padding:4px 8px;font-size:11px;margin:2px}.danger{color:#8a3d35}.toast{position:fixed;left:50%;bottom:105px;transform:translateX(-50%);background:#292923;color:white;padding:10px 14px;border-radius:999px;z-index:50;display:none;max-width:90%;font-size:13px}.filebtn{position:relative;overflow:hidden}.filebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
</style></head><body>
<main class="app"><header><div class="topline"><div class="navctl"><button class="round" onclick="history.back()" aria-label="Atrás">←</button><button class="round" onclick="history.forward()" aria-label="Adelante">→</button><button class="round" onclick="go('home')" aria-label="Inicio">⌂</button></div><div style="text-align:center"><div class="brand">OREV® · Zary</div><div class="small">Centro de Control · v1.8</div></div><button class="round" onclick="go('settings')" aria-label="Ajustes">⚙️</button></div><div class="toolbar"><button class="chip" onclick="go('search')">🔎 Buscar</button><button class="chip" onclick="quickVoice()">🎙️ Hablar</button><button class="chip" onclick="go('dailylog')">🗣️ Mi día</button></div></header><div id="view" class="view"></div></main>
<nav class="bottom"><button onclick="go('home')"><span>🏠</span>Inicio</button><button onclick="go('work')"><span>💼</span>Trabajo</button><button onclick="go('child')"><span>👶</span>Mi niña</button><button onclick="go('house')"><span>🏡</span>Casa</button><button onclick="go('me')"><span>🌿</span>Yo</button></nav><div id="toast" class="toast"></div>
<script>
const KEY='zary-control-v1-8', oldKeys=['zary-control-v1-7','zary-control-v1-6-3','zary-control-v1-6-2'];
const now=()=>new Date().toISOString();
const blank=()=>({capture:[],work:[],child:[],partner:[],house:[],me:[],daily:[],today:['','',''],events:[],weekly:'',energy:'',rest:'',paiNotes:'',focusTask:'',completed:0});
let mem={};function norm(x){let o=Object.assign(blank(),x||{});['capture','work','child','partner','house','me','daily'].forEach(k=>o[k]=(o[k]||[]).map(v=>typeof v==='string'?{text:v,created:now(),done:false,files:[]}:{done:false,files:[],...v}));return o}
function load(){try{let raw=localStorage.getItem(KEY);if(!raw){for(const k of oldKeys){raw=localStorage.getItem(k);if(raw)break}}return norm(raw?JSON.parse(raw):{})}catch(e){return norm(mem)}}let s=load();function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){mem=s}}
const V=()=>document.getElementById('view');const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}
let current='home';function go(route,push=true){if(!routes[route])route='home';current=route;if(push)history.pushState({route},'',location.pathname+'#'+route);routes[route]();scrollTo(0,0)}window.addEventListener('popstate',e=>go((e.state&&e.state.route)||location.hash.slice(1)||'home',false));
function page(t,sub,body){V().innerHTML='<h2>'+t+'</h2><div class="sub">'+sub+'</div>'+body}
function composer(key,placeholder){return '<div class="composer"><textarea id="txt" class="field area" placeholder="'+placeholder+'"></textarea><div id="attachInfo" class="attach">Sin archivos adjuntos</div><div class="composer-actions"><button class="chip" onclick="voiceInto(\'txt\')">🎙️ Hablar</button><label class="chip filebtn">📎 Archivo<input id="fileInput" type="file" multiple onchange="showFiles(this)"></label><label class="chip filebtn">📷 Foto<input id="photoInput" type="file" accept="image/*" capture="environment" onchange="showFiles(this)"></label></div><button class="action primary" style="margin-top:8px" onclick="saveComposer(\''+key+'\')"><b>Guardar</b><span>Se guarda en este dispositivo.</span></button></div>'}
let pendingFiles=[];function showFiles(inp){pendingFiles=[...pendingFiles,...Array.from(inp.files||[]).map(f=>({name:f.name,type:f.type,size:f.size}))];document.getElementById('attachInfo').textContent=pendingFiles.length?pendingFiles.map(f=>f.name).join(' · '):'Sin archivos adjuntos'}
function saveComposer(key){let t=(document.getElementById('txt')?.value||'').trim();if(!t&&!pendingFiles.length)return toast('Escribe, habla o adjunta algo.');let item={text:t||'[Adjunto sin texto]',created:now(),done:false,files:pendingFiles};s[key].unshift(item);pendingFiles=[];save();toast('Guardado');routes[key] ? routes[key]() : home()}
function listArea(title,sub,key,placeholder){page(title,sub,composer(key,placeholder)+'<div>'+s[key].map((x,i)=>itemHtml(key,x,i)).join('')+'</div>')}
function itemHtml(key,x,i){return '<div class="item"><b>'+esc(x.text)+'</b><div class="muted">'+age(x.created)+(x.done?' · terminado':'')+'</div>'+(x.files?.length?'<div>'+x.files.map(f=>'<span class="badge">📎 '+esc(f.name)+'</span>').join('')+'</div>':'')+'<div class="row" style="margin-top:8px"><button class="chip" onclick="toggle(\''+key+'\','+i+')">'+(x.done?'↺ Reabrir':'✓ Terminar')+'</button><button class="chip" onclick="editItem(\''+key+'\','+i+')">✏️ Editar</button><button class="chip" onclick="del(\''+key+'\','+i+')">🗑️</button></div></div>'}
function age(d){let n=Math.floor((Date.now()-new Date(d))/86400000);return n<=0?'hoy':n===1?'hace 1 día':'hace '+n+' días'}function toggle(k,i){s[k][i].done=!s[k][i].done;save();routes[k]()}function del(k,i){if(confirm('¿Eliminar este registro?')){s[k].splice(i,1);save();routes[k]()}}function editItem(k,i){let v=prompt('Editar',s[k][i].text);if(v!==null){s[k][i].text=v.trim()||s[k][i].text;save();routes[k]()}}
function home(){let open=['work','child','house','partner','me'].reduce((n,k)=>n+s[k].filter(x=>!x.done).length,0);page('Hola, Zary.','¿Qué necesitas ahora?','<div class="kpi"><div class="card"><strong>'+open+'</strong><span class="muted">pendientes abiertos</span></div><div class="card"><strong>'+s.events.length+'</strong><span class="muted">eventos anotados</span></div></div><div class="grid"><button class="action primary" onclick="go(\'dayplan\')"><b>☀️ ¿Qué me toca hoy?</b><span>Reúne prioridades, agenda y pendientes.</span></button><button class="action blue" onclick="go(\'dailylog\')"><b>🗣️ Cuéntame tu día</b><span>Habla de lo que haces para ir organizando tu rutina.</span></button><button class="action" onclick="go(\'capture\')"><b>✨ Ordenar mi cabeza</b><span>Escribe, habla, adjunta o fotografía.</span></button><button class="action terra" onclick="go(\'focus\')"><b>🎯 Hiperfoco</b><span>Una tarea, un bloque y cierre.</span></button><button class="action rose" onclick="go(\'overload\')"><b>🫶 Estoy saturada</b><span>Reducir todo a un siguiente paso.</span></button><button class="action" onclick="go(\'week\')"><b>📋 Revisar mi semana</b><span>Trabajo, casa, niña, pareja y tiempo para ti.</span></button></div>')}
function capture(){listArea('✨ Ordenar mi cabeza','Aquí no necesitas tenerlo organizado antes de contarlo.','capture','¿Qué está dando vueltas en tu cabeza?')}
function work(){page('💼 Trabajo','Correo, auditoría, PAI, agenda y pendientes.','<div class="grid"><button class="action" onclick="location.href=\'zary-v1.5.html\'"><b>✉️ Correo</b><span>Piloto Gmail separado.</span></button><button class="action" onclick="go(\'clinical\')"><b>🔬 Auditoría clínica</b><span>Cierre blindado, RETINA y entregables.</span></button><button class="action" onclick="go(\'pai\')"><b>📊 PAI / Excel</b><span>Notas, archivos y seguimiento.</span></button><button class="action" onclick="go(\'calendar\')"><b>📅 Agenda</b><span>Eventos y compromisos.</span></button><button class="action" onclick="go(\'worklist\')"><b>✓ Pendientes</b><span>Trabajo por cerrar.</span></button></div>')}
function worklist(){listArea('Pendientes de trabajo','Todo pendiente puede escribirse, dictarse o adjuntarse.','work','¿Qué queda pendiente?')}
function child(){listArea('👶 Mi niña','Citas, compras, documentos, fotos, fechas y recuerdos.','child','Algo de mi niña que quiero guardar o recordar…')}
function house(){listArea('🏡 Casa','Compras, cocina, limpieza, pagos y reparaciones.','house','¿Qué hace falta en casa?')}
function partner(){listArea('❤️ Pareja','Planes, conversaciones, acuerdos y cosas por recordar.','partner','Algo que quiero hablar, guardar u organizar…')}
function me(){page('🌿 Yo','Tu vida no es solo productividad.','<div class="grid"><button class="action primary" onclick="go(\'capture\')"><b>🧠 Ordenar mi cabeza</b><span>Lo que piensas, sientes o te preocupa.</span></button><button class="action" onclick="go(\'personal\')"><b>🌱 Tiempo para mí</b><span>Descanso, energía y cosas que quieres hacer.</span></button><button class="action" onclick="go(\'partner\')"><b>❤️ Pareja</b><span>Conversaciones, planes y acuerdos.</span></button><button class="action" onclick="go(\'dailylog\')"><b>🗣️ Mi día a día</b><span>Ir contando cómo va tu rutina.</span></button></div>')}
function personal(){listArea('🌱 Tiempo para mí','No todo tiene que convertirse en una tarea.','me','Algo que necesito o quiero hacer por mí…')}
function dailylog(){page('🗣️ Cuéntame tu día','Habla o escribe lo que vas haciendo. Esto ayuda a ver carga, tiempos y hábitos sin diagnosticar.',composer('daily','Ej.: Entré a trabajar a las 8, respondí correos, llevé a la niña…')+'<h3>Registro reciente</h3>'+s.daily.slice(0,20).map((x,i)=>itemHtml('daily',x,i)).join(''))}
function dayplan(){let tasks=[...s.work.filter(x=>!x.done).slice(0,3),...s.house.filter(x=>!x.done).slice(0,2),...s.child.filter(x=>!x.done).slice(0,2),...s.me.filter(x=>!x.done).slice(0,1)];let ev=s.events.filter(e=>e.date===new Date().toISOString().slice(0,10));page('☀️ ¿Qué me toca hoy?','Vista combinada con lo que ya has registrado. Google Calendar todavía no se lee automáticamente.','<h3>Mis 3 prioridades</h3>'+[0,1,2].map(i=>'<div class="composer"><input id="p'+i+'" class="field" value="'+esc(s.today[i])+'" placeholder="Prioridad '+(i+1)+'"><div class="composer-actions"><button class="chip" onclick="voiceInto(\'p'+i+'\')">🎙️ Hablar</button><label class="chip filebtn">📎 Archivo<input type="file" onchange="toast(\'Archivo seleccionado para esta tarea\')"></label><button class="chip" onclick="s.today['+i+']=document.getElementById(\'p'+i+'\').value;save();toast(\'Guardado\')">💾 Guardar</button></div></div>').join('')+'<h3>Agenda de hoy</h3>'+(ev.length?ev.map(e=>'<div class="item"><b>'+esc(e.title)+'</b><div class="muted">'+esc(e.time||'Sin hora')+'</div></div>').join(''):'<p class="muted">No hay eventos locales anotados para hoy.</p>')+'<h3>Pendientes que podrían competir por tu atención</h3>'+(tasks.length?tasks.map(x=>'<div class="item">'+esc(x.text)+'</div>').join(''):'<p class="muted">No hay pendientes abiertos registrados.</p>')+'<div class="notice">Cuando Google Calendar quede autorizado, esta pantalla podrá contrastar los huecos reales antes de proponer un bloque de trabajo.</div>')}
function calendar(){page('📅 Agenda','Añade compromisos y pásalos a Google Calendar.','<input id="evTitle" class="field" placeholder="Título"><div class="row"><input id="evDate" type="date" class="field"><input id="evTime" type="time" class="field"></div><div class="composer-actions"><button class="chip" onclick="voiceInto(\'evTitle\')">🎙️ Hablar</button><label class="chip filebtn">📎 Archivo<input type="file" onchange="toast(\'Adjunto seleccionado\')"></label><button class="chip" onclick="addEvent()">💾 Guardar</button></div><div style="margin-top:12px">'+s.events.map((e,i)=>'<div class="item"><b>'+esc(e.title)+'</b><div class="muted">'+esc(e.date)+' '+esc(e.time||'')+'</div><div class="row"><button class="chip" onclick="openGCal('+i+')">Google Calendar ↗</button><button class="chip" onclick="s.events.splice('+i+',1);save();calendar()">🗑️</button></div></div>').join('')+'</div>')}
function addEvent(){let t=document.getElementById('evTitle').value.trim(),d=document.getElementById('evDate').value,tm=document.getElementById('evTime').value;if(!t||!d)return toast('Falta título o fecha.');s.events.push({title:t,date:d,time:tm});save();calendar()}function openGCal(i){let e=s.events[i],dt=(e.date||'').replaceAll('-','')+(e.time?('T'+e.time.replace(':','')+'00'):'');let url='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(e.title)+'&dates='+dt+'/'+dt;window.open(url,'_blank')}
function pai(){page('📊 PAI / Excel','Aquí también puedes dictar y adjuntar el Excel original.','<textarea id="paiText" class="field area" placeholder="Notas o pendientes…">'+esc(s.paiNotes)+'</textarea><div class="composer-actions"><button class="chip" onclick="voiceInto(\'paiText\')">🎙️ Hablar</button><label class="chip filebtn">📎 Excel<input type="file" accept=".xlsx,.xls,.csv" onchange="toast(\'Excel seleccionado; no se almacena todavía\')"></label><button class="chip" onclick="s.paiNotes=document.getElementById(\'paiText\').value;save();toast(\'Guardado\')">💾 Guardar</button></div><div class="notice">La auditoría automática del Excel requerirá el archivo original y una capa de análisis segura.</div>')}
function clinical(){page('🔬 Auditoría clínica','Preparada para preguntas, resumen, RETINA y presentación.','<div class="bad"><b>Privacidad:</b> los expedientes clínicos no se guardan en GitHub ni en localStorage.</div><textarea id="clinicalQ" class="field area" placeholder="¿Qué necesitas saber del expediente?"></textarea><div class="composer-actions"><button class="chip" onclick="voiceInto(\'clinicalQ\')">🎙️ Hablar</button><label class="chip filebtn">📎 Expediente<input type="file" multiple accept=".pdf,.doc,.docx,.xlsx,.xls" onchange="toast(\'Expediente seleccionado solo en el dispositivo\')"></label><label class="chip filebtn">📷 Foto<input type="file" accept="image/*" capture="environment" onchange="toast(\'Foto seleccionada solo en el dispositivo\')"></label></div><div class="grid" style="margin-top:10px"><button class="action"><b>🔎 Solo un dato</b><span>Respuesta + evidencia + certeza.</span></button><button class="action"><b>🧾 Resumen 1 hoja</b><span>Cronología y cierre documentado.</span></button><button class="action"><b>🔬 RETINA + Red Team</b><span>Segunda revisión independiente.</span></button><button class="action"><b>📊 Presentación Premium</b><span>Gráficos y guion de exposición.</span></button></div><div class="notice">El procesamiento clínico real sigue bloqueado hasta contar con una capa privada autorizada.</div>')}
let timer=null,left=0;function focus(){page('🎯 Hiperfoco','Una sola tarea. El resto desaparece por un rato.','<input id="focusTask" class="field" value="'+esc(s.focusTask)+'" placeholder="¿Qué quiero terminar?"><div class="composer-actions"><button class="chip" onclick="voiceInto(\'focusTask\')">🎙️ Hablar</button><label class="chip filebtn">📎 Archivo<input type="file" onchange="toast(\'Archivo seleccionado para el bloque\')"></label><button class="chip" onclick="s.focusTask=document.getElementById(\'focusTask\').value;save();toast(\'Guardado\')">💾 Guardar</button></div><div class="row" style="margin-top:10px"><button class="chip" onclick="startFocus(25)">25 min</button><button class="chip" onclick="startFocus(45)">45 min</button><button class="chip" onclick="startFocus(60)">60 min</button></div><div id="clock" class="focus">—</div><button class="action" onclick="stopFocus()"><b>■ Terminar bloque</b><span>Guardar avance y salir.</span></button>')}
function startFocus(m){s.focusTask=document.getElementById('focusTask').value.trim();save();clearInterval(timer);left=m*60;beep();tick();timer=setInterval(()=>{left--;tick();if(left<=0){clearInterval(timer);beep();setTimeout(beep,250);alert('Bloque terminado. Guarda el avance y descansa antes de decidir si sigues.')}},1000)}function tick(){let e=document.getElementById('clock');if(e)e.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0')}function stopFocus(){clearInterval(timer);beep();go('home')}function beep(){try{let a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);g.gain.value=.05;o.frequency.value=880;o.start();o.stop(a.currentTime+.15)}catch(e){}}
function overload(){page('🫶 Estoy saturada','No vamos a resolverlo todo. Solo encontrar la siguiente cosa.','<textarea id="over" class="field area" placeholder="Dilo como salga…"></textarea><div class="composer-actions"><button class="chip" onclick="voiceInto(\'over\')">🎙️ Hablar</button><label class="chip filebtn">📎 Archivo<input type="file" onchange="toast(\'Adjunto seleccionado\')"></label><button class="chip" onclick="let t=document.getElementById(\'over\').value.trim();if(t){s.capture.unshift({text:t,created:now(),done:false,files:[]});save();go(\'dayplan\')} ">Guardar →</button></div>')}
function week(){let counts={Trabajo:s.work.filter(x=>!x.done).length,'Mi niña':s.child.filter(x=>!x.done).length,Casa:s.house.filter(x=>!x.done).length,Pareja:s.partner.filter(x=>!x.done).length,Yo:s.me.filter(x=>!x.done).length};page('📋 Revisar mi semana','Una fotografía de lo registrado, no un diagnóstico.','<div class="kpi"><div class="card"><strong>'+Object.values(counts).reduce((a,b)=>a+b,0)+'</strong><span class="muted">abiertos</span></div><div class="card"><strong>'+s.daily.length+'</strong><span class="muted">registros del día a día</span></div></div><label class="muted">Energía</label><select id="energy" class="field"><option>'+esc(s.energy||'Sin registrar')+'</option><option>Alta</option><option>Media</option><option>Baja</option></select><label class="muted">Descanso</label><select id="rest" class="field"><option>'+esc(s.rest||'Sin registrar')+'</option><option>Bien</option><option>Regular</option><option>Poco</option></select><textarea id="weekly" class="field area" placeholder="¿Qué pasó esta semana?">'+esc(s.weekly)+'</textarea><div class="composer-actions"><button class="chip" onclick="voiceInto(\'weekly\')">🎙️ Hablar</button><label class="chip filebtn">📎 Archivo<input type="file" onchange="toast(\'Adjunto seleccionado\')"></label><button class="chip" onclick="s.energy=document.getElementById(\'energy\').value;s.rest=document.getElementById(\'rest\').value;s.weekly=document.getElementById(\'weekly\').value;save();toast(\'Semana guardada\')">💾 Guardar</button></div><div class="notice">Pendientes: '+Object.entries(counts).map(([k,v])=>k+' '+v).join(' · ')+'</div>')}
function search(){let all=[];['capture','work','child','partner','house','me','daily'].forEach(k=>s[k].forEach((x,i)=>all.push({k,i,text:x.text})));page('🔎 Buscar','Encuentra cualquier cosa que hayas guardado.','<input id="q" class="field" placeholder="Buscar…" oninput="renderSearch()"><div id="results">'+all.slice(0,20).map(r=>'<div class="item"><span class="badge">'+r.k+'</span> '+esc(r.text)+'</div>').join('')+'</div>');window._allSearch=all}function renderSearch(){let q=document.getElementById('q').value.toLowerCase(),a=(window._allSearch||[]).filter(r=>r.text.toLowerCase().includes(q));document.getElementById('results').innerHTML=a.slice(0,50).map(r=>'<div class="item"><span class="badge">'+r.k+'</span> '+esc(r.text)+'</div>').join('')}
function settings(){page('⚙️ Ajustes','Controles básicos de una aplicación normal.','<div class="card"><b>💾 Guardado</b><span class="muted">Notas personales: almacenamiento local del navegador. Adjuntos: solo nombre/metadatos; no se conserva el archivo todavía.</span></div><div class="card"><b>☁️ Nube</b><span class="muted">Drive/Calendar/Gmail requieren autorización real de Zary antes de sincronizar.</span></div><div class="card"><b>🩺 Datos clínicos</b><span class="muted">Nunca se guardan en GitHub ni localStorage.</span></div><button class="action" onclick="exportData()"><b>⬇️ Exportar copia</b><span>Descarga una copia JSON de tus datos locales.</span></button><button class="action danger" onclick="wipe()"><b>🗑️ Borrar datos locales</b><span>Requiere confirmación.</span></button>')}
function exportData(){let blob=new Blob([JSON.stringify(s,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Centro-Zary-copia-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function wipe(){if(confirm('¿Seguro que quieres borrar los datos guardados en este dispositivo?')){s=blank();localStorage.removeItem(KEY);save();home()}}
function voiceInto(id){let el=document.getElementById(id);let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Usa el micrófono del teclado: este navegador no ofrece dictado web.');if(el)el.focus();return}let r=new SR();r.lang='es-ES';r.interimResults=false;r.onresult=e=>{let t=e.results[0][0].transcript;if(el)el.value=(el.value?el.value+' ':'')+t;toast('Texto añadido por voz')};r.onerror=()=>toast('No pude escuchar. Revisa permiso del micrófono.');r.start()}function quickVoice(){go('dailylog');setTimeout(()=>voiceInto('txt'),200)}
const routes={home,capture,work,worklist,child,house,partner,me,personal,dailylog,dayplan,calendar,pai,clinical,focus,overload,week,search,settings};
if(!history.state)history.replaceState({route:'home'},'',location.pathname+'#home');go(location.hash.slice(1)||'home',false);
</script></body></html>
