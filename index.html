<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#667557"><title>Centro de Control Zary v1.8.2</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f0e6;color:#292923;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:620px;margin:auto;min-height:100vh;padding:10px 16px 96px}header{position:sticky;top:0;background:#f6f0e6ee;backdrop-filter:blur(10px);z-index:20;padding:8px 0}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.nav{display:flex;gap:6px}.round,.chip{border:1px solid #d9cfbf;background:#fffaf2;border-radius:999px;padding:10px 12px;font:inherit;color:inherit}.brand{text-align:center;font-weight:800}.small,.muted{font-size:12px;color:#777}.tools{display:flex;gap:7px;margin-top:8px}.tools button{flex:1}h1,h2,h3{font-family:Georgia,serif}h1{font-size:34px}h2{font-size:27px}.sub{color:#6f6b62;line-height:1.45;margin-bottom:18px}.grid{display:grid;gap:11px}.action,.card{width:100%;border:1px solid #ded4c5;background:#fffaf2;border-radius:18px;padding:16px;text-align:left;color:inherit;font:inherit}.action b,.card b{display:block;font-size:18px;margin-bottom:4px}.primary{background:#667557;color:#fff;border-color:#667557}.sage{background:#dfe5d5}.rose{background:#ead8d1}.terra{background:#e4c4b4}.blue{background:#dde4e7}.field{width:100%;border:1px solid #d8cdbd;background:#fffdf8;border-radius:14px;padding:14px;font-size:16px;margin:7px 0 10px}.area{min-height:105px}.row{display:flex;gap:7px;flex-wrap:wrap}.row>*{flex:1}.item{background:#fffaf2;border:1px solid #ded4c5;border-radius:15px;padding:13px;margin:8px 0}.composer{background:#fffaf2;border:1px solid #ded4c5;border-radius:18px;padding:12px}.composer-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.filebtn{position:relative;overflow:hidden}.filebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%}.notice{background:#f0e6d6;border-left:4px solid #a76f52;padding:12px;border-radius:10px;margin:12px 0;font-size:14px}.bad{background:#f5dddd;border-left:4px solid #9b4b43;padding:12px;border-radius:10px;margin:12px 0;font-size:14px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(620px,100%);display:flex;background:#fffaf2ee;border-top:1px solid #ded4c5;padding:8px 4px;z-index:30}.bottom button{flex:1;border:0;background:none;font-size:11px}.bottom span{display:block;font-size:20px}.focus{font-size:46px;text-align:center;margin:20px}.toast{position:fixed;left:50%;bottom:105px;transform:translateX(-50%);background:#292923;color:#fff;padding:10px 14px;border-radius:999px;display:none;z-index:50}</style></head><body><main class="app"><header><div class="top"><div class="nav"><button class="round" onclick="appBack()">←</button><button class="round" onclick="appNext()">→</button><button class="round" onclick="go('home')">⌂</button></div><div class="brand">OREV® · Zary<div class="small">Centro de Control · v1.8.2</div></div><button class="round" onclick="go('settings')">⚙️</button></div><div class="tools"><button class="chip" onclick="go('search')">🔎 Buscar</button><button class="chip" onclick="quickVoice()">🎙️ Hablar</button><button class="chip" onclick="go('daily')">🗣️ Mi día</button></div></header><div id="view"></div></main><nav class="bottom"><button onclick="go('home')"><span>🏠</span>Inicio</button><button onclick="go('work')"><span>💼</span>Trabajo</button><button onclick="go('child')"><span>👶</span>Mi niña</button><button onclick="go('house')"><span>🏡</span>Casa</button><button onclick="go('me')"><span>🌿</span>Yo</button></nav><div id="toast" class="toast"></div><script>
const KEY='zary-control-v1-8-2';const old=['zary-control-v1-8','zary-control-v1-7'];const blank=()=>({capture:[],work:[],child:[],house:[],me:[],partner:[],daily:[],today:['','',''],events:[],pai:'',weekly:'',focusTask:''});const now=()=>new Date().toISOString();let mem={};function norm(x){let o=Object.assign(blank(),x||{});['capture','work','child','house','me','partner','daily'].forEach(k=>o[k]=(o[k]||[]).map(v=>typeof v==='string'?{text:v,created:now(),done:false,files:[]}:{files:[],done:false,...v}));return o}function load(){try{let r=localStorage.getItem(KEY);if(!r)for(const k of old){r=localStorage.getItem(k);if(r)break}return norm(r?JSON.parse(r):{})}catch(e){return norm(mem)}}let s=load();function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){mem=s}}const V=()=>document.getElementById('view');const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1800)}let current='home',stack=['home'],forward=[];function render(r){current=r;(routes[r]||home)();scrollTo(0,0)}function go(r){if(!routes[r])r='home';if(r!==current){stack.push(r);forward=[]}render(r)}function appBack(){if(stack.length>1){forward.push(stack.pop());render(stack[stack.length-1])}else if(current!=='home'){stack=['home'];render('home')}else toast('Ya estás en Inicio')}function appNext(){if(forward.length){let r=forward.pop();stack.push(r);render(r)}else toast('No hay pantalla siguiente')}function page(t,sub,body){V().innerHTML=(current!=='home'?'<button class="action" onclick="appBack()"><b>← Volver</b><span>Regresar</span></button>':'')+'<h2>'+t+'</h2><div class="sub">'+sub+'</div>'+body}let pending=[];function composer(key,ph){return '<div class="composer"><textarea id="txt" class="field area" placeholder="'+ph+'"></textarea><div id="att" class="muted">Sin adjuntos</div><div class="composer-actions"><button class="chip" onclick="voiceInto(\'txt\')">🎙️ Hablar</button><label class="chip filebtn">📎 Archivo<input type="file" multiple onchange="files(this)"></label><label class="chip filebtn">📷 Foto<input type="file" accept="image/*" capture="environment" onchange="files(this)"></label></div><button class="action primary" style="margin-top:8px" onclick="saveItem(\''+key+'\')"><b>💾 Guardar</b></button></div>'}function files(i){pending=[...pending,...Array.from(i.files||[]).map(f=>({name:f.name,type:f.type,size:f.size}))];let e=document.getElementById('att');if(e)e.textContent=pending.length?pending.map(x=>x.name).join(' · '):'Sin adjuntos'}function saveItem(k){let t=(document.getElementById('txt')?.value||'').trim();if(!t&&!pending.length)return toast('Escribe, habla o adjunta algo');s[k].unshift({text:t||'[Adjunto]',created:now(),done:false,files:pending});pending=[];save();toast('Guardado');render(current)}function item(k,x,i){return '<div class="item"><b>'+esc(x.text)+'</b><div class="muted">'+new Date(x.created).toLocaleString('es')+'</div>'+(x.files?.length?'<div class="muted">📎 '+x.files.map(f=>esc(f.name)).join(' · ')+'</div>':'')+'<div class="row"><button class="chip" onclick="toggle(\''+k+'\','+i+')">'+(x.done?'↺ Reabrir':'✓ Terminar')+'</button><button class="chip" onclick="edit(\''+k+'\','+i+')">✏️ Editar</button><button class="chip" onclick="del(\''+k+'\','+i+')">🗑️</button></div></div>'}function listPage(t,sub,k,ph){page(t,sub,composer(k,ph)+s[k].map((x,i)=>item(k,x,i)).join(''))}function toggle(k,i){s[k][i].done=!s[k][i].done;save();render(current)}function edit(k,i){let v=prompt('Editar',s[k][i].text);if(v!==null){s[k][i].text=v.trim()||s[k][i].text;save();render(current)}}function del(k,i){if(confirm('¿Eliminar?')){s[k].splice(i,1);save();render(current)}}function home(){page('Hola, Zary.','¿Qué necesitas ahora?','<div class="grid"><button class="action primary" onclick="go(\'dayplan\')"><b>☀️ ¿Qué me toca hoy?</b><span>Prioridades, agenda y pendientes.</span></button><button class="action blue" onclick="go(\'daily\')"><b>🗣️ Cuéntame tu día</b><span>Habla de lo que haces.</span></button><button class="action" onclick="go(\'capture\')"><b>✨ Ordenar mi cabeza</b><span>Texto, voz, archivo o foto.</span></button><button class="action terra" onclick="go(\'focus\')"><b>🎯 Hiperfoco</b></button><button class="action rose" onclick="go(\'week\')"><b>📋 Revisar mi semana</b></button></div>')}function capture(){listPage('✨ Ordenar mi cabeza','Cuéntalo como salga.','capture','¿Qué tienes en la cabeza?')}function work(){page('💼 Trabajo','Todo lo profesional en un sitio.','<div class="grid"><button class="action" onclick="location.href=\'zary-v1.5.html\'"><b>✉️ Correo</b></button><button class="action" onclick="go(\'clinical\')"><b>🔬 Auditoría clínica</b></button><button class="action" onclick="go(\'pai\')"><b>📊 PAI / Excel</b></button><button class="action" onclick="go(\'calendar\')"><b>📅 Agenda</b></button><button class="action" onclick="go(\'worklist\')"><b>✓ Pendientes</b></button></div>')}function worklist(){listPage('Pendientes de trabajo','Escribe, dicta o adjunta.','work','¿Qué queda pendiente?')}function child(){listPage('👶 Mi niña','Citas, compras, documentos y recuerdos.','child','¿Qué quieres recordar?')}function house(){listPage('🏡 Casa','Compras, cocina, limpieza, pagos y reparaciones.','house','¿Qué hace falta en casa?')}function me(){page('🌿 Yo','Tu espacio personal.','<div class="grid"><button class="action" onclick="go(\'capture\')"><b>🧠 Ordenar mi cabeza</b></button><button class="action" onclick="go(\'personal\')"><b>🌱 Tiempo para mí</b></button><button class="action" onclick="go(\'partner\')"><b>❤️ Pareja</b></button><button class="action" onclick="go(\'daily\')"><b>🗣️ Mi día a día</b></button></div>')}function personal(){listPage('🌱 Tiempo para mí','Descanso y cosas para ti.','me','¿Qué necesitas para ti?')}function partner(){listPage('❤️ Pareja','Planes, conversaciones y acuerdos.','partner','¿Qué quieres hablar u organizar?')}function daily(){listPage('🗣️ Cuéntame tu día','Cuenta lo que haces para entender mejor tu rutina.','daily','Ej.: entré a trabajar, respondí correos, fui a comprar…')}function dayplan(){let open=[...s.work,...s.house,...s.child,...s.me].filter(x=>!x.done).slice(0,8);page('☀️ ¿Qué me toca hoy?','Tres prioridades y lo que ya está en tu agenda.','<div class="composer"><label class="muted">Prioridad 1</label><input id="p0" class="field" value="'+esc(s.today[0])+'"><div class="row"><button class="chip" onclick="voiceInto(\'p0\')">🎙️</button><button class="chip" onclick="saveP(0)">💾</button></div><label class="muted">Prioridad 2</label><input id="p1" class="field" value="'+esc(s.today[1])+'"><div class="row"><button class="chip" onclick="voiceInto(\'p1\')">🎙️</button><button class="chip" onclick="saveP(1)">💾</button></div><label class="muted">Prioridad 3</label><input id="p2" class="field" value="'+esc(s.today[2])+'"><div class="row"><button class="chip" onclick="voiceInto(\'p2\')">🎙️</button><button class="chip" onclick="saveP(2)">💾</button></div></div><h3>Pendientes abiertos</h3>'+open.map(x=>'<div class="item">'+esc(x.text)+'</div>').join('')+'<div class="notice">Cuando Google Calendar esté conectado, esta vista podrá ordenar el día según horarios reales.</div>')}function saveP(i){s.today[i]=document.getElementById('p'+i).value;save();toast('Guardado')}function calendar(){page('📅 Agenda','Añade citas y compromisos.','<input id="ev" class="field" placeholder="Evento"><div class="row"><button class="chip" onclick="voiceInto(\'ev\')">🎙️ Hablar</button><label class="chip filebtn">📎 Archivo<input type="file"></label></div><input id="date" type="date" class="field"><input id="time" type="time" class="field"><button class="action primary" onclick="addEvent()"><b>💾 Guardar evento</b></button>'+s.events.map((e,i)=>'<div class="item"><b>'+esc(e.title)+'</b><div class="muted">'+esc(e.date)+' '+esc(e.time||'')+'</div><button class="chip" onclick="s.events.splice('+i+',1);save();calendar()">🗑️</button></div>').join(''))}function addEvent(){let t=document.getElementById('ev').value.trim(),d=document.getElementById('date').value,tm=document.getElementById('time').value;if(!t||!d)return toast('Falta título o fecha');s.events.push({title:t,date:d,time:tm});save();calendar()}function pai(){page('📊 PAI / Excel','Notas y archivo original.','<textarea id="paiText" class="field area">'+esc(s.pai)+'</textarea><div class="composer-actions"><button class="chip" onclick="voiceInto(\'paiText\')">🎙️ Hablar</button><label class="chip filebtn">📎 Excel<input type="file" accept=".xlsx,.xls,.csv"></label><button class="chip" onclick="s.pai=document.getElementById(\'paiText\').value;save();toast(\'Guardado\')">💾 Guardar</button></div>')}function clinical(){page('🔬 Auditoría clínica','Pregunta, dicta y selecciona documentos.','<div class="bad"><b>Privacidad:</b> los expedientes no se guardan en GitHub ni localStorage.</div><textarea id="cq" class="field area" placeholder="¿Qué necesitas saber?"></textarea><div class="composer-actions"><button class="chip" onclick="voiceInto(\'cq\')">🎙️ Hablar</button><label class="chip filebtn">📎 Expediente<input type="file" multiple accept=".pdf,.doc,.docx,.xlsx,.xls"></label><label class="chip filebtn">📷 Foto<input type="file" accept="image/*" capture="environment"></label></div><div class="grid" style="margin-top:10px"><button class="action"><b>🔎 Solo un dato</b></button><button class="action"><b>🧾 Resumen 1 hoja</b></button><button class="action"><b>🔬 RETINA + Red Team</b></button><button class="action"><b>📊 Presentación Premium</b></button></div><div class="notice">El análisis automático real requiere una capa privada autorizada.</div>')}let timer=null,left=0;function focus(){page('🎯 Hiperfoco','Una tarea. Un bloque.','<input id="ft" class="field" value="'+esc(s.focusTask)+'" placeholder="¿Qué quieres terminar?"><div class="row"><button class="chip" onclick="voiceInto(\'ft\')">🎙️ Hablar</button><button class="chip" onclick="startFocus(25)">25 min</button><button class="chip" onclick="startFocus(45)">45 min</button></div><div id="clock" class="focus">—</div><button class="action" onclick="stopFocus()"><b>■ Terminar bloque</b></button>')}function startFocus(m){s.focusTask=document.getElementById('ft').value;save();clearInterval(timer);left=m*60;tick();timer=setInterval(()=>{left--;tick();if(left<=0){clearInterval(timer);alert('Bloque terminado. Haz una pausa.')}},1000)}function tick(){let e=document.getElementById('clock');if(e)e.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0')}function stopFocus(){clearInterval(timer);go('home')}function week(){page('📋 Revisar mi semana','Una vista simple de lo registrado.','<textarea id="wk" class="field area" placeholder="¿Qué pasó esta semana?">'+esc(s.weekly)+'</textarea><div class="row"><button class="chip" onclick="voiceInto(\'wk\')">🎙️ Hablar</button><label class="chip filebtn">📎 Archivo<input type="file"></label><button class="chip" onclick="s.weekly=document.getElementById(\'wk\').value;save();toast(\'Guardado\')">💾 Guardar</button></div><div class="notice">Trabajo '+s.work.filter(x=>!x.done).length+' · Casa '+s.house.filter(x=>!x.done).length+' · Mi niña '+s.child.filter(x=>!x.done).length+' · Yo '+s.me.filter(x=>!x.done).length+'</div>')}function search(){let all=[];['capture','work','child','house','me','partner','daily'].forEach(k=>s[k].forEach(x=>all.push({k,text:x.text})));page('🔎 Buscar','Busca en lo guardado.','<input id="q" class="field" placeholder="Buscar…" oninput="runSearch()"><div class="row"><button class="chip" onclick="voiceInto(\'q\')">🎙️ Hablar</button></div><div id="res"></div>');window._all=all}function runSearch(){let q=document.getElementById('q').value.toLowerCase();document.getElementById('res').innerHTML=(window._all||[]).filter(x=>x.text.toLowerCase().includes(q)).slice(0,30).map(x=>'<div class="item">'+esc(x.text)+'</div>').join('')}function settings(){page('⚙️ Ajustes','Privacidad y respaldo.','<div class="card"><b>💾 Guardado local</b><span class="muted">Notas en este navegador.</span></div><div class="card"><b>☁️ Google</b><span class="muted">Drive, Calendar y Gmail siguen pendientes de autorización completa.</span></div><button class="action" onclick="exportData()"><b>⬇️ Exportar copia</b></button>')}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'}));a.download='centro-zary-backup.json';a.click()}function voiceInto(id){let el=document.getElementById(id),SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Usa el micrófono del teclado');el?.focus();return}let r=new SR();r.lang='es-ES';r.onresult=e=>{let t=e.results[0][0].transcript;if(el)el.value=(el.value?el.value+' ':'')+t};r.onerror=()=>toast('Revisa permiso del micrófono');r.start()}function quickVoice(){go('daily');setTimeout(()=>voiceInto('txt'),150)}const routes={home,capture,work,worklist,child,house,me,personal,partner,daily,dayplan,calendar,pai,clinical,focus,week,search,settings};render('home');
</script></body></html>
