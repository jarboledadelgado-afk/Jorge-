<style>
*{box-sizing:border-box}body{margin:0;background:#f6f0e6;color:#292923;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:620px;margin:auto;min-height:100vh;padding:calc(8px + env(safe-area-inset-top)) 16px calc(98px + env(safe-area-inset-bottom))}header{position:sticky;top:0;z-index:20;background:#f6f0e6ee;backdrop-filter:blur(10px);padding:8px 0 10px}.topline{display:flex;align-items:center;justify-content:space-between;gap:8px}.navctl{display:flex;gap:7px}.round,.chip{border:1px solid #d9cfbf;background:#fffaf2;border-radius:999px;padding:9px 11px;color:inherit}.round{min-width:40px;text-align:center}.brand{font-weight:800}.small,.muted{font-size:12px;color:#777}.toolbar{display:flex;gap:7px;margin-top:8px}.toolbar button{flex:1}.view{min-height:65vh}button,input,textarea,select{font:inherit}h1,h2,h3{font-family:Georgia,serif}h1{font-size:34px;margin:20px 0 7px}h2{font-size:27px;margin:16px 0 7px}h3{font-size:21px}.sub{color:#6f6b62;line-height:1.45;margin-bottom:18px}.grid{display:grid;gap:11px}.action,.card{width:100%;border:1px solid #ded4c5;background:#fffaf2;border-radius:19px;padding:16px;text-align:left;color:inherit}.action b,.card b{display:block;font-size:18px;margin-bottom:4px}.primary{background:#667557;color:#fff;border-color:#667557}.sage{background:#dfe5d5}.rose{background:#ead8d1}.terra{background:#e4c4b4}.blue{background:#dde4e7}.field{width:100%;border:1px solid #d8cdbd;background:#fffdf8;border-radius:14px;padding:14px;font-size:16px;margin:7px 0 10px}.area{min-height:110px;resize:vertical}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.item{background:#fffaf2;border:1px solid #ded4c5;border-radius:15px;padding:13px;margin:8px 0}.notice{background:#f0e6d6;border-left:4px solid #a76f52;padding:12px;border-radius:10px;margin:12px 0;font-size:14px}.ok{background:#e5eddc;border-left:4px solid #667557;padding:12px;border-radius:10px;margin:12px 0}.bad{background:#f5dddd;border-left:4px solid #9b4b43;padding:12px;border-radius:10px;margin:12px 0}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(620px,100%);display:flex;background:#fffaf2ee;backdrop-filter:blur(10px);border-top:1px solid #ded4c5;padding:8px 5px calc(8px + env(safe-area-inset-bottom));z-index:30}.bottom button{flex:1;border:0;background:none;font-size:11px;padding:5px 2px;color:inherit}.bottom span{display:block;font-size:20px}.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.kpi .card{text-align:center;padding:12px}.kpi strong{font-size:24px;display:block}.composer{background:#fffaf2;border:1px solid #ded4c5;border-radius:18px;padding:12px;margin:10px 0}.composer-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.attach{font-size:12px;color:#6f6b62;margin:6px 0}.focus{font-size:46px;text-align:center;margin:20px}.badge{display:inline-block;background:#e8e0d4;border-radius:999px;padding:4px 8px;font-size:11px;margin:2px}.danger{color:#8a3d35}.toast{position:fixed;left:50%;bottom:105px;transform:translateX(-50%);background:#292923;color:white;padding:10px 14px;border-radius:999px;z-index:50;display:none;max-width:90%;font-size:13px}.filebtn{position:relative;overflow:hidden}.filebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
</style></head><body>
<main class="app"><header><div class="topline"><div class="navctl"><button class="round" onclick="appBack()" aria-label="Atrás">←</button><button class="round" onclick="appNext()" aria-label="Adelante">→</button><button class="round" onclick="go('home')" aria-label="Inicio">⌂</button></div><div style="text-align:center"><div class="brand">OREV® · Zary</div><div class="small">Centro de Control · v1.8.1</div></div><button class="round" onclick="go('settings')" aria-label="Ajustes">⚙️</button></div><div class="toolbar"><button class="chip" onclick="go('search')">🔎 Buscar</button><button class="chip" onclick="quickVoice()">🎙️ Hablar</button><button class="chip" onclick="go('dailylog')">🗣️ Mi día</button></div></header><div id="view" class="view"></div></main>
<nav class="bottom"><button onclick="go('home')"><span>🏠</span>Inicio</button><button onclick="go('work')"><span>💼</span>Trabajo</button><button onclick="go('child')"><span>👶</span>Mi niña</button><button onclick="go('house')"><span>🏡</span>Casa</button><button onclick="go('me')"><span>🌿</span>Yo</button></nav><div id="toast" class="toast"></div>
<script>
const KEY='zary-control-v1-8', oldKeys=['zary-control-v1-7','zary-control-v1-6-3','zary-control-v1-6-2'];
const now=()=>new Date().toISOString();
const blank=()=>({capture:[],work:[],child:[],partner:[],house:[],me:[],daily:[],today:['','',''],events:[],weekly:'',energy:'',rest:'',paiNotes:'',focusTask:'',completed:0});
let mem={};function norm(x){let o=Object.assign(blank(),x||{});['capture','work','child','partner','house','me','daily'].forEach(k=>o[k]=(o[k]||[]).map(v=>typeof v==='string'?{text:v,created:now(),done:false,files:[]}:{done:false,files:[],...v}));return o}
function load(){try{let raw=localStorage.getItem(KEY);if(!raw){for(const k of oldKeys){raw=localStorage.getItem(k);if(raw)break}}return norm(raw?JSON.parse(raw):{})}catch(e){return norm(mem)}}let s=load();function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){mem=s}}
const V=()=>document.getElementById('view');const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}
let current='home', appStack=['home'], appForward=[];function go(route,push=true){if(!routes[route])route='home';if(push&&route!==current){appStack.push(route);appForward=[];}current=route;try{history.replaceState({route},'',location.pathname+'#'+route)}catch(e){}routes[route]();scrollTo(0,0)}function appBack(){if(appStack.length>1){let leaving=appStack.pop();appForward.push(leaving);let r=appStack[appStack.length-1]||'home';current=r;routes[r]();scrollTo(0,0)}else if(current!=='home'){current='home';appStack=['home'];home();scrollTo(0,0)}else{toast('Ya estás en Inicio')}}function appNext(){if(appForward.length){let r=appForward.pop();appStack.push(r);current=r;routes[r]();scrollTo(0,0)}else toast('No hay una pantalla siguiente')}
function page(t,sub,body){V().innerHTML=(current!=='home'?'<button class="action" style="margin:4px 0 10px;padding:12px" onclick="appBack()"><b>← Volver</b><span>Regresar a la pantalla anterior</span></button>':'')+'<h2>'+t+'</h2><div class="sub">'+sub+'</div>'+body}
function composer(key,placeholder){return '<div class="composer"><textarea id="txt" class="field area" placeholder="'+placeholder+'"></textarea><div id="attachInfo" class="attach">Sin archivos adjuntos</div><div class="composer-actions"><button class="chip" onclick="voiceInto(\'txt\')">🎙️ Hablar</button><label class="chip filebtn">📎 Archivo<input id="fileInput" type="file" multiple onchange="showFiles(this)"></label><label class="chip filebtn">📷 Foto<input id="photoInput" type="file" accept="image/*" capture="environment" onchange="showFiles(this)"></label></div><button class="action primary" style="margin-top:8px" onclick="saveComposer(\''+key+'\')"><b>Guardar</b><span>Se guarda en este dispositivo.</span></button></div>'
let pendingFiles=[];function showFiles(inp){pendingFiles=[...pendingFiles,...Array.from(inp.files||[]).map(f=>({name:f.name,type:f.type,size:f.size}))];document.getElementById('attachInfo').textContent=pendingFiles.length?pendingFiles.map(f=>f.name).join(' · '):'Sin archivos adjuntos'}
function saveComposer(key){let t=(document.getElementById('txt')?.value||'').trim();if(!t&&!pendingFiles.length)return toast('Escribe, habla o adjunta algo.');let item={text:t||'[Adjunto sin texto]',created:now(),done:false,files:pendingFiles};s[key].unshift(item);pendingFiles=[];save();toast('Guardado');routes[key] ? routes[key]() : home()}
function listArea(title,sub,key,placeholder){page(title,sub,composer(key,placeholder)+'<div>'+s[key].map((x,i)=>itemHtml(key,x,i)).join('')+'</div>')}
function itemHtml(key,x,i){return '<div class="item"><b>'+esc(x.text)+'</b><div class="muted">'+age(x.created)+(x.done?' · terminado':'')+'</div>'+(x.files?.length?'<div>'+x.files.map(f=>'<span class="badge">📎 '+esc(f.name)+'</span>').join('')+'</div>':'')+'<div class="row" style="margin-top:8px"><button class="chip" onclick="toggle(\''+key+'\','+i+')">'+(x.done?'↺ Reabrir':'✓ Terminar')+'</button><button class="chip" onclick="editItem(\''+key+'\','+i+')">✏️ Editar</button><button class="chip" onclick="del(\''+key+'\','+i+')">🗑️</button></div></div>'}
function age(d){let n=Math.floor((Date.now()-new Date(d))/86400000);return n<=0?'hoy':n===1?'hace 1 día':'hace '+n+' días'}function toggle(k,i){s[k][i].done=!s[k][i].done;save();routes[k]()}function del(k,i){if(confirm('¿Eliminar este registro?')){s[k].splice(i,1);save();routes[k]()}}function editItem(k,i){let v=prompt('Editar',s[k][i].text);if(v!==null){s[k][i].text=v.trim()||s[k][i].text;save();routes[k]()}}
function home(){let open=['work','child','house','partner','me'].reduce((n,k)=>n+s[k].filter(x=>!x.done).length,0);page('Hola, Zary.','¿Qué necesitas ahora?','<div class="kpi"><div class="card"><strong>'+open+'</strong><span class="muted">pendientes abiertos</span></div><div class="card"><strong>'+s.events.length+'</strong><span class="muted">eventos anotados</span></div></div><div class="grid"><button class="action primary" onclick="go(\'dayplan\')"><b>☀️ ¿Qué me toca hoy?</b><span>Reúne prioridades, agenda y pendientes.</span></button><button class="action blue" onclick="go(\'dailylog\')"><b>🗣️ Cuéntame tu día</b><span>Habla de lo que haces para ir organizando tu rutina.</span></button><button class="action" onclick="go(\'capture\')"><b>✨ Ordenar mi cabeza</b><span>Escribe, habla, adjunta o fotografía.</span></button><button class="action terra" onclick="go(\'focus\')"><b>🎯 Hiperfoco</b><span>Una tarea, un bloque y cierre.</span></button><button class="action rose" onclick="go(\'overload\')"><b>🫶 Estoy saturada</b><span>Reducir todo a un siguiente paso.</span></button><button class="action" onclick="go(\'week\')"><b>📋 Revisar mi semana</b><span>Trabajo, casa, niña, pareja y tiempo para ti.</span></button></div>')}
function capture(){listArea('✨ Ordenar mi cabeza','Aquí no necesitas tenerlo organizado antes de contarlo.','capture','¿Qué está dando vueltas en tu cabeza?')}
function work(){page('💼 Trabajo','Correo, auditoría, PAI, agenda y pendientes.','<div class="grid"><button class="action" onclick="location.href=\'zary-v1.5.html\'"><b>✉️ Correo</b><span>Piloto Gmail separado.</span></button><button class="action" onclick="go(\'clinical\')"><b>🔬 Auditoría clínica</b><span>Cierre blindado, RETINA y entregables.</span></button><button class="action" onclick="go(\'pai\')"><b>📊 PAI / Excel</b><span>Notas, archivos y seguimiento.</span></button><button class="action" onclick="go(\'calendar\')"><b>📅 Agenda</b><span>Eventos y compromisos.</span></button><button class="action" onclick="go(\'worklist\')"><b>✓ Pendientes</b><span>Trabajo por cerrar.</span></button></div>')}
function worklist(){listArea('Pendientes de trabajo','Todo pendiente puede escribirse, dictarse o adjuntarse.','work','¿Qué queda pendiente?')}
function child(){listArea('👶 Mi niña','Citas, compras, documentos, fotos, fechas y recuerdos.','child','Algo de mi niña que quiero guardar o recordar…')}
function house(){listArea('🏡 Casa','Compras, cocina, limpieza, pagos y reparaciones.','house','¿Qué hace falta en casa?')}
function partner(){listArea('❤️ Pareja','Planes, conversaciones, acuerdos y cosas por recordar.','partner','Algo que quiero hablar, guardar u organizar…')}
function me(){page('🌿 Yo','Tu vida no es solo productividad.','<div class="grid"><button class="action primary" onclick="go(\'capture\')"><b>🧠 Ordenar mi cabeza</b><span>Lo que piensas, sientes o te preocupa.</span></button><button class="action" onclick="go(\'personal\')"><b>🌱 Tiempo para mí</b><span>Descanso, energía y cosas que quieres hacer.</span></button><button class="action" onclick="go(\'partner\')"><b>❤️ Pareja</b><span>Conversaciones, planes y acuerdos.</span></button><button class="action" onclick="go(\'dailylog\')"><b>🗣️ Mi día a día</b><span>Ir contando cómo va tu rutina.</span></button></div>')}
function personal(){listArea('🌱 Tiempo para mí','No todo tiene que convertirse en una tarea.','me','Algo que necesito o quiero hacer por mí…')}
function dailylog(){page('🗣️ Cuéntame tu día','Habla o escribe lo que vas haciendo. Esto ayuda a ver carga, tiempos y hábitos sin diagnosticar.',composer('daily','Ej.: Entré a trabajar a las 8, respondí correos, llevé a la niña…')+'<h3>Registro reciente</h3>'+s.daily.slice(0,20).map((x,i)=>itemHtml('daily',x,i)).join(''))}
function todayFields(){return [0,1,2].map(i=>'<div class="composer"><label class="muted">Prioridad '+(i+1)+'</label><input id="p'+i+'" class="field" value="'+esc(s.today[i])+'" placeholder="Una acción concreta"><div class="row"><button class="chip" onclick="voiceInto(\'p'+i+'\')">🎙️ Hablar</button><label class="chip filebtn">📎 Archivo<input type="file" onchange="toast(\'Archivo seleccionado para esta prioridad\')"></label><button class="chip" onclick="s.today['+i+']=document.getElementById(\'p'+i+'\').value;save();toast(\'Prioridad guardada\')">💾 Guardar</button></div></div>').join('')}
function dayplan(){let ev=s.events.filter(e=>e.date===new Date().toISOString().slice(0,10));let w=s.work.filter(x=>!x.done).slice(0,3),h=s.house.filter(x=>!x.done).slice(0,2),c=s.child.filter(x=>!x.done).slice(0,2);page('☀️ ¿Qué me toca hoy?','Primero compromisos; después prioridades; luego dejamos espacio para ti.',todayFields()+'<h3>Agenda anotada</h3>'+(ev.length?ev.map(e=>'<div class="item">'+esc(e.time)+' · '+esc(e.title)+'</div>').join(''):'<div class="muted">No hay eventos anotados hoy.</div>')+'<h3>Pendientes que podrían entrar</h3>'+[...w,...c,...h].map(x=>'<span class="badge">'+esc(x.text)+'</span>').join('')+'<div class="notice">Cuando Google Calendar esté conectado, esta pantalla podrá contrastar el plan con horarios reales. Hoy solo usa lo guardado en la app.</div>')}
function focus(){page('🎯 Hiperfoco','Una tarea, un bloque y después una decisión.','<div class="composer"><input id="focusText" class="field" value="'+esc(s.focusTask)+'" placeholder="¿Qué quiero terminar?"><div class="row"><button class="chip" onclick="voiceInto(\'focusText\')">🎙️ Hablar</button><label class="chip filebtn">📎 Archivo<input type="file" onchange="toast(\'Archivo preparado\')"></label></div></div><div class="row"><button class="chip" onclick="startFocus(25)">25 min</button><button class="chip" onclick="startFocus(45)">45 min</button><button class="chip" onclick="startFocus(60)">60 min</button></div><div id="clock" class="focus">—</div><button class="action" onclick="stopFocus()"><b>■ Cerrar bloque</b><span>Guardar el avance y salir.</span></button>')}
let timer=null,left=0;function startFocus(m){s.focusTask=document.getElementById('focusText').value.trim();save();clearInterval(timer);left=m*60;beep();tick();timer=setInterval(()=>{left--;tick();if(left<=0){clearInterval(timer);beep();setTimeout(beep,250);alert('Bloque terminado. Guarda el avance y toma una pausa antes de decidir otro bloque.')}},1000)}function tick(){let e=document.getElementById('clock');if(e)e.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0')}function stopFocus(){clearInterval(timer);beep();go('home')}function beep(){try{let a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);g.gain.value=.05;o.frequency.value=880;o.start();o.stop(a.currentTime+.16)}catch(e){}}
function overload(){page('🫶 Estoy saturada','No organizaremos todo ahora. Solo una cosa.',composer('capture','¿Qué pesa más en este momento?')+'<div class="notice">Si existe una emergencia o riesgo inmediato, este Centro no sustituye servicios profesionales o de emergencia.</div>')}
function calendar(){page('📅 Agenda','Anota citas y compromisos. Puedes dictar el título y adjuntar una referencia.','<div class="composer"><input id="evTitle" class="field" placeholder="Evento o cita"><div class="row"><button class="chip" onclick="voiceInto(\'evTitle\')">🎙️ Hablar</button><label class="chip filebtn">📎 Archivo<input type="file" onchange="toast(\'Archivo seleccionado\')"></label></div><input id="evDate" type="date" class="field"><input id="evTime" type="time" class="field"><button class="action primary" onclick="addEvent()"><b>💾 Guardar evento</b></button></div>'+s.events.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map((e,i)=>'<div class="item"><b>'+esc(e.title)+'</b><div class="muted">'+esc(e.date)+' · '+esc(e.time)+'</div><button class="chip" onclick="calendarLink('+i+')">Abrir en Google Calendar</button> <button class="chip" onclick="s.events.splice('+i+',1);save();calendar()">🗑️</button></div>').join('')+'<div class="notice">Abrir en Google Calendar prepara el evento; no significa que la app lea todavía el calendario completo de Zary.</div>')}
function addEvent(){let title=document.getElementById('evTitle').value.trim(),date=document.getElementById('evDate').value,time=document.getElementById('evTime').value;if(!title||!date)return toast('Falta título o fecha.');s.events.push({title,date,time:time||'09:00'});save();calendar();toast('Evento guardado')}
function calendarLink(i){let e=s.events[i],start=(e.date.replaceAll('-','')+'T'+(e.time||'09:00').replace(':','')+'00'),d=new Date(e.date+'T'+(e.time||'09:00')+':00'),end=new Date(d.getTime()+3600000),pad=n=>String(n).padStart(2,'0'),endstr=end.getFullYear()+pad(end.getMonth()+1)+pad(end.getDate())+'T'+pad(end.getHours())+pad(end.getMinutes())+'00';window.open('https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(e.title)+'&dates='+start+'/'+endstr,'_blank')}
function pai(){page('📊 PAI / Excel','Notas, archivo original y seguimiento.', '<div class="composer"><textarea id="paiText" class="field area" placeholder="Pendientes, metas, periodos, responsables…">'+esc(s.paiNotes)+'</textarea><div class="composer-actions"><button class="chip" onclick="voiceInto(\'paiText\')">🎙️ Hablar</button><label class="chip filebtn">📎 Excel<input type="file" accept=".xlsx,.xls,.csv" onchange="showGenericFile(this)"></label><label class="chip filebtn">📷 Foto<input type="file" accept="image/*" capture="environment" onchange="showGenericFile(this)"></label></div><button class="action primary" onclick="s.paiNotes=document.getElementById(\'paiText\').value;save();toast(\'PAI guardado\')"><b>💾 Guardar</b></button></div><div class="notice">Para auditar fórmulas y coberturas hace falta el Excel original. Esta versión no inventa datos a partir de capturas.</div>')}
function showGenericFile(i){toast(i.files?.[0]?.name?'Seleccionado: '+i.files[0].name:'Archivo seleccionado')}
function clinical(){page('🔬 Auditoría clínica','Pregunta, habla o prepara documentos. Los expedientes no se guardan localmente.','<div class="notice"><b>Cierre blindado:</b> egreso / traslado / fallecimiento / continuidad hospitalaria / fecha-hora / documento fuente.</div><div class="composer"><textarea id="clinicalQ" class="field area" placeholder="¿Qué necesito saber de este expediente?"></textarea><div class="composer-actions"><button class="chip" onclick="voiceInto(\'clinicalQ\')">🎙️ Hablar</button><label class="chip filebtn">📎 Expediente<input type="file" accept=".pdf,.doc,.docx" multiple onchange="clinicalFiles(this)"></label><label class="chip filebtn">📷 Foto<input type="file" accept="image/*" multiple onchange="clinicalFiles(this)"></label></div></div><div class="grid"><button class="action" onclick="clinicalProtocol(\'dato\')"><b>🔎 Solo necesito un dato</b></button><button class="action" onclick="clinicalProtocol(\'resumen\')"><b>🧾 Resumen · 1 hoja</b></button><button class="action" onclick="clinicalProtocol(\'retina\')"><b>🔬 RETINA + Red Team</b></button><button class="action" onclick="clinicalProtocol(\'ppt\')"><b>📊 Presentación Premium</b></button><button class="action primary" onclick="clinicalProtocol(\'all\')"><b>🚨 Ejecutar todo</b></button></div><div class="bad"><b>Privacidad:</b> seleccionar un expediente aquí no lo analiza ni lo sube. El procesamiento clínico real requiere una capa privada autorizada.</div>')}
function clinicalFiles(i){toast((i.files?.length||0)+' archivo(s) seleccionados. No se han subido.')}function clinicalProtocol(m){let q=document.getElementById('clinicalQ').value.trim();let labels={dato:'PREGUNTA PUNTUAL',resumen:'RESUMEN 1 HOJA',retina:'RETINA + RED TEAM',ppt:'PRESENTACIÓN PREMIUM',all:'EJECUTAR TODO'};let t=labels[m]+'\nPregunta: '+(q||'[definir]')+'\nReglas: leer expediente completo; separar HECHO/INTERPRETACIÓN/FALTANTE; trazabilidad; diagnósticos por certeza; cierre blindado; RETINA; Red Team; no inferir desenlace.';navigator.clipboard?.writeText(t);toast('Protocolo copiado para análisis privado')}
function week(){let counts=k=>s[k].filter(x=>!x.done).length;page('📋 Revisar mi semana','La revisión se basa en lo que tú registraste; no adivina cómo te sientes.','<div class="row"><div><label class="muted">Energía</label><select id="energy" class="field"><option>'+esc(s.energy||'Sin registrar')+'</option><option>Alta</option><option>Media</option><option>Baja</option></select></div><div><label class="muted">Descanso</label><select id="rest" class="field"><option>'+esc(s.rest||'Sin registrar')+'</option><option>Bien</option><option>Regular</option><option>Poco</option></select></div></div><div class="composer"><textarea id="weekText" class="field area" placeholder="¿Qué pasó esta semana?">'+esc(s.weekly)+'</textarea><div class="row"><button class="chip" onclick="voiceInto(\'weekText\')">🎙️ Hablar</button><label class="chip filebtn">📎 Archivo<input type="file" onchange="toast(\'Archivo seleccionado\')"></label><button class="chip" onclick="saveWeek()">💾 Guardar</button></div></div><div class="kpi"><div class="card"><strong>'+counts('work')+'</strong><span class="muted">Trabajo</span></div><div class="card"><strong>'+counts('house')+'</strong><span class="muted">Casa</span></div><div class="card"><strong>'+counts('child')+'</strong><span class="muted">Mi niña</span></div><div class="card"><strong>'+counts('me')+'</strong><span class="muted">Para mí</span></div></div><button class="action" onclick="downloadWeek()"><b>⬇️ Descargar revisión</b></button>')}
function saveWeek(){s.energy=document.getElementById('energy').value;s.rest=document.getElementById('rest').value;s.weekly=document.getElementById('weekText').value;save();toast('Semana guardada')}
function downloadWeek(){saveWeek();let text='REVISIÓN SEMANAL ZARY\nFecha: '+new Date().toLocaleDateString('es')+'\nEnergía: '+s.energy+'\nDescanso: '+s.rest+'\n\n'+s.weekly;download('revision-semanal-zary.txt',text,'text/plain')}
function searchPage(){let rows=[];['capture','work','child','partner','house','me','daily'].forEach(k=>s[k].forEach(x=>rows.push({k,...x})));page('🔎 Buscar','Busca en lo que has guardado.','<input id="searchQ" class="field" placeholder="Buscar…" oninput="runSearch()"><div class="row"><button class="chip" onclick="voiceInto(\'searchQ\')">🎙️ Hablar</button><label class="chip filebtn">📎 Archivo<input type="file" onchange="toast(\'Archivo seleccionado\')"></label></div><div id="results"></div>');window._rows=rows}
function runSearch(){let q=document.getElementById('searchQ').value.toLowerCase(),r=window._rows.filter(x=>x.text.toLowerCase().includes(q));document.getElementById('results').innerHTML=q?r.slice(0,30).map(x=>'<div class="item"><span class="badge">'+x.k+'</span> '+esc(x.text)+'</div>').join(''):''}
function settings(){page('⚙️ Ajustes','Privacidad, respaldo y estado de conexiones.','<div class="card"><b>Datos de esta app</b><span class="muted">Las notas se guardan localmente en este navegador.</span></div><button class="action" onclick="exportBackup()"><b>⬇️ Exportar copia privada</b><span>Descarga tus datos en JSON.</span></button><div class="card"><b>Google Calendar</b><span class="muted">Puedes preparar eventos. Lectura automática del calendario: pendiente de OAuth validado.</span></div><div class="card"><b>Google Drive</b><span class="muted">Guardado automático real: pendiente de autorización e integración.</span></div><div class="card"><b>Gmail</b><span class="muted">Piloto separado; OAuth todavía debe validarse.</span></div><div class="bad"><b>Historias clínicas:</b> no se almacenan en GitHub ni en localStorage.</div><button class="action danger" onclick="wipe()"><b>🗑️ Borrar datos locales</b></button>')}
function exportBackup(){download('centro-zary-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(s,null,2),'application/json')}function download(name,data,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function wipe(){if(confirm('¿Borrar los datos guardados en este dispositivo?')){localStorage.removeItem(KEY);s=blank();save();go('home');toast('Datos locales borrados')}}
function voiceInto(id){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Usa el micrófono del teclado: este navegador no ofrece dictado web.');document.getElementById(id)?.focus();return}let r=new SR();r.lang='es-ES';r.interimResults=false;r.onresult=e=>{let el=document.getElementById(id);if(el){let t=e.results[0][0].transcript;el.value=(el.value?el.value+' ':'')+t;el.dispatchEvent(new Event('input'));toast('Dictado añadido')}};r.onerror=()=>toast('No pude escuchar. Revisa permiso del micrófono.');r.start()}
function quickVoice(){go('capture');setTimeout(()=>voiceInto('txt'),150)}
const routes={home,work,worklist,child,house,partner,me,personal,capture,daily:dailylog,dailylog,dayplan,focus,overload,calendar,pai,clinical,week,search:searchPage,settings};
let initial=location.hash.slice(1);if(initial&&routes[initial])go(initial,false);else home();
</script></body></html>
